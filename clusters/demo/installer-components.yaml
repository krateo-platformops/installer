# Demo's installer-chart `components` list, under review.
#
# WHY THIS FILE EXISTS. On 2026-11-25 I patched demo's Installer CR to move selfservice-krateo from
# 0.2.69 to 0.2.73 (acme and globex were restarting every ~3 hours, throttled at a 4-CPU control
# plane limit; 0.2.73 raises it to 6). The CR took it. But demo's `installer` release -- the
# BOOTSTRAP one, 27 components -- still carried selfservice-krateo 0.2.61, TWELVE versions behind,
# and its post-upgrade patch writes values.components over the CR's entries. So a `helm upgrade` of
# that release would have reverted the fix and restored the throttling, with every check green.
# Diego's decision: demo's values become a reviewed file here, owned by this repository.
#
# WHAT THIS FILE IS AND IS NOT. It is the `components` list ONLY. It is NOT demo's whole values.
# The rest -- componentValues, features, exposure, registryAuth, vertexAI -- is still supplied from
# wherever demo's upgrades are run today, and this file does not make a demo upgrade reproducible
# on its own.
#
# WHY ONLY THE COMPONENTS. A complete demo values file would contain a credential:
#   componentValues.krateo-observability.clickstack.clickhouse.cluster.spec.settings
#     .extraUsersConfig.users.chops.password_sha256_hex
# a 64-hex SHA-256 digest, and that field accepts no secret reference -- krateo-observability's
# schema takes the hash inline by design, which is a deliberate guard rather than an oversight. A
# credential does not go in a git repository, and an incomplete file that silently dropped it would
# be worse than none: an upgrade run from it would delete the ClickHouse user. So the components
# list, which I verified holds no credential of any shape, is what is reviewable today. The full
# file waits on a secret reference that only krateo-observability can add.
#
# THE ONE CHANGE FROM DEMO'S LIVE STATE. 26 of the 27 pins already AGREED with the CR when I
# audited them -- they were all set at the same upgrade (0.3.683, revision 72, 18 November) and
# nothing had drifted. Only selfservice-krateo differed, and only because I changed the CR today.
# So this is not a cleanup of 27 hand pins; it is 26 verbatim and one corrected:
#
#   selfservice-krateo   0.2.61 -> 0.2.73
#
# STILL OPEN, and a question for Diego rather than a defect: a pin that agrees with the CR can
# still be one nobody meant to hold. The fifteen portal pages sit at 1.8.127 while 057 runs 1.8.163,
# and frontend/frontend-crd/builder-gate at 1.8.46 against 057's 1.8.85. Whether demo is
# deliberately behind or simply unattended is not something the cluster can tell me.
components:
- apiRef:
    name: selfservice-status
    namespace: krateo-system
  chart: selfservice-krateo
  kind: SelfserviceKrateo
  name: selfservice-krateo
  namespace: krateo-bp-selfservice-krateo
  readerGroups:
  - tenants
  registerOnly: true
  repo: oci://ghcr.io/krateo-blueprints/charts
  statusDataTemplate:
  - expression: ${ (.api.portal.items[0].spec.hostnames[0] // "") as $h | if $h == "" then "" else "https://"
      + $h end }
    forPath: url
    type: string
  - expression: ${ .api.portal.items[0].metadata.annotations["krateo.io/plan"] // "" }
    forPath: plan
    type: string
  - expression: ${ .api.portal.items[0].metadata.annotations["krateo.io/trial-expires-at"] // "" }
    forPath: expiresAt
    type: string
  - expression: ${ "Open your Krateo" }
    forPath: urlLabel
    type: string
  tier: catalog
  version: 0.2.73
- chart: vcluster
  chartRepo: vcluster
  kind: Vcluster
  name: vcluster
  registerOnly: true
  repo: https://charts.loft.sh
  tier: catalog
  version: 0.36.0
