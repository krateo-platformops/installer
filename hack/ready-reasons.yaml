# The reasons a Ready condition can carry, PER KIND, and how this repo's tooling must read each.
#
# TWO NAMESPACES, AND THE SPLIT IS THE POINT. This file held one flat classification until
# 2026-11-17, implicitly about COMPOSITIONS -- its first line said so and nothing enforced it.
# core-provider then published docs/cd-ready-reasons.md (their #557, merge 7da7248) for
# CompositionDefinitions, and diffing the two sets showed a flat list cannot serve both:
#
#   ReconcilePaused   on a COMPOSITION is a Ready reason, and CONVERGED (healthy-but-paused).
#                     on a DEFINITION it is a SYNCED reason, and Ready is left as it was --
#                     so the Ready you read is STALE, not healthy.
#
# Same string, different condition, different meaning. Merging the sets would have silently
# misclassified it, which is the (kind, condition, reason) rule this repo keeps relearning: a
# reason is only meaningful as all three together, never as a bare string.
#
# Four reasons exist ONLY on the definition side and had no classification here at all until
# this split: ScaledToZero, RemoteChartUnreachable, SchemaDefaultContradiction and NotObserved.
# ScaledToZero is the dangerous one -- Ready=True and healthy, so a verification built from the
# composition set would have reported a FAILURE on a healthy definition. Exactly the shape of
# ReconcileGracefullyPaused when core-provider#517 first landed, and for the same reason: a
# classifier built from what I have observed is complete only for the clusters I have watched.
#
# Everything under `composition:` is BYTE-FOR-BYTE the previous top level, asserted by the
# commit that made this change -- the parsed content was compared field for field, not merely
# re-parsed. Only the nesting moved.
composition:
  # The reasons a composition's Ready condition can carry, and how THIS repo's tooling must read each.
  #
  # WHY THIS FILE EXISTS. Every roll verification I write asks "did these compositions converge?", and
  # every one of them needs a set of reasons that count as converged. I built that set from the reasons
  # I had MET, one incident at a time -- and on 2026-11-15 I met three in a single day (ObserveFailed,
  # HelmOperationInProgress, PendingHelmOperation), each time by misreading a healthy or settling
  # cluster as a broken one. The worst of them had me one command away from `helm rollback` on an
  # umbrella managing 137 live children.
  #
  # core-provider#515 asked for a table generated from their code, and #517 delivered it:
  # docs/ready-reasons.md on core-provider main, 14 rows, regenerated by a test that refuses any Ready
  # condition constructed outside internal/readyreason. Diffing my set against it immediately found a
  # reason I was missing -- ReconcileGracefullyPaused, which is Ready=True and rolls up healthy, and
  # which my verification would have reported as a FAILURE on a healthy cluster. It has never appeared
  # on krateo-057, which is exactly why I had not noticed: a classifier built from observation is
  # complete only for the clusters you have watched.
  #
  # So this file is vendored rather than fetched at use time: tooling must not depend on a network read
  # to decide whether a cluster is healthy. check-ready-reasons-current.py compares it against
  # core-provider's generated file and fails on drift, so the copy is checked rather than trusted.
  #
  # ONE DELIBERATE DIFFERENCE from core-provider's rollup, stated rather than hidden. ZeroEvidence and
  # ObserveFailed are Unknown, and their `krateoReady` verdict is "unevaluated (rolls up as healthy)" --
  # a PARENT counts such a child healthy. This repo's tooling counts them NOT converged, because the
  # question a roll verification asks is "did this composition converge?", not "should its parent count
  # it?". Consequence to expect: an umbrella may report Ready=True/Available while a per-composition
  # check flags one of its children, and neither is wrong.
  #
  # AND READ `Synced`, NOT JUST THE REASON. Both healthy-paused reasons pair with Synced != True
  # (ReconcilePaused writes Synced=False/ReconcilePaused; ReconcileGracefullyPaused is documented the
  # same way). A reason-based rule cannot express that: unstructured-runtime declares two constants
  # whose string VALUE is both "ReconcilePaused", written on Ready and on Synced respectively. The
  # chart's inst.readyFromConditions already requires Synced=True and so withholds both from a
  # dependency gate; verification tooling must do the same or it will accept a composition that is
  # healthy-but-not-maintained.
  #
  # Measured on krateo-057, 2026-11-15, installer 0.3.653 / core-provider 2.13.100, 86 compositions:
  #   Available/True                 69
  #   AvailablePartialCoverage/True  15
  #   ReconcilePaused/True            1   (AcmeFeedback/acme-feedback-controller, Synced=ReconcilePaused)
  #   HelmOperationInProgress/False   1   -> GONE 70s later. It is written before an install or
  #                                          uninstall, so a SNAPSHOT of a healthy cluster can catch it.
  #                                          Any check that fails on a converging reason without a
  #                                          re-read will produce false failures at some rate.
  # 4 of the 14 rows were live; 10 have never appeared on this cluster.

  # EVERY CONDITION TYPE A COMPOSITION CARRIES -- not just Ready.
  #
  # WHY THIS SECTION EXISTS. Every verification I wrote on 2026-11-15 read `Ready`, and sometimes
  # `Synced`. That is TWO of FOUR. agentiko-mcp-server handed me a `CannotObserveExternalResource`
  # Warning on the Installer composition to judge; reading its conditions properly to answer them is
  # the only reason I discovered the other two exist.
  #
  # RBACComplete IS THE ONE THAT MATTERS, because it is exactly what the Warning threatened: two of the
  # three affected components failed with "generating RBAC using chart-inspector: ... Get
  # http://installer-core-provider-chart-inspector...". If RBACComplete had gone False, every
  # verification I ran that day would have reported a CLEAN CLUSTER.
  #
  # Measured across all 86 compositions on krateo-057, 2026-11-15:
  #     Ready             86/86   True/Available 70, True/AvailablePartialCoverage 15,
  #                               True/ReconcilePaused 1
  #     Synced            86/86   True/ReconcileSuccess 85, False/ReconcilePaused 1
  #     ChartRenderable   85/86   True/Renderable 85
  #     RBACComplete      85/86   True/Applied 85
  # The one object lacking the last two is AcmeFeedback/acme-feedback-controller, the paused one -- so
  # absence there is a property of being paused, not a gap.
  #
  # The ONLY non-True condition anywhere was that same object's Synced=False/ReconcilePaused, which is
  # documented upstream as the liveness half of a healthy pause.
  #
  # NOTE core-provider's generated table (core-provider#515/#517) covers the READY reasons only. The
  # reasons for the other three types are not generated anywhere, so the values below are OBSERVED, not
  # derived -- the same weakness that left ReconcileGracefullyPaused out of my Ready set until the
  # generated table existed. Asked them whether the table can cover all four types.
  # A COMPONENT CHART THAT CANNOT RENDER: where the failure lands, and where it does NOT.
  #
  # Answered from code by core-provider (kp/main 1582c05) rather than guessed, after
  # keycloak-provider-kog found that krateo-keycloak-realm 0.5.2 FAILS to render with 057's values
  # ("parentClient.redirectUris is required when parentClient.enabled" -- a deliberate refusal to
  # create a portal client nobody can sign in through).
  #
  # THE DISTINCTION I COULD NOT HAVE DERIVED, and the reason I asked instead:
  #
  #   a component chart's values.schema.json `required`
  #     -> becomes its GENERATED CRD's schema
  #     -> the apiserver REJECTS the umbrella's write of the composition CR
  #     -> the UMBRELLA'S OWN helm apply fails.  THIS is what froze krateo-demo twice.
  #
  #   a component chart's template `fail`
  #     -> is not in the schema, so the CR is ACCEPTED
  #     -> only that component's own render fails
  #     -> chart-inspector is called PER COMPOSITION with that composition and its own CD
  #        (applyDerivedRBAC, composition.go:1678). The umbrella's cdc renders ONLY the installer
  #        chart; it never renders a component's chart. So the failure CANNOT touch the umbrella's
  #        ChartRenderable or RBACComplete, and cannot stop its helm operation or its 136 siblings.
  #
  # BUT THE ROLLUP CARRIES IT UP, which is the half that matters operationally:
  #   a NEW component (e.g. the first enable of a feature): Create's render fails
  #     (composition.go:982) -> Ready=False/Creating on that component -> the umbrella reads a
  #     CONVERGING child -> umbrella Ready=False/Creating INDEFINITELY. No deadline until
  #     core-provider#498's ChildStalled ships.
  #   an ALREADY-INSTALLED component whose values later break: Observe's render failure goes through
  #     failObserveWithFinding -> Ready=False/Unavailable on the component -> umbrella
  #     Ready=False/Unavailable NAMING the child.
  #
  # SO, FOR A ROLL THAT ENABLES A FEATURE: the component's values are not a precondition for the
  # CLUSTER -- nothing wedges, nothing else stops -- but they ARE a precondition for the umbrella ever
  # reading Ready=True. Any verification gating on the umbrella's Ready, which every one of mine does,
  # will hold indefinitely. Treat required componentValues as blocking for that reason, not because
  # the cluster is at risk.

  condition_types:
    Ready:
      universal: true
      note: classified by the converged/converging/failed/unevaluated lists below.
    Synced:
      universal: true
      healthy: [ReconcileSuccess]
      # `unhealthy` means KNOWN AND NOT THE HEALTHY ONE -- it includes expected states such as a
      # deliberate pause, not only failures. The gate treats healthy|unhealthy as the known set.
      unhealthy: [ReconcileError, ReconcilePaused, ReconcileDeferred, ReconcileGracefullyPaused,
                  GracefulPausePending]
      note: >-
        a PAUSED composition reports Ready=True with Synced=False/ReconcilePaused. It was healthy when
        paused and nothing is maintaining that state now, so it must not satisfy a dependency gate.
        inst.readyFromConditions requires Synced=True for exactly this reason.
    ChartRenderable:
      universal: false   # absent on a paused composition
      healthy: [Renderable]
      unhealthy: [UnservedKind, ValuesSchemaViolation, InspectorRejected, InspectorUnavailable,
                  TemplateRefused]
      note: >-
        chart-inspector rendered the chart against this cluster.

        InspectorUnavailable IS AMBIGUOUS AND DOES NOT MEAN WHAT IT SAYS (core-provider#583,
        2026-11-18). chart-inspector's classifier is 400 = schema violation, 422 = unserved kind,
        EVERYTHING ELSE = 500; and the cdc maps every 5xx to InspectorUnavailable, documented as
        "chart-inspector itself failed; not the blueprint's fault". So A TEMPLATE'S OWN `fail`
        ARRIVES HERE AS InspectorUnavailable, attributing a deliberate refusal by THIS chart to an
        infrastructure fault. The installer has guards that fail deliberately: the
        github-provider-kog-config kinds check is one, and the namespace/readerGroups guard that
        froze krateo-057 on 0.3.674 was another.

        THE DISCRIMINATOR, from core-provider, until #583 is fixed: a 5xx whose response body
        contains `execution error at (` or `execution error in (` is THE CHART REFUSING ITS VALUES,
        not chart-inspector failing. Read the body, not the reason. Measured example, the Installer
        CR's Synced message at 2026-11-18T00:16:10Z - "unexpected status code: 500 - response body:
        {... execution error at (installer/templates/withheld-components.yaml:31:20):
        components[kyverno]: ...}".

        A 500 is also a THIRD class alongside the two transport signatures core-provider named for
        the chart-inspector termination work: `connection refused`/`i/o timeout` on the dial means
        #578 is not working, `EOF`/`connection reset by peer` while reading means #582 is missing,
        and a 5xx means the server ANSWERED. Forcing a 500 into either transport arm would report a
        termination verdict about a template error.

        Ready=False/Unavailable is CORRECT either way, because any HTTP answer is a verdict -
        including under core-provider#579's grace. Only the ChartRenderable attribution is wrong, so
        this note changes how to READ the reason, not whether it is unhealthy.

        #583 IS FIXED IN core-provider 2.13.112, AND THE STRING DISCRIMINATOR ABOVE IS NOW A FALLBACK
        FOR OLDER VERSIONS ONLY. From 2.13.112 chart-inspector answers 400 with Status reason
        "TemplateRefused" for a chart's own `fail`, and the cdc sets ChartRenderable
        False/TemplateRefused, writer composition-dynamic-controller, clearance indefinite - until the
        author changes the values or the chart (#583).

        Ready IS UNCHANGED for this class: still False/Unavailable. So every alert, rollup and gate
        keyed on Ready behaves identically, and only a reader of ChartRenderable sees the new
        information.

        WHICH SIGNAL TO READ, BY VERSION. Below 2.13.112, a 5xx whose body contains `execution error
        at (` - a STRING match on an error body, which breaks silently the day the message is
        reworded. From 2.13.112, reason == TemplateRefused with status 400 instead of 500 - a fact
        rather than a parse. KEEP BOTH while any cluster runs below 2.13.112: 057 and demo are on
        2.13.111 as of 2026-11-18, so the string discriminator is still the live one on both.

        This row exists because core-provider sent the declaration copied from their branch before
        cutting the tag, and check-ready-reasons-current failed the moment 2.13.112 published. That
        is the contract working in both directions.
    RBACComplete:
      universal: false   # absent on a paused composition
      healthy: [Applied]
      unhealthy: [ApplyFailed, NamespaceTerminating, NotEvaluated]
      note: >-
        every RBAC object derived from the chart was applied. A chart-inspector outage is what puts this
        at risk, and it is the condition a Ready-only check cannot see.

        THIS NOTE WAS LOST, not missing. It had been written one block down, inside ApiResolved, where
        it became a DUPLICATE `note:` key -- YAML keeps the last, so it silently replaced ApiResolved's
        own note and left this condition undocumented. Two defects from one misindented line, and
        repairing only ApiResolved would have discarded this text for good.

        RBACComplete REPORTS ONLY THE RBAC DERIVED FROM THE CHART (cdc rbaccomplete.go:18, #357). An
        apiRef identity's grant is generated by core-provider and surfaces on ApiResolved instead, so a
        refused apiRef read leaves THIS condition True. The two conditions are not substitutes.
    ApiResolved:
      universal: false   # only on compositions whose CompositionDefinition has an apiRef, which is
                         # why 057's census of four condition types never showed it
      healthy: [Resolved]
      open_family: true  # ONE ROW UPSTREAM IS DELIBERATELY OPEN: on a refusal, authn's own
                         # discriminator passes through VERBATIM (NoMapping, AudienceMismatch,
                         # MissingBearer, ...). So an unlisted ApiResolved reason is that family and
                         # the gate must NOT refuse it -- refusing would fire whenever authn declined
                         # for a new reason, which is a false alarm by construction. The gate's
                         # OPEN_ROW_CONDITIONS carries this.
      unhealthy: [ApiPartiallyResolved]
      unevaluated: [StageOutcomesUnknown]
      note: >-
        the reason sets above arrive generated with core-provider#529 (36 rows over five condition
        types). Until that merges they are RELAYED from core-provider rather than read from the file,
        so the gate's first run against the merged table is what confirms them.

        A DUPLICATE `note:` KEY LIVED HERE and YAML silently kept the LAST one, so this block
        documented ApiResolved with RBACComplete's text ("every RBAC object derived from the chart was
        applied"). The file parsed, this gate compares REASON SETS rather than notes, and nothing
        caught it. A duplicate key is the quietest defect a vendored table can carry: no parse error,
        no gate failure, and a reader who trusts the note is told about the wrong condition.

        STAGED AHEAD OF core-provider#547 (2.13.106), as CreateOutcomeUnknown was, so the gate goes
        green on the same commit that docs/ready-reasons.md gains these two rows rather than blocking
        every PR in between.

        ApiPartiallyResolved (False): the X-Snowplow-Stage-Outcomes header (snowplow 1.12.57+) named a
        failed stage. THE ONLY ApiResolved=False WITH DATA PROJECTED -- every other False leaves .api
        wholly absent -- so a consumer that short-circuits on the condition skips data that is present
        and valid. CLASSED `unhealthy`, NOT `converging`: a partial result triggers NO REQUEUE of its
        own, so "may complete next pass" predicts a convergence nothing schedules, and the causes are
        DURABLE (Forbidden, NotFound, Aborted/NotRun, which snowplow replays until the RESTAction is
        edited). I proposed `converging` and core-provider was right to refuse it.

        StageOutcomesUnknown (Unknown): the header is absent, so snowplow cannot confirm. The cdc does
        NO version check -- it gates on the capability, never on a version, which stays correct across
        a backport or a fork. krateo-057 runs snowplow 1.12.70, thirteen releases inside the floor.

        2.13.106 ALSO ADDS status.unrefreshedFields, the projected forPaths holding a value this pass
        did not write. That is the instrument for the STALE case: a guarded projection
        (${ ... // empty } or an iterator) over a missing key writes NOTHING, so the field KEEPS its
        previous value and looks like a fresh read. A bare path writes null, which the apiserver drops,
        so absence is visible. Before this field, stale was undetectable -- which is why
        internal-ca-bundle's projection must stay a bare path.

  source:
    repo: krateo-platformops/core-provider
    path: docs/ready-reasons.md
    # Regenerated by: go test ./internal/composition/ -run TestReadyReasonTableIsCurrent
    #   (UPDATE_READY_REASONS=1 to rewrite). Do not hand-edit either end.
    checked_against: 7f7680a30a97977b64376ad84f8d4eed81eda751
    checked_on: "2026-11-17"
    # HooksMayNotHaveRun is on core-provider's MAIN at that commit and in NO TAG -- 2.13.108 was
    # cut at the same commit but does not carry #569's docs set, and 057 runs 2.13.105. So this
    # namespace now classifies a reason that nothing emits yet.

  # converged: tooling may treat the composition as settled and healthy.
  converged:
    - Available
    - AvailablePartialCoverage
    - ReconcileGracefullyPaused   # WAS MISSING from my set until the #517 diff. Ready=True, healthy.
    - ReconcilePaused

  # converging: NOT settled. Re-read before concluding; do not fail on a single snapshot.
  # PendingHelmOperation carries its own deadline in the message ("pending for N") and the cdc rolls
  # the release back by itself once it exceeds the grace (helm timeout + 1m). Under the grace it is
  # settling; beyond it, it is a wedge. HelmOperationInProgress clears in seconds by comparison --
  # same verdict, wildly different timescale, which the generated table does not yet distinguish.
  converging:
    - Creating
    - HelmOperationInProgress
    - PendingHelmOperation
    - ChildrenForbidden
    - InventoryNotRecorded
    - Deleting

  # failed: a real failure. Fail the verification and name the message.
  failed:
    - Unavailable
    # core-provider#530 / unstructured-runtime v1.21.0. Written by UNSTRUCTURED-RUNTIME, not the cdc,
    # and the parent verdict `failed` is COMPUTED BY THE ROLLUP (krateoReady maps it to childFailed)
    # rather than written on the child. Clears only when an existence check succeeds, or when a human
    # removes the krateo.io/external-create-pending annotation -- so `indefinite`, with no deadline.
    # TWO PATHS WRITE THE REASON, BUT ONLY ONE MAPS IT (core-provider's precision, not my reading):
    #   the REASON is written by whichever controller runs unstructured-runtime >= v1.21.0 -- the cdc
    #     on its own compositions after a core-provider release with #530, and rest-dynamic-controller
    #     on its CRs after RDC bumps (which oasgen will NOT do as a ride-along);
    #   the `failed` MAPPING lives ONLY in the cdc. So an RDC child sitting at CreateOutcomeUnknown
    #     fails its PARENT only once a core-provider release carries #530.
    # Both paths exist; the parent verdict needs core-provider either way. The practical consequence:
    # seeing this reason on an RDC child does NOT imply the parent has gone unhealthy, and a parent
    # that has NOT gone unhealthy does not mean the child is fine.
    # This file classifies by REASON alone, so two components writing the same reason is invisible
    # here; fine while the classification agrees, and the thing that would force a `writer` key if
    # they ever diverge.
    - CreateOutcomeUnknown
    # HooksMayNotHaveRun: set while the annotation krateo.io/hooks-unverified (an RFC 3339 time) is
    # on the composition, and cleared by a human or by the next reconcile that ran a REAL helm
    # install or upgrade. core-provider #563, merged as #569 (7f7680a). THIS REPO ASKED FOR IT, and
    # the reason it was needed is that the absence of a signal meant success: an ABSENT
    # hook-succeeded annotation IS the success case, so a composition whose hooks were skipped was
    # indistinguishable from one whose hooks passed. There was no observable difference between
    # "ran and passed" and "never ran" -- which is why a new reason was the only fix.
    - HooksMayNotHaveRun

  # unevaluated: core-provider's rollup counts these healthy for a PARENT. This repo's tooling counts
  # them NOT converged -- see the deliberate difference above.
  unevaluated:
    - ZeroEvidence
    - ObserveFailed

  # Reasons that require Synced=True as well, or they are healthy-but-not-maintained and must not
  # satisfy a dependency gate.
  requires_synced_true:
    - ReconcilePaused
    - ReconcileGracefullyPaused


# ---------------------------------------------------------------------------------------------
compositionDefinition:
  # The reasons a CompositionDefinition's Ready and Synced conditions can carry.
  #
  # A DEFINITION IS NOT A COMPOSITION, and the difference is not cosmetic. A CD's Ready covers
  # the CRD being served and Established, and the cdc's OWN controller Deployment rolling out.
  # It does NOT cover the workload the composition installs -- measured on demo 2026-11-17, where
  # incident-provider's workload was OOMKilled every ~45s for 8.5 hours while its CD read
  # True/Available with a lastTransitionTime five days old. Reading a CD and concluding anything
  # about a component's workload is a category error.
  source:
    repo: krateo-platformops/core-provider
    path: docs/cd-ready-reasons.md
    checked_against: ded4da21785f2d8d13cc2036c59f44be3b2d5d9e
    checked_on: "2026-11-17"
    # THIS TABLE IS ON core-provider's MAIN AND IN NO RELEASE, which they pointed out after I
    # vendored it. So this namespace classifies behaviour that NOTHING RUNS YET: 057 is on
    # 2.13.105 and this repo's tag 1 carries 2.13.107, and neither has the CD Deployment watch,
    # the rollout rule or the pod cause that #557 (7da7248) introduces.
    #
    # WHAT THAT MEANS FOR USING THIS NAMESPACE TODAY. MEASURED HERE, at both tags the fleet
    # runs, using the method recorded under `how_to_measure_a_tag` below. core-provider corrected
    # me twice before this -- I had said three reasons "may not be written at all" on
    # 2.13.105/2.13.107, and two of the three are written today -- so these are their numbers
    # reproduced independently rather than relayed:
    #
    #   reason                       written on 2.13.105 / 2.13.107   rollup verdict TODAY
    #   RemoteChartUnreachable       YES  2 / 2   cd.go:1662           CONVERGING, not failed
    #   ScaledToZero                 YES  6 / 6   scaletozero.go:76    healthy via the BLANKET
    #                                                                     status=="True" arm
    #                                                                     (l.1056), NOT via the
    #                                                                     default as I first said
    #   SchemaDefaultContradiction   NO   0 / 0                        n/a, cannot occur
    #
    #   krateoEval arms in childhealth.go, same tags: Unavailable 8, Available 7, Creating 8,
    #   NotObserved 1, and ZERO for RemoteChartUnreachable, ScaledToZero and Deleting. A reason
    #   with no arm falls to the default, and the default is childhealth.go:882
    #   `default: return is(childConverging)` -- which is WHY RemoteChartUnreachable rolls up
    #   converging on these versions rather than failed.
    #
    #   The control that makes a zero mean "absent" rather than "wrong path", core-provider's
    #   suggestion and the reason I trust the zeros: SchemaDefaultContradiction is known absent
    #   at 2.13.105 and returned 0, while ScaledToZero is known present and returned 6 at
    #   scaletozero.go:76. Both at tag commits c62e4e7 (2.13.105) and 24051a7 (2.13.107).
    #
    # SO THE `failed` LIST BELOW IS CORRECT FOR THE TABLE AND WRONG FOR 057'S UMBRELLA. This
    # file classifies a REASON; the cdc's rollup assigns a VERDICT to that reason, and the two
    # can disagree by cdc version. RemoteChartUnreachable becomes a FAILED rollup only in the cdc
    # of the release containing 7da7248. 057's umbrella is reconciled by 2.13.105's cdc, where it
    # still rolls up as converging -- so a verification using this list would call such a
    # definition failed while check-ready-gate, reading the umbrella, calls it converging.
    # Neither is wrong; they are answering different questions.
    #
    # What is new in BEHAVIOUR rather than in reason strings, and all of it requires
    # core-provider >= the release containing 7da7248: the rollout rule (Available requires the
    # controller to have rolled out), the Ready-follows-status switch, the Deployment watch, and
    # the pod cause. Before it, a CD reads Available from DECLARED REPLICAS and re-checks only at
    # its 3m poll, so a green CD is NOT evidence that its controller is running.
    #
    # It is correct about the generated table, which is a different claim from being correct
    # about 057.
    #
    # The drift gate compares against their MAIN deliberately, so this file tracks where the
    # behaviour is going rather than where it has been. That is the right target for a drift
    # check and the wrong one for a verification, and the distinction is the reason this note
    # exists.
    # Per-reason, since only one of them is actually new. core-provider will supply the version
    # when 7da7248 is tagged; the other two need no gate because they are already live.
    released_in:
      SchemaDefaultContradiction: null
      # Merged to core-provider main as ded4da2 (PR #567) on 2026-11-17 and IN NO TAG. The next
      # core-provider tag waits on this repo's 057 roll and on portal 1.8.133, so nothing emits
      # this reason yet -- recorded so a reader does not expect to see it on a cluster.
      ValuesSchemaMissing: null
      RemoteChartUnreachable: "already written by 2.13.105; its FAILED rollup verdict is what
        needs the 7da7248 release"
      ScaledToZero: "2.13.84"
    # HOW TO MEASURE THIS AT A TAG, so it never has to be asked again. core-provider supplied
    # the method; the repo is public and nothing is needed from them. Their tags carry NO "v".
    #
    #   git clone -q --depth 1 --branch <tag> \
    #     https://github.com/krateo-platformops/core-provider /tmp/cp-<tag>
    #
    #   1) is the reason WRITTEN by that release? READ THE HIT -- a count alone does not
    #      distinguish a write from a comment or a CRD description:
    #      git -C /tmp/cp-<tag> grep -n '<Reason>' -- go/core-provider/internal go/core-provider/apis
    #
    #   2) what VERDICT does that release's cdc rollup give it? ENUMERATE THE ARMS -- do not
    #      grep per reason. Find `func krateoEval` in
    #      go/composition-dynamic-controller/internal/composition/childhealth.go, walk to its
    #      closing brace by brace depth, and print every `case`, `default:` and `return is(...)`.
    #
    #      WHY NOT A GREP, and this is a correction to the method as first given to me (core-
    #      provider's, and they agreed it was wrong): NOT ALL ARMS ARE LITERAL STRINGS. At
    #      2.13.105, `condition.ReasonCreateOutcomeUnknown` (l.1207) and
    #      `condition.ReasonZeroEvidence` (l.1214) are matched through CONSTANTS, so
    #      `grep '"CreateOutcomeUnknown"'` returns ZERO for an arm that exists and maps to
    #      childFailed. A zero from that grep means "no literal arm", never "no arm". My second
    #      attempt built an alternation covering both forms and reported constant=1 and ANY=0 at
    #      the same time -- self-contradictory, which is the only reason I noticed at all.
    #
    #      Enumeration answers "what arms exist" rather than "does my guess match", and it
    #      surfaces the arms nobody thought to ask about.
    #
    #      READ THE ARMS WITH THEIR STATUS, NOT BY REASON ALONE. Measured at 2.13.105:
    #        l.1056  status == "True"                        -> childHealthy   (BLANKET)
    #        l.1058  status == "False" && TerminalByDesign   -> childHealthy   (False AND healthy)
    #        l.1081  Unavailable                             -> childFailed
    #        l.1207  condition.ReasonCreateOutcomeUnknown    -> childFailed
    #        l.1297  default                                 -> childConverging
    #      The blanket True arm is why a Ready=True reason needs no arm of its own -- which is the
    #      real reason ScaledToZero is healthy, not "it falls to the default" as I first wrote.
    #      And TerminalByDesign is the inverse: Ready=FALSE and healthy. So "False means not
    #      healthy" is wrong in at least one case, and a reason read without its status is not
    #      decidable.
    #
    #   ALWAYS RUN THE CONTROL: one reason known ABSENT at that tag and one known PRESENT, so a
    #   zero means absent and not a wrong path. Every zero in the table above has that control
    #   behind it.
    #
    # FROM the first release containing 7da7248 onward, step 2 is unnecessary: read the tables AT
    # THE TAG, since they are generated from that release's code and checked against it by a test:
    #   gh api 'repos/krateo-platformops/core-provider/contents/docs/cd-ready-reasons.md?ref=<tag>' \
    #     -q .content | base64 -d
    #
    # A BOUNDARY THIS FILE DELIBERATELY DOES NOT CROSS. The enumeration above also shows arms
    # for AssumedUpToDate, CreateFailed, AuthorizationDenied, DriftNotConverging, CreateUnreachable
    # and ZeroEvidence. Those are CHILD-ROLLUP arms -- how the cdc reads ANY *.krateo.io child --
    # which is a third question, distinct from a composition's Ready reasons and a definition's.
    # They are not vendored here. Widening this file to cover them would make it answer a question
    # its consumers are not asking, and the two namespaces exist precisely because conflating
    # scopes is the failure this file keeps catching. core-provider agreed the boundary is right.
    #
    # THE TAG IS THE INPUT FOR "WHAT DOES 057 DO". The drift gate's comparison against MAIN
    # answers a different question and stays right for it. The cdc image tag equals the
    # core-provider tag, so the version to measure is readable from the cluster.
  condition_types:
    # Same shape as the composition namespace, because check-ready-reasons-current.py reads
    # condition_types[<cond>].healthy / .unhealthy to assert every NON-Ready upstream reason is
    # accounted for. My first attempt here used `Ready: <description>` and the gate crashed on
    # it -- which is the right outcome: a shape it cannot read is a shape it cannot check.
    Ready:
      universal: true
      note: >-
        the CRD serves the version and is Established, and the cdc's own controller Deployment
        has rolled out. Classified by the converged/converging/failed/unevaluated lists below.
        It says NOTHING about the workload the composition installs.
    Synced:
      universal: true
      healthy:
        - ReconcileSuccess
      unhealthy:
        - ReconcileError
        - ReconcilePaused
      note: >-
        THE COLLISION THAT FORCED THIS SPLIT. ReconcilePaused here is a SYNCED reason, and
        core-provider is explicit that Ready is LEFT AS IT WAS -- so a paused definition's Ready
        is STALE, not healthy. On a COMPOSITION the same string is a READY reason meaning
        healthy-but-paused, and it sits in that namespace's `converged` list. Never classify this
        string without its condition. ReconcileError with Ready=False/SchemaDefaultContradiction
        reads "observe failed: " followed by Ready's message.
    # core-provider states the OTHER condition types a definition carries -- ControllerActive,
    # SchemaFullyEnforced, SpecSchemaCurrent and the rest -- are deliberately NOT in their
    # generated table. So this file says nothing about them, and neither should any gate here.
  converged:
    - Available
    # ScaledToZero: Ready=TRUE and healthy. The controller is at 0 replicas because the
    # definition opted into scale-to-zero (core-provider#393); it wakes on the first instance.
    # THIS IS THE ONE THAT WOULD HAVE BITTEN. A verification built from the composition set
    # would have reported a FAILURE on a healthy definition, and 057 has never shown it -- the
    # same blind spot as ReconcileGracefullyPaused before #517.
    - ScaledToZero
  converging:
    # Written by BOTH core-provider and provider-runtime, on different paths, same verdict.
    - Creating
    - Deleting
  failed:
    - Unavailable
    # Both of these are definition-only and had no classification here before the split.
    - RemoteChartUnreachable
    - SchemaDefaultContradiction
    # ValuesSchemaMissing: the chart ships no values.schema.json at its ROOT, so no typed CRD can
    # be generated and nothing is applied; the message names the chart. Added after core-provider
    # merged #566 as PR #567 (ded4da2), which this repo asked for: the kyverno pin sat at
    # Ready=False/CREATING for ever on kc-roll057 with the schema missing -- a CONVERGING reason
    # for a state that cannot change, so a time-bounded detector was the only thing that could
    # ever have noticed. The new reason makes it FAILED, which is a verdict rather than a wait.
    - ValuesSchemaMissing
  unevaluated:
    # NotObserved is core-provider's "unevaluated (rolls up as healthy)" -- a PARENT counts such
    # a child healthy. This repo files it unevaluated and its tooling counts it NOT converged,
    # the same deliberate difference recorded for the composition namespace: the question a roll
    # verification asks is "did this converge?", not "should its parent count it?".
    - NotObserved
