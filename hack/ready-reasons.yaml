# The reasons a composition's Ready condition can carry, and how THIS repo's tooling must read each.
#
# WHY THIS FILE EXISTS. Every roll verification I write asks "did these compositions converge?", and
# every one of them needs a set of reasons that count as converged. I built that set from the reasons
# I had MET, one incident at a time -- and on 2026-11-15 I met three in a single day (ObserveFailed,
# HelmOperationInProgress, PendingHelmOperation), each time by misreading a healthy or settling
# cluster as a broken one. The worst of them had me one command away from `helm rollback` on an
# umbrella managing 137 live children.
#
# core-provider#515 asked for a table generated from their code, and #517 delivered it:
# docs/ready-reasons.md on core-provider main, 14 rows, regenerated by a test that refuses any Ready
# condition constructed outside internal/readyreason. Diffing my set against it immediately found a
# reason I was missing -- ReconcileGracefullyPaused, which is Ready=True and rolls up healthy, and
# which my verification would have reported as a FAILURE on a healthy cluster. It has never appeared
# on krateo-057, which is exactly why I had not noticed: a classifier built from observation is
# complete only for the clusters you have watched.
#
# So this file is vendored rather than fetched at use time: tooling must not depend on a network read
# to decide whether a cluster is healthy. check-ready-reasons-current.py compares it against
# core-provider's generated file and fails on drift, so the copy is checked rather than trusted.
#
# ONE DELIBERATE DIFFERENCE from core-provider's rollup, stated rather than hidden. ZeroEvidence and
# ObserveFailed are Unknown, and their `krateoReady` verdict is "unevaluated (rolls up as healthy)" --
# a PARENT counts such a child healthy. This repo's tooling counts them NOT converged, because the
# question a roll verification asks is "did this composition converge?", not "should its parent count
# it?". Consequence to expect: an umbrella may report Ready=True/Available while a per-composition
# check flags one of its children, and neither is wrong.
#
# AND READ `Synced`, NOT JUST THE REASON. Both healthy-paused reasons pair with Synced != True
# (ReconcilePaused writes Synced=False/ReconcilePaused; ReconcileGracefullyPaused is documented the
# same way). A reason-based rule cannot express that: unstructured-runtime declares two constants
# whose string VALUE is both "ReconcilePaused", written on Ready and on Synced respectively. The
# chart's inst.readyFromConditions already requires Synced=True and so withholds both from a
# dependency gate; verification tooling must do the same or it will accept a composition that is
# healthy-but-not-maintained.
#
# Measured on krateo-057, 2026-11-15, installer 0.3.653 / core-provider 2.13.100, 86 compositions:
#   Available/True                 69
#   AvailablePartialCoverage/True  15
#   ReconcilePaused/True            1   (AcmeFeedback/acme-feedback-controller, Synced=ReconcilePaused)
#   HelmOperationInProgress/False   1   -> GONE 70s later. It is written before an install or
#                                          uninstall, so a SNAPSHOT of a healthy cluster can catch it.
#                                          Any check that fails on a converging reason without a
#                                          re-read will produce false failures at some rate.
# 4 of the 14 rows were live; 10 have never appeared on this cluster.

# EVERY CONDITION TYPE A COMPOSITION CARRIES -- not just Ready.
#
# WHY THIS SECTION EXISTS. Every verification I wrote on 2026-11-15 read `Ready`, and sometimes
# `Synced`. That is TWO of FOUR. agentiko-mcp-server handed me a `CannotObserveExternalResource`
# Warning on the Installer composition to judge; reading its conditions properly to answer them is
# the only reason I discovered the other two exist.
#
# RBACComplete IS THE ONE THAT MATTERS, because it is exactly what the Warning threatened: two of the
# three affected components failed with "generating RBAC using chart-inspector: ... Get
# http://installer-core-provider-chart-inspector...". If RBACComplete had gone False, every
# verification I ran that day would have reported a CLEAN CLUSTER.
#
# Measured across all 86 compositions on krateo-057, 2026-11-15:
#     Ready             86/86   True/Available 70, True/AvailablePartialCoverage 15,
#                               True/ReconcilePaused 1
#     Synced            86/86   True/ReconcileSuccess 85, False/ReconcilePaused 1
#     ChartRenderable   85/86   True/Renderable 85
#     RBACComplete      85/86   True/Applied 85
# The one object lacking the last two is AcmeFeedback/acme-feedback-controller, the paused one -- so
# absence there is a property of being paused, not a gap.
#
# The ONLY non-True condition anywhere was that same object's Synced=False/ReconcilePaused, which is
# documented upstream as the liveness half of a healthy pause.
#
# NOTE core-provider's generated table (core-provider#515/#517) covers the READY reasons only. The
# reasons for the other three types are not generated anywhere, so the values below are OBSERVED, not
# derived -- the same weakness that left ReconcileGracefullyPaused out of my Ready set until the
# generated table existed. Asked them whether the table can cover all four types.
# A COMPONENT CHART THAT CANNOT RENDER: where the failure lands, and where it does NOT.
#
# Answered from code by core-provider (kp/main 1582c05) rather than guessed, after
# keycloak-provider-kog found that krateo-keycloak-realm 0.5.2 FAILS to render with 057's values
# ("parentClient.redirectUris is required when parentClient.enabled" -- a deliberate refusal to
# create a portal client nobody can sign in through).
#
# THE DISTINCTION I COULD NOT HAVE DERIVED, and the reason I asked instead:
#
#   a component chart's values.schema.json `required`
#     -> becomes its GENERATED CRD's schema
#     -> the apiserver REJECTS the umbrella's write of the composition CR
#     -> the UMBRELLA'S OWN helm apply fails.  THIS is what froze krateo-demo twice.
#
#   a component chart's template `fail`
#     -> is not in the schema, so the CR is ACCEPTED
#     -> only that component's own render fails
#     -> chart-inspector is called PER COMPOSITION with that composition and its own CD
#        (applyDerivedRBAC, composition.go:1678). The umbrella's cdc renders ONLY the installer
#        chart; it never renders a component's chart. So the failure CANNOT touch the umbrella's
#        ChartRenderable or RBACComplete, and cannot stop its helm operation or its 136 siblings.
#
# BUT THE ROLLUP CARRIES IT UP, which is the half that matters operationally:
#   a NEW component (e.g. the first enable of a feature): Create's render fails
#     (composition.go:982) -> Ready=False/Creating on that component -> the umbrella reads a
#     CONVERGING child -> umbrella Ready=False/Creating INDEFINITELY. No deadline until
#     core-provider#498's ChildStalled ships.
#   an ALREADY-INSTALLED component whose values later break: Observe's render failure goes through
#     failObserveWithFinding -> Ready=False/Unavailable on the component -> umbrella
#     Ready=False/Unavailable NAMING the child.
#
# SO, FOR A ROLL THAT ENABLES A FEATURE: the component's values are not a precondition for the
# CLUSTER -- nothing wedges, nothing else stops -- but they ARE a precondition for the umbrella ever
# reading Ready=True. Any verification gating on the umbrella's Ready, which every one of mine does,
# will hold indefinitely. Treat required componentValues as blocking for that reason, not because
# the cluster is at risk.

condition_types:
  Ready:
    universal: true
    note: classified by the converged/converging/failed/unevaluated lists below.
  Synced:
    universal: true
    healthy: [ReconcileSuccess]
    # `unhealthy` means KNOWN AND NOT THE HEALTHY ONE -- it includes expected states such as a
    # deliberate pause, not only failures. The gate treats healthy|unhealthy as the known set.
    unhealthy: [ReconcileError, ReconcilePaused, ReconcileDeferred, ReconcileGracefullyPaused,
                GracefulPausePending]
    note: >-
      a PAUSED composition reports Ready=True with Synced=False/ReconcilePaused. It was healthy when
      paused and nothing is maintaining that state now, so it must not satisfy a dependency gate.
      inst.readyFromConditions requires Synced=True for exactly this reason.
  ChartRenderable:
    universal: false   # absent on a paused composition
    healthy: [Renderable]
    unhealthy: [UnservedKind, ValuesSchemaViolation, InspectorRejected, InspectorUnavailable]
    note: chart-inspector rendered the chart against this cluster.
  RBACComplete:
    universal: false   # absent on a paused composition
    healthy: [Applied]
    unhealthy: [ApplyFailed, NamespaceTerminating, NotEvaluated]
    note: >-
      every RBAC object derived from the chart was applied. A chart-inspector outage is what puts this
      at risk, and it is the condition a Ready-only check cannot see.

      THIS NOTE WAS LOST, not missing. It had been written one block down, inside ApiResolved, where
      it became a DUPLICATE `note:` key -- YAML keeps the last, so it silently replaced ApiResolved's
      own note and left this condition undocumented. Two defects from one misindented line, and
      repairing only ApiResolved would have discarded this text for good.

      RBACComplete REPORTS ONLY THE RBAC DERIVED FROM THE CHART (cdc rbaccomplete.go:18, #357). An
      apiRef identity's grant is generated by core-provider and surfaces on ApiResolved instead, so a
      refused apiRef read leaves THIS condition True. The two conditions are not substitutes.
  ApiResolved:
    universal: false   # only on compositions whose CompositionDefinition has an apiRef, which is
                       # why 057's census of four condition types never showed it
    healthy: [Resolved]
    open_family: true  # ONE ROW UPSTREAM IS DELIBERATELY OPEN: on a refusal, authn's own
                       # discriminator passes through VERBATIM (NoMapping, AudienceMismatch,
                       # MissingBearer, ...). So an unlisted ApiResolved reason is that family and
                       # the gate must NOT refuse it -- refusing would fire whenever authn declined
                       # for a new reason, which is a false alarm by construction. The gate's
                       # OPEN_ROW_CONDITIONS carries this.
    unhealthy: [ApiPartiallyResolved]
    unevaluated: [StageOutcomesUnknown]
    note: >-
      the reason sets above arrive generated with core-provider#529 (36 rows over five condition
      types). Until that merges they are RELAYED from core-provider rather than read from the file,
      so the gate's first run against the merged table is what confirms them.

      A DUPLICATE `note:` KEY LIVED HERE and YAML silently kept the LAST one, so this block
      documented ApiResolved with RBACComplete's text ("every RBAC object derived from the chart was
      applied"). The file parsed, this gate compares REASON SETS rather than notes, and nothing
      caught it. A duplicate key is the quietest defect a vendored table can carry: no parse error,
      no gate failure, and a reader who trusts the note is told about the wrong condition.

      STAGED AHEAD OF core-provider#547 (2.13.106), as CreateOutcomeUnknown was, so the gate goes
      green on the same commit that docs/ready-reasons.md gains these two rows rather than blocking
      every PR in between.

      ApiPartiallyResolved (False): the X-Snowplow-Stage-Outcomes header (snowplow 1.12.57+) named a
      failed stage. THE ONLY ApiResolved=False WITH DATA PROJECTED -- every other False leaves .api
      wholly absent -- so a consumer that short-circuits on the condition skips data that is present
      and valid. CLASSED `unhealthy`, NOT `converging`: a partial result triggers NO REQUEUE of its
      own, so "may complete next pass" predicts a convergence nothing schedules, and the causes are
      DURABLE (Forbidden, NotFound, Aborted/NotRun, which snowplow replays until the RESTAction is
      edited). I proposed `converging` and core-provider was right to refuse it.

      StageOutcomesUnknown (Unknown): the header is absent, so snowplow cannot confirm. The cdc does
      NO version check -- it gates on the capability, never on a version, which stays correct across
      a backport or a fork. krateo-057 runs snowplow 1.12.70, thirteen releases inside the floor.

      2.13.106 ALSO ADDS status.unrefreshedFields, the projected forPaths holding a value this pass
      did not write. That is the instrument for the STALE case: a guarded projection
      (${ ... // empty } or an iterator) over a missing key writes NOTHING, so the field KEEPS its
      previous value and looks like a fresh read. A bare path writes null, which the apiserver drops,
      so absence is visible. Before this field, stale was undetectable -- which is why
      internal-ca-bundle's projection must stay a bare path.

source:
  repo: krateo-platformops/core-provider
  path: docs/ready-reasons.md
  # Regenerated by: go test ./internal/composition/ -run TestReadyReasonTableIsCurrent
  #   (UPDATE_READY_REASONS=1 to rewrite). Do not hand-edit either end.
  checked_against: 2.13.100
  checked_on: "2026-11-15"

# converged: tooling may treat the composition as settled and healthy.
converged:
  - Available
  - AvailablePartialCoverage
  - ReconcileGracefullyPaused   # WAS MISSING from my set until the #517 diff. Ready=True, healthy.
  - ReconcilePaused

# converging: NOT settled. Re-read before concluding; do not fail on a single snapshot.
# PendingHelmOperation carries its own deadline in the message ("pending for N") and the cdc rolls
# the release back by itself once it exceeds the grace (helm timeout + 1m). Under the grace it is
# settling; beyond it, it is a wedge. HelmOperationInProgress clears in seconds by comparison --
# same verdict, wildly different timescale, which the generated table does not yet distinguish.
converging:
  - Creating
  - HelmOperationInProgress
  - PendingHelmOperation
  - ChildrenForbidden
  - InventoryNotRecorded
  - Deleting

# failed: a real failure. Fail the verification and name the message.
failed:
  - Unavailable
  # core-provider#530 / unstructured-runtime v1.21.0. Written by UNSTRUCTURED-RUNTIME, not the cdc,
  # and the parent verdict `failed` is COMPUTED BY THE ROLLUP (krateoReady maps it to childFailed)
  # rather than written on the child. Clears only when an existence check succeeds, or when a human
  # removes the krateo.io/external-create-pending annotation -- so `indefinite`, with no deadline.
  # TWO PATHS WRITE THE REASON, BUT ONLY ONE MAPS IT (core-provider's precision, not my reading):
  #   the REASON is written by whichever controller runs unstructured-runtime >= v1.21.0 -- the cdc
  #     on its own compositions after a core-provider release with #530, and rest-dynamic-controller
  #     on its CRs after RDC bumps (which oasgen will NOT do as a ride-along);
  #   the `failed` MAPPING lives ONLY in the cdc. So an RDC child sitting at CreateOutcomeUnknown
  #     fails its PARENT only once a core-provider release carries #530.
  # Both paths exist; the parent verdict needs core-provider either way. The practical consequence:
  # seeing this reason on an RDC child does NOT imply the parent has gone unhealthy, and a parent
  # that has NOT gone unhealthy does not mean the child is fine.
  # This file classifies by REASON alone, so two components writing the same reason is invisible
  # here; fine while the classification agrees, and the thing that would force a `writer` key if
  # they ever diverge.
  - CreateOutcomeUnknown

# unevaluated: core-provider's rollup counts these healthy for a PARENT. This repo's tooling counts
# them NOT converged -- see the deliberate difference above.
unevaluated:
  - ZeroEvidence
  - ObserveFailed

# Reasons that require Synced=True as well, or they are healthy-but-not-maintained and must not
# satisfy a dependency gate.
requires_synced_true:
  - ReconcilePaused
  - ReconcileGracefullyPaused
