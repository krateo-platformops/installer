# The reasons a composition's Ready condition can carry, and how THIS repo's tooling must read each.
#
# WHY THIS FILE EXISTS. Every roll verification I write asks "did these compositions converge?", and
# every one of them needs a set of reasons that count as converged. I built that set from the reasons
# I had MET, one incident at a time -- and on 2026-11-15 I met three in a single day (ObserveFailed,
# HelmOperationInProgress, PendingHelmOperation), each time by misreading a healthy or settling
# cluster as a broken one. The worst of them had me one command away from `helm rollback` on an
# umbrella managing 137 live children.
#
# core-provider#515 asked for a table generated from their code, and #517 delivered it:
# docs/ready-reasons.md on core-provider main, 14 rows, regenerated by a test that refuses any Ready
# condition constructed outside internal/readyreason. Diffing my set against it immediately found a
# reason I was missing -- ReconcileGracefullyPaused, which is Ready=True and rolls up healthy, and
# which my verification would have reported as a FAILURE on a healthy cluster. It has never appeared
# on krateo-057, which is exactly why I had not noticed: a classifier built from observation is
# complete only for the clusters you have watched.
#
# So this file is vendored rather than fetched at use time: tooling must not depend on a network read
# to decide whether a cluster is healthy. check-ready-reasons-current.py compares it against
# core-provider's generated file and fails on drift, so the copy is checked rather than trusted.
#
# ONE DELIBERATE DIFFERENCE from core-provider's rollup, stated rather than hidden. ZeroEvidence and
# ObserveFailed are Unknown, and their `krateoReady` verdict is "unevaluated (rolls up as healthy)" --
# a PARENT counts such a child healthy. This repo's tooling counts them NOT converged, because the
# question a roll verification asks is "did this composition converge?", not "should its parent count
# it?". Consequence to expect: an umbrella may report Ready=True/Available while a per-composition
# check flags one of its children, and neither is wrong.
#
# AND READ `Synced`, NOT JUST THE REASON. Both healthy-paused reasons pair with Synced != True
# (ReconcilePaused writes Synced=False/ReconcilePaused; ReconcileGracefullyPaused is documented the
# same way). A reason-based rule cannot express that: unstructured-runtime declares two constants
# whose string VALUE is both "ReconcilePaused", written on Ready and on Synced respectively. The
# chart's inst.readyFromConditions already requires Synced=True and so withholds both from a
# dependency gate; verification tooling must do the same or it will accept a composition that is
# healthy-but-not-maintained.
#
# Measured on krateo-057, 2026-11-15, installer 0.3.653 / core-provider 2.13.100, 86 compositions:
#   Available/True                 69
#   AvailablePartialCoverage/True  15
#   ReconcilePaused/True            1   (AcmeFeedback/acme-feedback-controller, Synced=ReconcilePaused)
#   HelmOperationInProgress/False   1   -> GONE 70s later. It is written before an install or
#                                          uninstall, so a SNAPSHOT of a healthy cluster can catch it.
#                                          Any check that fails on a converging reason without a
#                                          re-read will produce false failures at some rate.
# 4 of the 14 rows were live; 10 have never appeared on this cluster.

source:
  repo: krateo-platformops/core-provider
  path: docs/ready-reasons.md
  # Regenerated by: go test ./internal/composition/ -run TestReadyReasonTableIsCurrent
  #   (UPDATE_READY_REASONS=1 to rewrite). Do not hand-edit either end.
  checked_against: 2.13.100
  checked_on: "2026-11-15"

# converged: tooling may treat the composition as settled and healthy.
converged:
  - Available
  - AvailablePartialCoverage
  - ReconcileGracefullyPaused   # WAS MISSING from my set until the #517 diff. Ready=True, healthy.
  - ReconcilePaused

# converging: NOT settled. Re-read before concluding; do not fail on a single snapshot.
# PendingHelmOperation carries its own deadline in the message ("pending for N") and the cdc rolls
# the release back by itself once it exceeds the grace (helm timeout + 1m). Under the grace it is
# settling; beyond it, it is a wedge. HelmOperationInProgress clears in seconds by comparison --
# same verdict, wildly different timescale, which the generated table does not yet distinguish.
converging:
  - Creating
  - HelmOperationInProgress
  - PendingHelmOperation
  - ChildrenForbidden
  - InventoryNotRecorded
  - Deleting

# failed: a real failure. Fail the verification and name the message.
failed:
  - Unavailable

# unevaluated: core-provider's rollup counts these healthy for a PARENT. This repo's tooling counts
# them NOT converged -- see the deliberate difference above.
unevaluated:
  - ZeroEvidence
  - ObserveFailed

# Reasons that require Synced=True as well, or they are healthy-but-not-maintained and must not
# satisfy a dependency gate.
requires_synced_true:
  - ReconcilePaused
  - ReconcileGracefullyPaused
