composition:
  condition_types:
    Ready:
      universal: true
      note: classified by the converged/converging/failed/unevaluated lists below.
    Synced:
      universal: true
      healthy:
      - ReconcileSuccess
      unhealthy:
      - ReconcileError
      - ReconcilePaused
      - ReconcileDeferred
      - ReconcileGracefullyPaused
      - GracefulPausePending
      note: a PAUSED composition reports Ready=True with Synced=False/ReconcilePaused. It was healthy
        when paused and nothing is maintaining that state now, so it must not satisfy a dependency gate.
        inst.readyFromConditions requires Synced=True for exactly this reason.
    ChartRenderable:
      universal: false
      healthy:
      - Renderable
      unhealthy:
      - UnservedKind
      - ValuesSchemaViolation
      - InspectorRejected
      - InspectorUnavailable
      - TemplateRefused
      note: 'chart-inspector rendered the chart against this cluster.

        InspectorUnavailable IS AMBIGUOUS AND DOES NOT MEAN WHAT IT SAYS (core-provider#583, 2026-11-18).
        chart-inspector''s classifier is 400 = schema violation, 422 = unserved kind, EVERYTHING ELSE
        = 500; and the cdc maps every 5xx to InspectorUnavailable, documented as "chart-inspector itself
        failed; not the blueprint''s fault". So A TEMPLATE''S OWN `fail` ARRIVES HERE AS InspectorUnavailable,
        attributing a deliberate refusal by THIS chart to an infrastructure fault. The installer has guards
        that fail deliberately: the github-provider-kog-config kinds check is one, and the namespace/readerGroups
        guard that froze krateo-057 on 0.3.674 was another.

        THE DISCRIMINATOR, from core-provider, until #583 is fixed: a 5xx whose response body contains
        `execution error at (` or `execution error in (` is THE CHART REFUSING ITS VALUES, not chart-inspector
        failing. Read the body, not the reason. Measured example, the Installer CR''s Synced message at
        2026-11-18T00:16:10Z - "unexpected status code: 500 - response body: {... execution error at (installer/templates/withheld-components.yaml:31:20):
        components[kyverno]: ...}".

        A 500 is also a THIRD class alongside the two transport signatures core-provider named for the
        chart-inspector termination work: `connection refused`/`i/o timeout` on the dial means #578 is
        not working, `EOF`/`connection reset by peer` while reading means #582 is missing, and a 5xx means
        the server ANSWERED. Forcing a 500 into either transport arm would report a termination verdict
        about a template error.

        Ready=False/Unavailable is CORRECT either way, because any HTTP answer is a verdict - including
        under core-provider#579''s grace. Only the ChartRenderable attribution is wrong, so this note
        changes how to READ the reason, not whether it is unhealthy.

        #583 IS FIXED IN core-provider 2.13.112, AND THE STRING DISCRIMINATOR ABOVE IS NOW A FALLBACK
        FOR OLDER VERSIONS ONLY. From 2.13.112 chart-inspector answers 400 with Status reason "TemplateRefused"
        for a chart''s own `fail`, and the cdc sets ChartRenderable False/TemplateRefused, writer composition-dynamic-controller,
        clearance indefinite - until the author changes the values or the chart (#583).

        Ready IS UNCHANGED for this class: still False/Unavailable. So every alert, rollup and gate keyed
        on Ready behaves identically, and only a reader of ChartRenderable sees the new information.

        WHICH SIGNAL TO READ, BY VERSION. Below 2.13.112, a 5xx whose body contains `execution error at
        (` - a STRING match on an error body, which breaks silently the day the message is reworded. From
        2.13.112, reason == TemplateRefused with status 400 instead of 500 - a fact rather than a parse.
        KEEP BOTH while any cluster runs below 2.13.112: 057 and demo are on 2.13.111 as of 2026-11-18,
        so the string discriminator is still the live one on both.

        This row exists because core-provider sent the declaration copied from their branch before cutting
        the tag, and check-ready-reasons-current failed the moment 2.13.112 published. That is the contract
        working in both directions.'
    RBACComplete:
      universal: false
      healthy:
      - Applied
      unhealthy:
      - ApplyFailed
      - NamespaceTerminating
      - NotEvaluated
      note: 'every RBAC object derived from the chart was applied. A chart-inspector outage is what puts
        this at risk, and it is the condition a Ready-only check cannot see.

        THIS NOTE WAS LOST, not missing. It had been written one block down, inside ApiResolved, where
        it became a DUPLICATE `note:` key -- YAML keeps the last, so it silently replaced ApiResolved''s
        own note and left this condition undocumented. Two defects from one misindented line, and repairing
        only ApiResolved would have discarded this text for good.

        RBACComplete REPORTS ONLY THE RBAC DERIVED FROM THE CHART (cdc rbaccomplete.go:18, #357). An apiRef
        identity''s grant is generated by core-provider and surfaces on ApiResolved instead, so a refused
        apiRef read leaves THIS condition True. The two conditions are not substitutes.'
    ApiResolved:
      universal: false
      healthy:
      - Resolved
      open_family: true
      unhealthy:
      - ApiPartiallyResolved
      unevaluated:
      - StageOutcomesUnknown
      note: 'the reason sets above arrive generated with core-provider#529 (36 rows over five condition
        types). Until that merges they are RELAYED from core-provider rather than read from the file,
        so the gate''s first run against the merged table is what confirms them.

        A DUPLICATE `note:` KEY LIVED HERE and YAML silently kept the LAST one, so this block documented
        ApiResolved with RBACComplete''s text ("every RBAC object derived from the chart was applied").
        The file parsed, this gate compares REASON SETS rather than notes, and nothing caught it. A duplicate
        key is the quietest defect a vendored table can carry: no parse error, no gate failure, and a
        reader who trusts the note is told about the wrong condition.

        STAGED AHEAD OF core-provider#547 (2.13.106), as CreateOutcomeUnknown was, so the gate goes green
        on the same commit that docs/ready-reasons.md gains these two rows rather than blocking every
        PR in between.

        ApiPartiallyResolved (False): the X-Snowplow-Stage-Outcomes header (snowplow 1.12.57+) named a
        failed stage. THE ONLY ApiResolved=False WITH DATA PROJECTED -- every other False leaves .api
        wholly absent -- so a consumer that short-circuits on the condition skips data that is present
        and valid. CLASSED `unhealthy`, NOT `converging`: a partial result triggers NO REQUEUE of its
        own, so "may complete next pass" predicts a convergence nothing schedules, and the causes are
        DURABLE (Forbidden, NotFound, Aborted/NotRun, which snowplow replays until the RESTAction is edited).
        I proposed `converging` and core-provider was right to refuse it.

        StageOutcomesUnknown (Unknown): the header is absent, so snowplow cannot confirm. The cdc does
        NO version check -- it gates on the capability, never on a version, which stays correct across
        a backport or a fork. krateo-057 runs snowplow 1.12.70, thirteen releases inside the floor.

        2.13.106 ALSO ADDS status.unrefreshedFields, the projected forPaths holding a value this pass
        did not write. That is the instrument for the STALE case: a guarded projection (${ ... // empty
        } or an iterator) over a missing key writes NOTHING, so the field KEEPS its previous value and
        looks like a fresh read. A bare path writes null, which the apiserver drops, so absence is visible.
        Before this field, stale was undetectable -- which is why internal-ca-bundle''s projection must
        stay a bare path.'
  source:
    repo: krateo-platformops/core-provider
    path: docs/ready-reasons.md
    checked_against: 7f7680a30a97977b64376ad84f8d4eed81eda751
    checked_on: '2026-11-17'
  converged:
  - Available
  - AvailablePartialCoverage
  - ReconcileGracefullyPaused
  - ReconcilePaused
  converging:
  - Creating
  - HelmOperationInProgress
  - PendingHelmOperation
  - ChildrenForbidden
  - InventoryNotRecorded
  - Deleting
  failed:
  - Unavailable
  - CreateOutcomeUnknown
  - HooksMayNotHaveRun
  unevaluated:
  - ZeroEvidence
  - ObserveFailed
  requires_synced_true:
  - ReconcilePaused
  - ReconcileGracefullyPaused
compositionDefinition:
  source:
    repo: krateo-platformops/core-provider
    path: docs/cd-ready-reasons.md
    checked_against: ded4da21785f2d8d13cc2036c59f44be3b2d5d9e
    checked_on: '2026-11-17'
    released_in:
      SchemaDefaultContradiction: null
      ValuesSchemaMissing: null
      RemoteChartUnreachable: already written by 2.13.105; its FAILED rollup verdict is what needs the
        7da7248 release
      ScaledToZero: 2.13.84
  condition_types:
    Ready:
      universal: true
      note: the CRD serves the version and is Established, and the cdc's own controller Deployment has
        rolled out. Classified by the converged/converging/failed/unevaluated lists below. It says NOTHING
        about the workload the composition installs.
    Synced:
      universal: true
      healthy:
      - ReconcileSuccess
      unhealthy:
      - ReconcileError
      - ReconcilePaused
      note: 'THE COLLISION THAT FORCED THIS SPLIT. ReconcilePaused here is a SYNCED reason, and core-provider
        is explicit that Ready is LEFT AS IT WAS -- so a paused definition''s Ready is STALE, not healthy.
        On a COMPOSITION the same string is a READY reason meaning healthy-but-paused, and it sits in
        that namespace''s `converged` list. Never classify this string without its condition. ReconcileError
        with Ready=False/SchemaDefaultContradiction reads "observe failed: " followed by Ready''s message.'
    ApiRefRBACComplete:
      universal: false
      healthy:
      - ReadSetResolved
      unhealthy:
      - RESTActionNotFound
      - RESTActionForbidden
      - StageUnresolvable
      - InvalidApiRef
      - Unauthorized
      - SnowplowUnavailable
      - SnowplowError
      - SnowplowNotConfigured
      note: 'core-provider#595. NOT universal: written only for a definition whose chart carries an apiRef.
        Every row''s parent verdict is `-`, so NONE of these is a Ready reason and the rollup never reads
        them -- it only EXPLAINS a Synced=False that is already shown. SnowplowNotConfigured is the one
        to watch here: it is what rdc reports when rdc.env.URL_SNOWPLOW is unset, which is exactly the
        hole installer#578''s internalPeerUrls closes, and it was SILENTLY INERT before that condition
        existed.'
    AuthnDelegation:
      universal: false
      healthy:
      - Rendered
      unhealthy:
      - DelegationUnsupported
      note: core-provider#595. Informational; parent verdict `-` on both rows.
    AuthnMappingApplied:
      universal: false
      healthy:
      - Applied
      unhealthy:
      - AuthnNotInstalled
      note: core-provider#595. False/AuthnNotInstalled IS A HEALTHY DEFINITION -- it means authn is not
        installed, not that anything failed. Parent verdict `-`, so it never reaches Ready.
    ControllerActive:
      universal: true
      healthy:
      - Running
      unhealthy:
      - ScaledToZero
      - Unavailable
      unevaluated:
      - NotObserved
      note: 'core-provider#595. THREE OF ITS FOUR REASONS ARE ALSO READY REASONS, CLASSIFIED DIFFERENTLY,
        which is the same collision that forced the Ready/Synced split: ScaledToZero is CONVERGED on Ready
        and False here; Unavailable is FAILED on Ready and False here; NotObserved is UNEVALUATED on Ready
        and Unknown here. Never classify any of these strings without its condition. Parent verdict `-`
        on all four, and Ready already carries the controller state, so this condition adds no Ready information.'
    SchemaFullyEnforced:
      universal: true
      healthy:
      - FullyEnforced
      unhealthy:
      - ConstraintsNotEnforced
      unevaluated:
      - OwnedByAnotherDefinition
      - SchemaInferred
      note: 'core-provider#595 plus #596, which added Unknown/SchemaInferred. True must keep meaning AUTHORED
        CONSTRAINTS, ALL ENFORCED -- SchemaInferred is Unknown precisely so an inferred schema cannot
        read as fully enforced. Fires only for a CD carrying the opt-in annotation krateo.io/values-schema:
        infer; no chart of ours sets it. OwnedByAnotherDefinition is shared with SpecSchemaCurrent and
        ValuesSchemaAuthored and means a FOLLOWER, not a fault.'
    SpecSchemaCurrent:
      universal: true
      healthy:
      - Current
      unhealthy:
      - LooserSchemaPending
      - GeneratedSchemaNotLooser
      unevaluated:
      - OwnedByAnotherDefinition
      note: core-provider#595. Informational; parent verdict `-` on all rows.
    ValuesSchemaAuthored:
      universal: true
      healthy:
      - Authored
      unhealthy:
      - InferredFromValues
      unevaluated:
      - OwnedByAnotherDefinition
      note: 'core-provider#596 (#568 child 6). False/InferredFromValues is NOT a fault: it means the chart
        shipped no values.schema.json and the CD carries krateo.io/values-schema: infer, so a schema was
        inferred instead of the definition reading Ready=False/ValuesSchemaMissing. Ready is unaffected
        and an inferred definition reads Available. ValuesSchemaMissing stays in this namespace''s `failed`
        list for the un-annotated case.'
  converged:
  - Available
  - ScaledToZero
  converging:
  - Creating
  - Deleting
  failed:
  - Unavailable
  - RemoteChartUnreachable
  - SchemaDefaultContradiction
  - ValuesSchemaMissing
  - DerivedNameTooLong
  unevaluated:
  - NotObserved
