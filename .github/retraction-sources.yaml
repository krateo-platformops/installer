# The repos that publish a retracted-versions.yaml, and the charts each may speak for.
#
# WHY THIS FILE EXISTS. This gate read ONE hardcoded list, in krateo-platformops/frontend.
# core-provider then asked that core-provider 2.13.85-2.13.94 never be pinned, and the obvious
# move -- add the entries to frontend's file -- is wrong, as frontend pointed out: their list is
# the publisher vouching for its OWN releases, and their crdgen/retracted_test.go refuses any
# chart the repo does not publish. Adding another team's versions would mean loosening that
# check, leaving frontend asserting facts about releases it cannot verify. An entry's value IS
# its authority. So retraction lists are per publisher, and this file says whose we read.
#
# `charts` is the set that publisher may retract, BY CHART NAME, as in the `chart:` field of
# component-pins.yaml or the dependency name in chart/Chart.yaml. It is enforced here, on the
# consumer side, as well as in the publisher's own test: an entry naming a chart outside its
# set FAILS this gate rather than being obeyed. That is deliberate -- a list that can retract
# anything is a list anyone can use to block anyone.
#
# ADDING A REPO: its retracted-versions.yaml must already exist. A listed repo whose list is a
# 404 FAILS CLOSED and blocks every PR here, by design: a tolerated 404 reads exactly like
# every pin being clean, which is the one thing a guard must never report by accident.
#
# NOT YET LISTED, and deliberately: krateo-platformops/core-provider. They have no
# retracted-versions.yaml at their repo root today. Listing them before they publish one would
# block this repo's CI for a reason unrelated to any PR. Add the line in the same change that
# their list goes live -- their charts are core-provider and core-provider-crds.
sources:
  - repo: krateo-platformops/frontend
    # Confirmed by frontend 2026-11-14: exactly the set crdgen/retracted_test.go enforces on
    # their side, so the two cannot disagree.
    charts:
      - frontend
      - frontend-crds
      - builder-gate
  - repo: krateo-platformops/oasgen-provider
    # Added 2026-11-14, AFTER their retracted-versions.yaml went live at their origin/main and not
    # before: a listed repo whose list 404s fails closed and blocks every PR here, so the order was
    # merge-then-list. Verified by fetching the file from their main in the same change.
    #
    # THE CHART NAMES ARE THEIRS, enumerated from their repo, not from my memory. I first told them
    # "oasgen-provider and oasgen-provider-crd" and they corrected both halves: the chart is
    # oasgen-provider-crd**s** (component `oasgen-provider-crd` maps to it), and I had omitted
    # controller-render-service entirely. Twelve components in component-pins.yaml have a chart
    # name differing from their component name, and `charts` here names the CHART. An entry naming
    # a component is scoped out by this gate and retracts NOTHING, silently -- worse than absent.
    #
    # WHY ALL THREE when the defect is in the provider: all three are declared members of the
    # `oasgen` version line, and check-same-version-line refuses a pin where they are not in step.
    # Retracting only the provider would leave controller-render-service pinnable at the same bad
    # version with the line gate confirming they are "in step" -- a gate saying "consistent" where
    # a reader hears "safe".
    charts:
      - oasgen-provider
      - oasgen-provider-crds
      - controller-render-service
  - repo: krateo-platformops/portal
    # Added 2026-11-14 AFTER this repo's pins moved off 1.8.119, and that order is the whole
    # constraint: a listed retraction against a version main still pins fails CI CLOSED and blocks
    # EVERY pull request here, not just a portal one. So the sequence was pin 1.8.120 (#924), then
    # this line. frontend and I agreed it explicitly before either side moved.
    #
    # WHY PORTAL AND NOT frontend. I asked frontend to carry the alerts-page entry and that was
    # wrong: their retracted-versions.yaml lists only frontend's own charts and their
    # crdgen/retracted_test.go would refuse an alerts-page entry, rightly. The publisher of a
    # version is the one who retracts it -- an entry's value IS its authority, which is the
    # principle this whole per-publisher file exists to encode, and I still asked the wrong team.
    #
    # THEIR FIRST ENTRY IS 1.8.119 FOR alerts-page ALONE, not the line. Only alerts-page has the
    # defect (an invalid metadata.name, so the composition cannot render); the other 16 render with
    # 0 invalid names. Naming all 17 would assert a defect in 16 charts that are fine. It still
    # makes "the line at 1.8.119" unpinnable, because check-same-version-line refuses a pin whose
    # line members are out of step -- so the true defect alone is sufficient.
    #
    # The charts list is theirs, enumerated from their repo. portal publishes the shell, the agents
    # chart and the 15 page charts; `charts` here names the CHART.
    charts:
      - portal
      - portal-agents
      - alerts-page
      - audit-page
      - blueprints-page
      - builders-page
      - clusters-page
      - compositions-page
      - dashboard-page
      - incidents-page
      - marketplace-page
      - observability-page
      - resources-page
      - reviews-page
      - search-page
      - service-desk-page
      - settings-page

  # observability publishes nine charts and had no retracted-versions.yaml until today
  # (krateo-platformops/observability#183, merged 5d86fc6). Declared the same day the file
  # landed and NOT before: a declared source with no file is a gate that passes VACUOUSLY --
  # it reads as covered while nothing is being read, which is worse than an honest gap.
  # Its one entry is krateo-slo-rollup 0.1.1 -> use 0.1.2, the writer-identity default that
  # was never enabled anywhere. observability deliberately did NOT list 0.1.47, which they
  # superseded with 0.1.48: superseded is not defective, and pinning it would put nothing
  # wrong on a cluster. That distinction is theirs and it is the right one.
  # snowplow's retracted-versions.yaml landed on main 2026-11-16 (snowplow#1497, merge
  #   5c1dab56e55229225ae8aad6e638c8ae34d6acd5, file at the repo root). Declared only after that
  #   merge commit, because the gate FAILS CLOSED on a 404 and declaring a source whose file does
  #   not exist yet would have blocked every PR that changes a snowplow pin.
  #   Content at declaration time: 1.12.71, 1.12.72 and 1.12.73 retracted for both charts, with
  #   `use: 1.12.70`. 057 runs 1.12.70 and main pins 1.12.70, so there are 0 hits today -- the
  #   snowplow session ran this repo's own check-retracted-versions.py against the file and got
  #   0 errors and 0 hits on main's pins, with a pin at 1.12.71-1.12.73 hitting both components.
  #   THAT LIST DOES NOT SHRINK, and my earlier note here said it would. Diego ruled on
  #   2026-11-17 that 1.12.71 is not released at all, and the next release is 1.12.74,
  #   carrying everything since 1.12.70 and measured against 1.12.70 in ONE paired run after
  #   the bench fix (snowplow#1511) and its rehearsal.
  #   THE MERIT IS "UNMEASURED", NOT "DEFECTIVE" -- snowplow corrected my first wording here
  #   and the distinction is theirs to set. They release only versions measured against the
  #   current release, and these three were never measured: launch A (1.12.72) and launch B
  #   (1.12.71) both ended INVALID because GKE resized the control planes mid-measure, and
  #   1.12.73 was never run. After the 1.12.74 ruling they will never be measured. So they are
  #   retracted for want of evidence, and NOT known to be defective.
  #   WHICH IS A THIRD CATEGORY, distinct from both notes above it. observability's 0.1.47 was
  #   SUPERSEDED -- fine to pin, so deliberately not listed. frontend's 1.8.24 was DEFECTIVE --
  #   a measured enum regression. These three are UNMEASURED: nobody claims they are broken and
  #   nobody can say they are not. They stay listed permanently, and the reason to honour the
  #   retraction is the absence of evidence rather than the presence of a defect. Do not prune
  #   them because 1.12.74 supersedes them, and do not describe them as broken either.
  #   snowplow#1514 makes their own file say exactly this per reason; this gate picks it up when
  #   it merges. That PR also corrects their header's description of this check's scope, which
  #   matches what the script prints: on a PULL REQUEST it checks the CHANGED pins, and on a
  #   push to main or a manual run it checks EVERY pin and Chart.yaml dependency.
  #   Ordering that constrains this repo: 1.12.74 is cut BEFORE snowplow#1504 merges, so it
  #   keeps the impersonateGroups CEL rule and works with any core-provider. The version
  #   carrying #1504 comes after, behind the installer's own tag sequence.
  - repo: krateo-platformops/snowplow
    charts:
      - snowplow
      - snowplow-crds
  - repo: krateo-blueprints/krateo-keycloak-realm
    # THE FIRST krateo-blueprints SOURCE. Added 2026-11-17 AFTER their retracted-versions.yaml
    # went live at their repo root and not before -- verified by fetching and parsing it in this
    # same change. A listed repo whose list 404s fails closed and blocks EVERY pull request here,
    # so the order was publisher-first, exactly as it was for oasgen-provider and portal.
    #
    # THE ENTRY IT CARRIES: 0.6.0, use 0.6.1. 0.6.0 names a KeycloakUser object
    # <realm>-<username>, and on demo the four film personas are OBJECTS persona-ada/-bob/-acme/
    # -globex whose USERNAMES are ada/bob/acme/globex. So 0.6.0 would create a second CR beside
    # each existing one, and the originals carry the default DELETE policy -- a later tidy-up of
    # "the duplicates" would delete the Keycloak user the personas authenticate through.
    # ACTIVELY HARMFUL rather than merely superseded, on the asymmetry keycloak-provider-kog
    # named: without `name` the duplicates are SILENT, while with `name` 0.6.0's own closed
    # schema refuses the render, which is at least loud.
    #
    # Nothing pins 0.6.0 here: main pins 0.5.3 and the pending pin goes to 0.6.1. So this entry
    # protects the NEXT pinning session rather than fixing a current state.
    charts:
      - krateo-keycloak-realm
  - repo: krateo-platformops/observability
    charts:
      - clickhouse-operator
      - krateo-audit-worm
      - krateo-observability
      - krateo-slo-rollup
      - krateo-sse-proxy
      - mongodb-operator
      - otel-collector-daemonset
      - otel-collector-deployment
      - otel-collector-tailsampling
