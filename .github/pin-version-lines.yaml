# Groups of pins that MUST carry the same version, because they are not independent charts: they
# ship from one source and one release, and a skew between them is a silent inconsistency rather
# than a supported configuration.
#
# This is NOT the `<x>` / `<x>-crd` rule -- that is check-pin-crd-lockstep.py, which compares a
# component against its own CRD chart. This file is for groups whose members are the SAME ARTIFACT
# released together, where "the versions differ" has no valid reading at all.
#
# Each entry is a CLAIM THAT GETS CHECKED, not a suppression: check-same-version-line.py fails when
# the members disagree, so a group cannot rot into documentation nobody enforces.

lines:
  - name: oasgen
    members: [oasgen-provider, oasgen-provider-crd, controller-render-service]
    # `controller-render-service` is NOT a separate service. Its chart runs the SAME IMAGE as
    # oasgen-provider with a different entrypoint -- measured on krateo-057, 2026-11-12:
    #   controller-render-service  ghcr.io/krateo-platformops/oasgen-provider:0.48.0
    #                              command: [/bin/oasgen-render]
    #   oasgen-provider            ghcr.io/krateo-platformops/oasgen-provider:0.61.0
    # Its chart sets image.tag: "" so appVersion drives the tag, and it is published per oasgen
    # version (0.48.0, 0.59.0, 0.61.0, 0.62.0 all exist; 0.99999.0 does not, as a control).
    #
    # The chart's own values.yaml claims "same image, same tag, different command - so the renderer
    # can never drift from the controller". That is true of the CHART and false of this repo's
    # delivery model, because these were pinned as two independent components. They drifted by 13
    # versions on 057 and 11 on krateo-demo.
    #
    # THE CONSEQUENCE IS USER-VISIBLE, not just a broken measuring instrument.
    # `crdgen.GenerateWithWarnings` first exists in plumbing v1.26.1, and oasgen only began CALLING
    # it at 0.53.0 (references: 0.48.0 -> 0, 0.53.0 -> 3, 0.61.0 -> 3). The 0.48.0 renderer calls
    # plain `Generate`, which has NO WARNING CHANNEL. The Controller Builder posts its draft to this
    # service's POST /render, so at 0.48.0 an author gets a CLEAN PREVIEW for a document the
    # controller will warn about -- a dropped constraint, a vendor-shape conflict, a schema that
    # silently will not appear. frontend confirmed their UI shows warnings distinctly from errors
    # and arms publish only on zero problems, so moving to 0.61.0 is pure gain: newly visible
    # warnings are the preview finally telling the truth.
    #
    # NOT the reason, recorded because I asserted it and it was false: I first justified this by
    # the `not`-subschema transpile change between plumbing v1.33.0 and v1.40.0. oasgen 0.61.0 pins
    # v1.33.0, BELOW v1.40.0, so the controller does not have that change either; it arrives only
    # with the unreleased v1.60.0 bump. The real divergence span is v1.14.2 -> v1.33.0.
    reason: >-
      controller-render-service runs the oasgen-provider image with the /bin/oasgen-render
      entrypoint, so its version IS oasgen's version. A skew means the renderer predicts CRDs with
      a different transpile than the controller applies, and below 0.53.0 it cannot report
      generation warnings at all.

  - name: frontend
    members: [frontend, frontend-crd, builder-gate]
    # Enforced by hand until now, and it has slipped: check-no-silent-downgrade.py records that
    # installer#727 would have reverted frontend/frontend-crd/builder-gate 1.8.32 -> 1.8.28
    # together. They are one release line in the frontend repo; frontend confirms a single tag
    # publishes all three (e.g. 1.8.41 ships frontend, frontend-crds and builder-gate).
    reason: >-
      One release line in the frontend repo: a single tag publishes all three charts. An app pinned
      past its -crd pin prunes fields silently.

  - name: nightly-review
    members: [nightly-review, nightly-review-crd]
    # One tag in the nightly-review repo runs release-oci, which publishes BOTH charts at the
    # tag's version; release-tag builds the one image. Its owner confirms there is no path that
    # publishes one without the other, so "the versions differ" has no valid reading here either.
    #
    # Declared because of what 0.2.3 looked like: the CRDs were byte-identical in content and
    # bumped ONLY because both charts publish at the tag. That is exactly the case a
    # hand-maintained pairing gets wrong -- nothing in the diff suggests the -crd pin needs
    # touching, so a reviewer moving the app alone would see nothing amiss.
    reason: >-
      One tag publishes both charts from the nightly-review repo. An app pinned past its -crd pin
      prunes fields silently.

  - name: snowplow
    members: [snowplow, snowplow-crd]
    # Declared at snowplow's own request, and it closed a live skew to get here: the app chart was
    # pinned 1.12.67 while snowplow-crd sat at 1.12.65. That skew was ACCIDENTALLY HARMLESS rather
    # than safe -- the CRD templates (helm/snowplow-crds/templates/templates.krateo.io_restactions.yaml)
    # last changed in snowplow#1136, first released in 1.12.65, and nothing has touched them since,
    # which I verified independently by sha256 per file: 1.12.65 and 1.12.67 differ ONLY in
    # Chart.yaml, 4 files each. So nothing was broken, and nothing would have warned when the next
    # CRD change landed either.
    #
    # snowplow-agent is NOT a member: its own repo, its own version line (1.2.6), and 1.12.71 does
    # not require it. Asserting otherwise would make this entry a claim the gate would then enforce
    # against an unrelated artifact.
    reason: >-
      One snowplow tag publishes the image AND both charts at the same version -- release-oci
      substitutes the tag into both Chart.yamls, and helm/snowplow-crds/Chart.yaml says "the
      installer pins both at one version". An app pinned past its -crd pin prunes fields silently,
      and this pair had already drifted two patch versions without anything noticing.

  - name: keycloak
    members: [keycloak, keycloak-operator]
    # Declared on EVIDENCE, not on two matching version numbers -- and the distinction matters,
    # because agentgateway-controller is the counter-example: 0.2.0..0.2.32 is thirty-two releases
    # whose chart is byte-identical apart from Chart.yaml, its version merely tracking a sibling in
    # the same repo. Matching numbers prove nothing on their own.
    #
    # The evidence, from krateo-keycloak-blueprint's .github/workflows/release-tag.yaml rather than
    # from its author's summary: a step named "Package every chart once" stamps and packages EVERY
    # Chart.yaml in the repo at the tag version (`helm package --version ${VERSION}`), and a gate
    # refuses any archive whose Chart.yaml version differs from the tag. So the operator chart CANNOT
    # move without the keycloak chart moving, and the versions differing has no valid reading.
    #
    # Recorded precisely, because the first wording was looser: the operator chart has had NO change
    # since 0.3.0 (`git log 0.3.0..0.4.0 -- helm/keycloak-operator` is empty). 0.3.0 is what REMOVED
    # crdOwnershipBridge.enabled/.image, which is why they appeared to vanish relative to our 0.2.6
    # pin. Harmless here: componentValues.keycloak-operator never declared them.
    reason: >-
      One release line in krateo-keycloak-blueprint: a single tag packages every chart in the repo at
      the tag version, and a gate refuses an archive whose Chart.yaml version differs. The operator
      cannot move without the keycloak chart, so a skew has no valid reading.

  - name: core-provider
    members: [core-provider, core-provider-crds]
    # THE FIRST LINE WHOSE MEMBERS ARE NOT PINS. Both are bootstrap SUBCHARTS declared in
    # chart/Chart.yaml's `dependencies`, and neither appears in component-pins.yaml -- so until
    # 2026-11-14 this gate was structurally blind to them, and their mandatory pairing was enforced
    # by nothing at all.
    #
    # WHY A SKEW HERE IS SILENT, which is what makes it dangerous. Confirmed against the tags by
    # core-provider: helm/core-provider-crds/.../core.krateo.io_compositiondefinitions.yaml mentions
    # servedVersionsPendingPrune 0 times at 2.13.84 and once at 2.13.85. At 2.13.84 the CD status
    # schema is STRUCTURAL -- the three x-kubernetes-preserve-unknown-fields hits in that file are
    # under the RESTAction ref and statusDataTemplate, not under status. So a newer binary writing
    # the grace record has it PRUNED BY THE APISERVER while the write still reports success: the
    # record is never read back, its clock restarts on every write, nothing ever comes due, and
    # nothing is ever pruned.
    #
    # That is the same shape as our own componentValues pruning -- an undeclared field vanishes while
    # kubectl prints success -- and it is how krateo-057 came to be diagnosed as "the prune has
    # stopped" on 2026-11-13 when the prune was in fact running 36 times in the log window.
    #
    # EVIDENCE that one tag publishes both, applying the same test used for keycloak rather than
    # inferring it from matching numbers: for 2.13.95 the only release run was release-tag, and it
    # published three images and three charts all at 2.13.95, with 2.13.94 beside each. Verified
    # independently here: core-provider and core-provider-crds both pull at 2.13.95, with 2.13.82 as
    # positive controls and 2.13.99999 absent as a negative. core-provider-target is published too
    # and is NOT consumed by this chart, so it is deliberately not a member.
    # (core-provider withdrew an earlier claim that release-oci publishes them on the same tag push;
    # it has not since 2.13.67. The corrected fact is the one recorded above.)
    reason: >-
      Bootstrap subcharts in chart/Chart.yaml, not pins. The grace record is
      status.servedVersionsPendingPrune on the CompositionDefinition CRD, first present in
      core-provider-crds 2.13.85. A newer core-provider binary running against an older CRDs chart
      has that record pruned by the apiserver on every write, so the grace never comes due and
      nothing is ever pruned -- silently, with every write reporting success.
