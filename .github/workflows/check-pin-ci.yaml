name: check-pin-ci

# Installer-specific guard: a bumped component pin must point at a commit whose OWN repo CI
# was green.
#
# WHY. On 2026-10-27 this repo pinned frontend 1.8.12 and rolled it to krateo-057. That tag
# is commit 191e7f65, whose `test` check was FAILURE, with 52 tests silently not collecting.
# Nothing in the path objected: the pin PR's other checks are all about the CHART, and the
# component's release workflows are tag-triggered and independent of `test`, so a tag cuts
# cleanly over a red main. A green release workflow is not a green repo.
#
# HOW IT RESOLVES THE REPO. No hardcoded map: a published chart names its own `sources` and
# its `appVersion` is the app repo's tag, so chart version -> appVersion -> tag -> sha ->
# that repo's check-runs. CHECK-RUNS rather than a guessed workflow filename, because
# core-provider has no `test.yaml` at all (its tests run as `test-core-provider` et al) and
# a filename lookup returned "unknown" and PASSED — a guard that cannot find the tests
# reads exactly like one that found them green.
#
# NOT a required status check: adding one needs an org ruleset change. It runs unfiltered
# anyway — a pin can be bumped from either chart/files/component-pins.yaml or
# chart/Chart.yaml, and filtering on a subset of paths is how the next one gets through.

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pin-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Install PyYAML
        run: pip install --quiet pyyaml
      - name: Assert every bumped pin's component CI was green at its tagged commit
        env:
          BASE_REF: origin/${{ github.base_ref }}
          # PREFER the cross-org read token, FALL BACK to the repo-scoped one.
          #
          # 26 of 66 pins are private repos in another org, and the repo-scoped GITHUB_TOKEN cannot
          # read them -- it reports UNVERIFIABLE, which is honest but checks nothing. A fine-grained
          # PAT with contents:read + checks:read on those repos closes the gap.
          #
          # THE FALLBACK IS DELIBERATE AND MUST NOT BECOME SILENT. If PIN_CI_READ_TOKEN is unset or
          # expired, this runs on GITHUB_TOKEN and those 26 pins go back to UNVERIFIABLE -- which
          # still FAILS LOUDLY for a genuinely absent tag (that is UNRESOLVED, a different verdict),
          # so the fallback degrades coverage without ever manufacturing a pass. The step below
          # states which token was used, so a quietly expired PAT shows up in the log rather than as
          # a mysterious drop in verified pins.
          GH_TOKEN: ${{ secrets.PIN_CI_READ_TOKEN || secrets.GITHUB_TOKEN }}
          PIN_CI_TOKEN_KIND: ${{ secrets.PIN_CI_READ_TOKEN && 'cross-org PAT' || 'repo-scoped GITHUB_TOKEN' }}
        run: |
          echo "pin-ci token: ${PIN_CI_TOKEN_KIND}"
          python3 .github/scripts/check-pin-ci.py
