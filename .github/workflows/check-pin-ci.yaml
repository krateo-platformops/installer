name: check-pin-ci

# Installer-specific guard: a bumped component pin must point at a commit whose OWN repo CI
# was green.
#
# WHY. On 2026-10-27 this repo pinned frontend 1.8.12 and rolled it to krateo-057. That tag
# is commit 191e7f65, whose `test` check was FAILURE, with 52 tests silently not collecting.
# Nothing in the path objected: the pin PR's other checks are all about the CHART, and the
# component's release workflows are tag-triggered and independent of `test`, so a tag cuts
# cleanly over a red main. A green release workflow is not a green repo.
#
# HOW IT RESOLVES THE REPO. No hardcoded map: a published chart names its own `sources` and
# its `appVersion` is the app repo's tag, so chart version -> appVersion -> tag -> sha ->
# that repo's check-runs. CHECK-RUNS rather than a guessed workflow filename, because
# core-provider has no `test.yaml` at all (its tests run as `test-core-provider` et al) and
# a filename lookup returned "unknown" and PASSED — a guard that cannot find the tests
# reads exactly like one that found them green.
#
# NOT a required status check: adding one needs an org ruleset change. It runs unfiltered
# anyway — a pin can be bumped from either chart/files/component-pins.yaml or
# chart/Chart.yaml, and filtering on a subset of paths is how the next one gets through.

on:
  pull_request:
      # NO `branches:` filter, deliberately. A `branches: [main]` here means the gate does
      # not run on a STACKED pull request -- one whose base is another PR's branch rather than
      # main. Such a PR then reports only `lint` (the one workflow that never had the filter)
      # and shows mergeable/CLEAN with "all checks passed", which reads as verified while every
      # gate in this directory was skipped. Measured 2026-11-03 on the #623->#624->#625 stack:
      # #623 (base main) ran 25 checks, #624 and #625 ran 2. A gate that silently does not run
      # is worse than no gate, because the green tick is read as its verdict.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fixtures:
    name: Makefile-resolution fixtures (no network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 — was v4 (Node 20, deprecated)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: install pyyaml
        run: pip install --quiet pyyaml
      # Offline, because the arm being tested is the PURE resolver. check-pin-ci reported
      # incident-controller 0.5.1 as "nothing tested the code" when its CI is one `make check`
      # whose chain reaches `go test -race -cover ./...`. Both directions are asserted: the
      # chain must be followed, and a target reaching no test command must still fail.
      - name: exercise the Makefile resolution
        run: python3 -I .github/scripts/check-pin-ci-fixtures.py

  pin-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 — was v4 (Node 20, deprecated)
        with:
          fetch-depth: 0
      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0 — was v4 (Node 20, deprecated)
        with:
          version: v3.16.3
      - name: Install PyYAML
        run: pip install --quiet pyyaml

      # REGISTRY LOGIN. This gate's FIRST act on every pin is `helm show chart`, and an
      # unauthenticated runner gets 401 from any PRIVATE package -- which is the whole
      # krateo-agentiko org. Measured on installer#696: repo-mcp-server 0.1.6 pulls fine from a
      # developer shell and CI reported
      #     "chart oci://ghcr.io/krateo-agentiko/charts/repo-mcp-server is NOT PULLABLE
      #      -- cannot verify anything about it"
      # An anonymous pull of the CURRENTLY PINNED 0.1.5 fails identically, so this was never about
      # the new version: EVERY agentiko pin was unverifiable here, and the first one to be bumped
      # since the gate was written is the one that found it. The gate failing closed was correct;
      # it simply could not read what it was asked to judge.
      #
      # WHY `PAT` AND NOT A NEW SECRET. The first version of this step used CHART_READ_TOKEN,
      # mirroring nightly-chart-root-schema-all -- and that secret DOES NOT EXIST. Measured:
      # orgs/krateo-platformops/actions/secrets/CHART_READ_TOKEN -> 404, five org secrets present
      # and all visibility=all, repo-level secrets 0. Which also explains why
      # nightly-chart-root-schema-all has failed at its "Log in to GHCR" step every night since at
      # least 2026-11-01: it references a secret that has never existed, and fails loudly each time
      # with nobody reading the result. `PAT` exists, is visibility=all and already reaches this
      # repo, so Diego chose it over creating a new one.
      #
      # WHETHER `PAT` REACHES THE OTHER ORG IS UNKNOWN AND THIS STEP IS THE TEST. Nobody can read
      # its scopes. A 401/403 on krateo-agentiko means it lacks read:packages there, and that is a
      # finding to take back rather than something to work around here. A LOCAL pull is NOT the
      # proof: the claim is specifically "a CI run from THIS repo can read that chart".
      #
      # FAILS, NEVER SKIPS, when the secret is absent: a gate that quietly stops verifying reports
      # green without having checked anything, which is worse than no gate.
      - name: Registry login
        run: |
          if [ -z "${{ secrets.PAT }}" ]; then
            echo "::error::PAT is not set or not visible to this repository. This gate pulls every"
            echo "::error::bumped chart to read its appVersion and provenance annotations, and private"
            echo "::error::packages answer 401 to an unauthenticated runner. Failing rather than skipping."
            exit 1
          fi
          echo "${{ secrets.PAT }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      # POSITIVE CONTROL, and it is the point of the step above rather than an extra. A login that
      # SUCCEEDS proves a handshake, not read access -- and this gate's whole failure mode today was
      # an instrument reporting a true answer to the wrong question. So prove the credential can
      # actually read the private org, with a chart that is pinned RIGHT NOW and must therefore be
      # readable, and fail if it cannot. Without this, a PAT lacking read:packages on
      # krateo-agentiko would log in cleanly and then report every agentiko pin UNRESOLVED -- which
      # reads as a pin problem and is not one.
      - name: Prove the credential can read the private org
        run: |
          if ! helm show chart oci://ghcr.io/krateo-agentiko/charts/repo-mcp-server --version 0.1.5 >/dev/null 2>&1; then
            echo "::error::Registry login succeeded but the credential CANNOT READ krateo-agentiko."
            echo "::error::repo-mcp-server 0.1.5 is PINNED on main, so it must be readable; a failure"
            echo "::error::here means PAT lacks read:packages on that org. Every agentiko pin will"
            echo "::error::report UNRESOLVED, which looks like a pin defect and is not one."
            echo "::error::FIX: grant read:packages on krateo-agentiko to the token behind PAT."
            exit 1
          fi
          echo "positive control OK: a currently-pinned private krateo-agentiko chart is readable"

      # Mint a short-lived installation token from the krateo-pin-ci GitHub App.
      #
      # WHY AN APP AND NOT A PAT. This gate reads CHECK-RUNS. GitHub offers no `Checks`
      # permission for fine-grained PATs in this org -- in the picker, Attestations is
      # followed directly by Code quality -- so a PAT with contents:read resolves the tag
      # and then gets `HTTP 403: Resource not accessible by personal access token` on
      # /commits/{sha}/check-runs. Adding Actions:Read does NOT help: Actions covers
      # "workflows, workflow runs and artifacts", not the Checks API. That was measured,
      # not assumed. A GitHub App has a real Checks:Read -- exactly, and only, what this
      # gate needs. The app holds checks:read + contents:read and nothing else.
      #
      # ONE TOKEN PER ORG, BECAUSE ONE TOKEN CANNOT SPAN TWO. A GitHub App token is issued per
      # INSTALLATION, and create-github-app-token mints it for exactly one `owner`. This step used to
      # pass `owner: ${{ github.repository_owner }}`, which made the token krateo-platformops-only --
      # so the 26 pins in the other two orgs (krateo-agentiko 17, krateo-blueprints 9, all private)
      # stayed unreadable, and the repo-scoped GITHUB_TOKEN cannot see a private repo in another org
      # either. The earlier fix made that failure LOUD, which is how it was found; this one closes it.
      #
      # Each step is continue-on-error so a missing installation degrades that ONE org to
      # UNVERIFIABLE instead of failing the job, and check-pin-ci.py prints which credential answered
      # for which owner and warns by name when an org has none. Adding an org here is a two-line
      # change plus the App installation; the script needs no edit, since it routes on the owner in
      # the slug.
      - name: Mint a read-only token for krateo-platformops
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.PIN_CI_APP_ID }}
          private-key: ${{ secrets.PIN_CI_APP_KEY }}
          owner: krateo-platformops
      - name: Mint a read-only token for krateo-agentiko
        id: app-token-agentiko
        continue-on-error: true
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.PIN_CI_APP_ID }}
          private-key: ${{ secrets.PIN_CI_APP_KEY }}
          owner: krateo-agentiko
      - name: Mint a read-only token for krateo-blueprints
        id: app-token-blueprints
        continue-on-error: true
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.PIN_CI_APP_ID }}
          private-key: ${{ secrets.PIN_CI_APP_KEY }}
          owner: krateo-blueprints
      # Each minting step above is continue-on-error, so a missing installation degrades ONE org
      # rather than failing the job. That is the right behaviour and it has a silence: on
      # 2026-11-04 a run reported SUCCESS with two of the three tokens empty, because no pin had
      # changed so nothing needed reading. "success" there meant "nothing was unreadable", not
      # "all three minted" -- and the difference is invisible unless something says so.
      #
      # This step says so. It is deliberately NOT a failure: check-pin-ci.py treats a missing
      # per-org token as a problem only when a read then fails, and an earlier version that warned
      # on a missing token alone cried wolf the moment krateo-blueprints was made public. So the
      # outcome is REPORTED unconditionally and the job's verdict is left to the reads.
      #
      # It prints only whether each token is NON-EMPTY, never any part of a token.
      - name: Report which per-org tokens minted
        env:
          T_PLATFORMOPS: ${{ steps.app-token.outputs.token }}
          T_AGENTIKO: ${{ steps.app-token-agentiko.outputs.token }}
          T_BLUEPRINTS: ${{ steps.app-token-blueprints.outputs.token }}
        run: |
          minted=0
          total=0
          for org in PLATFORMOPS AGENTIKO BLUEPRINTS; do
            total=$((total+1))
            eval "v=\${T_$org}"
            if [ -n "$v" ]; then
              minted=$((minted+1))
              printf 'per-org token krateo-%-14s MINTED\n' "$(echo "$org" | tr 'A-Z' 'a-z')"
            else
              printf 'per-org token krateo-%-14s NOT MINTED\n' "$(echo "$org" | tr 'A-Z' 'a-z')"
            fi
          done
          echo "per-org App tokens minted: $minted of $total"
          if [ "$minted" -lt "$total" ]; then
            echo "::warning::only $minted of $total per-org App tokens minted. Pins owned by an org \
          without a token fall back to the repo-scoped GITHUB_TOKEN, which CANNOT read another \
          org's private repos -- so those pins are UNVERIFIABLE if any of them changed. This is a \
          warning rather than a failure because nothing is broken until a read actually fails; \
          check-pin-ci.py reports the per-owner outcome below."
          fi
      - name: Assert every bumped pin's component CI was green at its tagged commit
        env:
          BASE_REF: origin/${{ github.base_ref }}
          # PREFER the App installation token, FALL BACK to the repo-scoped one.
          #
          # 26 of 66 pins are private repos in another org, and the repo-scoped GITHUB_TOKEN cannot
          # read them -- it reports UNVERIFIABLE, which is honest but checks nothing. The App's
          # checks:read + contents:read closes the gap.
          #
          # THE FALLBACK IS DELIBERATE AND MUST NOT BECOME SILENT. If the app secrets are unset or
          # the key is rotated, this runs on GITHUB_TOKEN and those 26 pins go back to UNVERIFIABLE
          # -- which still FAILS LOUDLY for a genuinely absent tag (that is UNRESOLVED, a different
          # verdict), so the fallback degrades coverage without ever manufacturing a pass. The step
          # below states which token was used, so a quietly broken App shows up in the log rather
          # than as a mysterious drop in verified pins -- and since ci_at() now reports the API's
          # own error, a permission failure reads as "HTTP 403" instead of a bare "could not read".
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          # Per-org tokens. check-pin-ci.py reads the owner out of each `gh api repos/<owner>/...`
          # call and uses PIN_CI_TOKEN_<OWNER>, falling back to GH_TOKEN above when an org has none.
          PIN_CI_TOKEN_KRATEO_PLATFORMOPS: ${{ steps.app-token.outputs.token }}
          PIN_CI_TOKEN_KRATEO_AGENTIKO: ${{ steps.app-token-agentiko.outputs.token }}
          PIN_CI_TOKEN_KRATEO_BLUEPRINTS: ${{ steps.app-token-blueprints.outputs.token }}
          PIN_CI_TOKEN_KIND: ${{ steps.app-token.outputs.token && 'krateo-pin-ci GitHub App (checks:read)' || 'repo-scoped GITHUB_TOKEN -- DEGRADED, cross-org pins UNVERIFIABLE' }}
        run: |
          echo "pin-ci token: ${PIN_CI_TOKEN_KIND}"
          python3 .github/scripts/check-pin-ci.py
