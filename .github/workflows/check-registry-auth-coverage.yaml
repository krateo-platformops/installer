name: check-registry-auth-coverage

# A non-empty `registryAuth.registries[]` must cover every repo that needs a credential.
#
# THE FOOT-GUN, from inst.chartExtras (chart/templates/_helpers.tpl):
#   {{- if $registries -}} ... match repo verbatim ... {{- else if $ra.enabled -}} ... global ...
# It is `if` / ELSE IF, so the moment registries[] is non-empty the GLOBAL credential becomes
# UNREACHABLE for every component whose repo does not match an entry. There is no fallback, and
# adding one scoped entry reads as a purely additive values change.
#
# MEASURED on krateo-057 2026-11-22: enabled=true with a global credential and registries EMPTY,
# while the pins span six repos including 17 krateo-agentiko components (private by design). One
# entry added there to scope krateo-saas -- which is what demo needs -- would cut the credential
# for all 17, with the symptom being charts failing to pull and no values line that looks wrong.

on:
  pull_request:
      # NO `branches:` filter: a branches: [main] here means the gate does not run on a STACKED
      # pull request, which then shows "all checks passed" with every gate skipped.
    # NO `paths:` filter: a path-filtered workflow never STARTS on a PR that misses its paths, so
    # a required context would wait forever on "Expected".
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  registry-auth-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install PyYAML
        run: pip install --quiet pyyaml
      # FIRST: registries[] is EMPTY on main today, so the gate's non-empty branch is not
      # exercised by the real values at all -- the self-test is its only cover, and it asserts
      # the 057 foot-gun specifically (one entry covering saas leaves agentiko uncovered).
      - name: This gate detects an uncovered authenticated repo
        run: python3 .github/scripts/check-registry-auth-coverage.py --self-test
      - name: Every authenticated repo in use has a registries[] entry
        run: python3 .github/scripts/check-registry-auth-coverage.py
