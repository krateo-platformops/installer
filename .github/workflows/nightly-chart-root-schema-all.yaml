# Run the chart root-schema gate against EVERY PINNED CHART, nightly.
#
# WHY THIS IS SEPARATE FROM check-chart-root-schema-gate.yaml, which runs on every pull_request.
# That workflow runs the OFFLINE FIXTURE SUITE: it guards the gate's RULES and needs no network, so
# it stays fast and cannot flake. This one runs `--all`, which pulls all 68 pinned charts from GHCR
# and is the only check that guards the PINS themselves.
#
# WHY NOT ON pull_request. Two reasons, and the first is not just speed:
#   - it would make every unrelated PR depend on GHCR being reachable. A gate that flakes is a gate
#     people learn to re-run until it passes, which is worse than not having it.
#   - it needs packages:read, which the PR workflows' token does not carry. check-pin-ci's own
#     comment records this: PIN_CI_READ_TOKEN is contents:read + checks:read, "not the packages:read
#     a `helm pull` needs".
#
# WHAT IT CATCHES THAT NOTHING ELSE DOES. A pin whose chart's ROOT schema the installer's
# componentValues cannot satisfy renders a CR the generated CRD rejects, so the composition can
# never deploy. Three such charts sat latent until 2026-10-31 -- agentgateway, cert-manager-issuers
# and external-dns -- and they were only found because someone ran `--all` by hand. All three were
# behind features that default false, which is exactly why nobody noticed: the latent cases are the
# ones nobody has installed yet.
#
# REQUIRES the secret PAT, with packages:read. It used to name CHART_READ_TOKEN, which HAS NEVER
# EXISTED -- see the Log in to GHCR step for the measurement and for the 20 consecutive nightly
# failures that caused. Still fails rather than skips when the secret is absent.
name: nightly-chart-root-schema-all

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  all-pins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 — was v4 (Node 20, deprecated)
      - name: Install helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0 — was v4 (Node 20, deprecated)
      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml
      - name: Log in to GHCR
        # USES `PAT`, NOT `CHART_READ_TOKEN`, AND THAT IS WHY THIS WORKFLOW FAILED EVERY NIGHT
        # FROM AT LEAST 2026-11-01 TO 2026-11-21 -- 20 consecutive scheduled runs, each failing
        # loudly at this step with nobody reading the result.
        #
        # CHART_READ_TOKEN HAS NEVER EXISTED. check-pin-ci.yaml records the measurement:
        # orgs/krateo-platformops/actions/secrets/CHART_READ_TOKEN -> 404, five org secrets
        # present and all visibility=all, repo-level secrets 0. Diego chose `PAT` over creating a
        # new secret, and check-pin-ci was changed to use it. This workflow was the sibling that
        # never got the same change, so it kept referencing a name that resolves to nothing.
        #
        # WHAT WENT UNCHECKED FOR THOSE 20 NIGHTS, from this file's own header: the `--all` run is
        # the ONLY check that guards the PINS rather than the gate's rules. A pin whose chart's
        # ROOT schema the installer's componentValues cannot satisfy renders a CR the generated
        # CRD rejects, so the composition can never deploy. Three such charts sat latent until
        # 2026-10-31 -- agentgateway, cert-manager-issuers and external-dns -- found only because
        # someone ran --all by hand. All three were behind features defaulting false, which is
        # exactly why nobody noticed. The gate went dark two days after it last found real bugs.
        #
        # WHETHER `PAT` CARRIES read:packages FOR krateo-agentiko IS STILL UNKNOWN, as
        # check-pin-ci's own note says. If it does not, this step now fails with a 401 from the
        # registry instead of on a missing secret -- which is a different and far more useful
        # failure: it names a permission to fix rather than a name that resolves to nothing.
        #
        # FAILS, NEVER SKIPS. Unchanged, and the reason is unchanged: a gate that quietly stops
        # verifying reports green without having checked anything.
        run: |
          if [ -z "${{ secrets.PAT }}" ]; then
            echo "::error::PAT is not set or not visible to this repository. This gate pulls every"
            echo "::error::pinned chart and needs packages:read. Failing rather than skipping: a gate"
            echo "::error::that silently skips reports green without having checked anything."
            exit 1
          fi
          echo "${{ secrets.PAT }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
        run: python3 hack/chart-root-schema-gate.py --pins chart/files/component-pins.yaml --all
