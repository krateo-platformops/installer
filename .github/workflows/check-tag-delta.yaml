name: check-tag-delta

# A release tag must DECLARE, machine-readably, the pin delta it carries against the PREVIOUS TAG.
#
# WHY. Tag 0.3.638's message said "THIS TAG CARRIES THE TWO PAIRS AND NOTHING ELSE". It carried 31
# field-level pin changes across 29 components. The pull request's difference set against
# origin/main really was exactly two components and really was asserted field-for-field -- that is
# the right question for a PR and says nothing about a tag, because a tag is cut from main and
# carries everything main accumulated since the previous tag.
#
# Every other pin gate here compares against the MERGE TARGET, so the gap was structural rather
# than an oversight in any one of them. The damage was informational, which is what makes it worth a
# gate: five sessions and the user reasoned about attribution on a false claim.
#
# The claim is GENERATED by hack/tag-delta.py, never typed, so it cannot be wrong unless the
# generator is -- and the generator has its own falsifiers, including that comparing only `version`
# (its first bug, caught against real history) misses the gatewayPath move that was 0.3.639's
# entire content.
#
# This runs AFTER the tag is pushed, so it detects rather than prevents. Prevention is running
# `python3 hack/tag-delta.py <tag>` before writing the message, which is now the documented step.

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
      # NO `branches:` filter: a branches: [main] here means the gate does not run on a STACKED
      # pull request, which then shows "all checks passed" with every gate skipped.
    # NO `paths:` filter: a path-filtered workflow never STARTS on a PR that misses its paths, so
    # a required context would wait forever on "Expected".
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to check. Default: the ref that triggered this run."
        required: false

permissions:
  contents: read

jobs:
  tag-delta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # 0 and tags: previous_tag() needs the full tag list, and the message lives on the
          # annotated tag OBJECT, which a shallow fetch does not bring.
          fetch-depth: 0
          fetch-tags: true
      - name: Install PyYAML
        run: pip install --quiet pyyaml
      - name: The generator's own rules hold
        run: python3 hack/tag-delta.py --self-test
      - name: This gate detects an undeclared or misdeclared delta
        run: python3 .github/scripts/check-tag-delta.py --self-test
      - name: The tag declares exactly what it carries
        if: github.ref_type == 'tag' || github.event.inputs.tag != ''
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME}"; fi
          echo "checking tag ${TAG}"
          python3 .github/scripts/check-tag-delta.py "${TAG}"
