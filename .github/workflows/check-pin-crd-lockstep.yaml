name: check-pin-crd-lockstep

# Installer-specific guard: a component pin must not be AHEAD of its paired -crd pin in a way
# that loses data.
#
# WHY. installer#632 bumped `alert-provider` 0.2.57 -> 0.2.59 and left `alert-provider-crd` at
# 0.2.57. The two fields 0.2.59 adds (spec.ratio, spec.thresholdMax) are declared ONLY in the CRD
# chart, and the 0.2.57 CRD sets neither `additionalProperties: false` nor
# `x-kubernetes-preserve-unknown-fields` -- so the apiserver PRUNES them. An Alert carrying either
# is accepted, returns no error, emits no event, and comes back without the field; thresholdMax is
# required for thresholdType between/not_between, so a range alert is silently malformed rather
# than refused. All 25 checks passed on that PR because nothing compared a component against its
# own CRD chart, and tag 0.3.495 was cut from it 38 seconds after merge and published.
#
# CALIBRATION, measured when this was written -- it is sensitive AND specific:
#   main's pins (lockstep correct)                     -> pass, 9 compared, 1 named skip
#   0.3.495's exact pins (the real bug)                -> FAIL, naming [ratio, thresholdMax]
#   mutant: snowplow-crd held one release back         -> pass, because 1.12.55 -> 1.12.56 adds
#                                                         no spec property. A "versions must be
#                                                         equal" gate would have failed this, and
#                                                         the pin file documents pure-lockstep
#                                                         holds as legitimate.
#
# kagent / kagent-crds are on INDEPENDENT version lines (kagent-crds has no 0.1.18; it is a 404),
# so the app version is not a CRD version. The script reports that as a NAMED skip rather than
# silently passing it, and no allowlist is needed -- the 404 is the evidence.
#
# NO `branches:` filter, deliberately -- see installer#633. A `branches: [main]` here means the
# gate does not run on a stacked pull request, which then reports CLEAN with "all checks passed"
# while every gate was skipped.

on:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pin-crd-lockstep:
    name: pin-crd-lockstep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Helm setup
        uses: azure/setup-helm@v5.0.0
        with:
          version: v3.19.0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: python3 -m pip install --quiet 'pyyaml==6.0.2'

      # Anonymous read is enough: every pin's chart repo answered a `helm show chart` without
      # credentials when this was written, across krateo-platformops, krateo-agentiko and
      # krateo-blueprints. If one ever stops being readable the script FAILS rather than skipping,
      # because a gate that cannot complete its check reads exactly like one that found nothing.
      - name: Check app pins against their -crd pins
        run: python3 .github/scripts/check-pin-crd-lockstep.py
