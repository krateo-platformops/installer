name: check-feature-keys

# Installer-specific guard (not the canonical shared lint.yaml): every distinct `feature:` a component
# pin in chart/files/component-pins.yaml gates on must be declared under features.properties in
# chart/values.schema.json. That schema is crdgen-compiled into the Installer CRD's spec.features, so a
# pin gating on an undeclared feature names a flag that isn't a real CR field — the component can never
# be enabled and silently stays off on every install, with no lint/render/publish error (installer#145).

on:
  pull_request:
    branches: [main]
    # NO `paths:` filter, deliberately. This job is a REQUIRED status check on main (org ruleset
    # installer-required-checks requires lint, pin-kinds, fill-defaults, feature-keys, no-unknowns).
    # A path-filtered workflow never STARTS on a PR that misses its paths, so the required context
    # is never reported and the PR sits on "Expected - waiting for status to be reported" forever,
    # unmergeable. A pins-only release PR hits exactly that. The guard is a cheap python script, so
    # it runs on every PR rather than being filtered. Do not reintroduce `paths:` here while this
    # context stays required.
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  feature-keys:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PyYAML
        run: pip install --quiet pyyaml
      - name: Assert pin features are declared in values.schema.json
        run: python3 .github/scripts/check-feature-keys.py
