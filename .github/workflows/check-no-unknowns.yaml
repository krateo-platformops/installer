name: check-no-unknowns

# Installer-specific guard (not the canonical shared lint.yaml): chart/values.schema.json feeds
# core-provider's crdgen verbatim, becoming the Installer CRD's structural schema. componentValues is a
# hand-curated, fully-typed override surface — this guard fails any PR that reintroduces an open
# `additionalProperties: true` or an `x-kubernetes-preserve-unknown-fields` escape (either would silently
# reopen the surface to arbitrary untyped values on the live CRD).

on:
  pull_request:
      # NO `branches:` filter, deliberately. A `branches: [main]` here means the gate does
      # not run on a STACKED pull request -- one whose base is another PR's branch rather than
      # main. Such a PR then reports only `lint` (the one workflow that never had the filter)
      # and shows mergeable/CLEAN with "all checks passed", which reads as verified while every
      # gate in this directory was skipped. Measured 2026-11-03 on the #623->#624->#625 stack:
      # #623 (base main) ran 25 checks, #624 and #625 ran 2. A gate that silently does not run
      # is worse than no gate, because the green tick is read as its verdict.
    # NO `paths:` filter, deliberately. This job is a REQUIRED status check on main (org ruleset
    # installer-required-checks requires lint, pin-kinds, fill-defaults, feature-keys, no-unknowns).
    # A path-filtered workflow never STARTS on a PR that misses its paths, so the required context
    # is never reported and the PR sits on "Expected - waiting for status to be reported" forever,
    # unmergeable. A pins-only release PR hits exactly that. The guard is a cheap python script, so
    # it runs on every PR rather than being filtered. Do not reintroduce `paths:` here while this
    # context stays required.
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  no-unknowns:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assert values.schema.json stays fully typed
        run: python3 .github/scripts/check-no-unknowns.py
