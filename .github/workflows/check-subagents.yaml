name: check-subagents
on:
  pull_request:
    paths:
      - chart/templates/_helpers.tpl
      - chart/templates/compositions.yaml
      - chart/files/component-pins.yaml
      - .github/scripts/check-subagents.py
      - .github/workflows/check-subagents.yaml
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  subagents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 — was v4 (Node 20, deprecated)
      - name: Set up helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v3.19.0
      - name: Install PyYAML
        run: pip install --quiet pyyaml
      - name: Exercise the subAgents derivation
        run: python3 .github/scripts/check-subagents.py
