name: check-pins

# Installer-specific guard (not the canonical shared lint.yaml): the hand-maintained `kind:` in
# chart/files/component-pins.yaml must match the Kind core-provider's crdgen derives from the chart
# name (flect.Pascalize ∘ ToGolangName — initialism-aware: api->API, dns->DNS). Pass B matches
# spec.names.kind by exact string, so a mispin silently blocks Pass B on a live cluster (installer#31).
#
# Second guard: every field a pin uses must be declared in values.schema.json's components[] schema.
# crdgen compiles that schema into the Installer CRD and self-bootstrap applies the rendered pin list
# against it, so an undeclared field fails strict decoding and CrashLoopBackOffs installer-self-instance.

on:
  pull_request:
      # NO `branches:` filter, deliberately. A `branches: [main]` here means the gate does
      # not run on a STACKED pull request -- one whose base is another PR's branch rather than
      # main. Such a PR then reports only `lint` (the one workflow that never had the filter)
      # and shows mergeable/CLEAN with "all checks passed", which reads as verified while every
      # gate in this directory was skipped. Measured 2026-11-03 on the #623->#624->#625 stack:
      # #623 (base main) ran 25 checks, #624 and #625 ran 2. A gate that silently does not run
      # is worse than no gate, because the green tick is read as its verdict.
    # NO `paths:` filter, deliberately. This job is a REQUIRED status check on main (org ruleset
    # installer-required-checks requires lint, pin-kinds, fill-defaults, feature-keys, no-unknowns).
    # A path-filtered workflow never STARTS on a PR that misses its paths, so the required context
    # is never reported and the PR sits on "Expected - waiting for status to be reported" forever,
    # unmergeable. A pins-only release PR hits exactly that. The guard is a cheap python script, so
    # it runs on every PR rather than being filtered. Do not reintroduce `paths:` here while this
    # context stays required.
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pin-kinds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 — was v4 (Node 20, deprecated)
      - name: Install PyYAML
        run: pip install --quiet pyyaml
      - name: Assert pin kinds == crdgen derivation
        run: python3 .github/scripts/check-pin-kinds.py
      - name: Assert pin fields are declared in values.schema.json
        run: python3 .github/scripts/check-pin-fields.py
