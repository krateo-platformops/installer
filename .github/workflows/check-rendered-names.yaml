name: check-rendered-names

# Every metadata.name a CHANGED pinned chart renders must be a valid Kubernetes name.
#
# WHY, with a date and a cost. Tag 0.3.642 moved the 17-member portal-pages line to 1.8.119 on
# 2026-11-14. Sixteen converged. alerts-page could not, and never would: it renders a widget named
# `alerts-hasIncidents` — a capital I — and the apiserver REFUSES an object whose metadata.name is
# not an RFC 1123 subdomain. The composition sat at Ready=Unknown/ObserveFailed with
# status.helmChartVersion stuck on the PREVIOUS chart while the cdc retried observe -> helm -> fail
# about every three seconds, indefinitely.
#
# NOTHING WE OWNED WOULD HAVE CAUGHT IT, and that is the point of this gate:
#   check-pin-ci               confirmed the source repo was green
#   check-same-version-line    confirmed the 17 pins AGREE — and it reads the REPO, so it could not
#                              see the live cluster then holding 16 at the new version and one stuck
#   the registry probe         confirmed the chart EXISTS
#   the values-path diff       confirmed no new key and no rename
# All four passed. None renders the chart and looks at what it would create.
#
# This needs no cluster: `helm template` plus a regex. On the real case it finds exactly one bad
# name among 46 rendered documents, and its predecessor 1.8.118 renders 36 that are all valid —
# both directions are asserted as fixtures, so the gate is shown to discriminate.
#
# frontend added the mirror of this at the PRODUCER end (scripts/lint-k8s-names.py in portal #437),
# which is the right shape: a name is checked where it is written and again where it is pinned.

on:
  pull_request:
      # NO `branches:` filter: a branches: [main] here means the gate does not run on a STACKED
      # pull request, which then shows "all checks passed" with every gate skipped.
    # NO `paths:` filter: a path-filtered workflow never STARTS on a PR that misses its paths, so
    # a required context would wait forever on "Expected".
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  rendered-names:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Fetch the merge target, so "which pins changed" can be computed
        # The gate renders only the charts whose pin version MOVED. Without main it cannot tell,
        # and it exits 2 (refusal) rather than rendering nothing and reporting clean.
        run: git fetch --depth=1 origin main
      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v3.19.0
      - name: Install PyYAML
        run: pip install --quiet pyyaml

      # A LATENT GAP, EXPOSED BY THE FIRST PRIVATE-REGISTRY PIN RATHER THAN INTRODUCED BY IT. This gate
      # PULLS each changed chart to render it, and the pins span several registries of which three
      # are private to an unauthenticated runner -- see check-chart-requires-floors' derived
      # breakdown for the current figure; I wrote "seven" here an hour after the real count became
      # six, by copying the stale line from that workflow. Until a changed pin lived in one, every run
      # happened to touch only public charts and the missing login never showed.
      #
      # It surfaced on incident-agent 0.3.7 -> 0.3.8, whose pin repo is
      # oci://ghcr.io/krateo-agentiko/charts: `helm pull` answered
      # "failed to perform FetchReference" and the gate reported
      # "1 changed pin(s) but ZERO metadata.name values were rendered". That message is the gate working
      # -- it fails closed on a vacuous zero, because a zero here reads exactly like a clean result.
      #
      # FAILS, NEVER SKIPS, when the secret is absent, for the same reason as the floors gate: a check
      # that quietly stops verifying reports green without having checked anything.
      - name: Registry login
        run: |
          if [ -z "${{ secrets.PAT }}" ]; then
            echo "::error::PAT is not set or not visible to this repository. This gate PULLS each changed"
            echo "::error::chart to render it, and private packages answer 401 to an unauthenticated"
            echo "::error::runner -- which this gate reports as ZERO rendered names. Failing, not skipping."
            exit 1
          fi
          echo "${{ secrets.PAT }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      # POSITIVE CONTROL, three probes because the three private orgs are three separate grants and one
      # passing does not imply the others. A login that SUCCEEDS proves a handshake, not read access: a
      # PAT lacking read:packages on an org would log in cleanly and then make every chart there fail to
      # render, which this gate would report as zero names and which reads as a chart defect.
      - name: Prove the credential can read each private org
        run: |
          set -euo pipefail
          fail=0
          probe() {
            if helm show chart "$1" --version "$2" >/dev/null 2>&1; then
              echo "  ok   $1 $2"
            else
              echo "::error::CANNOT READ $1 $2 -- it is PINNED on main, so it must be readable."
              echo "::error::PAT lacks read:packages on that org. A changed pin there would render ZERO"
              echo "::error::names and look like a chart defect rather than a credential one."
              fail=1
            fi
          }
          probe oci://ghcr.io/krateo-agentiko/charts/repo-mcp-server 0.1.6
          probe oci://ghcr.io/krateo-blueprints/charts/internal-ca-bundle 0.16.0
          probe oci://ghcr.io/krateo-platformops/krateo-saas/krateo-capability-roles 0.6.2
          [ "$fail" = "0" ] || exit 1
          echo "positive control OK: a currently-pinned chart in EACH private org is readable"

      - name: The name rules hold, and the gate discriminates on the real case
        run: python3 .github/scripts/check-rendered-names.py --self-test
      - name: Every name a changed chart renders is a valid Kubernetes name
        run: python3 .github/scripts/check-rendered-names.py
