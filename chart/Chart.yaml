apiVersion: v2
# DECLARED FLOOR, enforced at RENDER so a cluster below it fails before anything installs.
# Measured on published 0.3.504 BEFORE this line existed: helm template rendered IDENTICALLY
# (rc=0, 2826 lines) at --kube-version 1.33.0, 1.35.0, 1.36.0 and 1.37.1. So the requirement
# was documented at docs/usage.md:38 and in the README and enforced NOWHERE in the path a
# customer takes -- core-provider and core-provider-crds both declare >=1.36.0-0 as
# dependencies, and helm does NOT propagate a dependency kubeVersion to the parent render.
# A customer on 1.33-1.35 installed cleanly and met the floor as a downstream failure.
# WHAT IS ACTUALLY BINDING, and the precision matters because the obvious note overstates it:
# the binding requirement is MutatingAdmissionPolicy, GA and on by default from 1.36 --
# oasgen-provider stamps krateo.io/oas-version onto instances with it so a controller can
# select the generation it owns. Below 1.36 nothing writes that label, the selector matches
# nothing, and resources are SILENTLY UNMANAGED -- which looks like a stopped controller
# rather than a version problem. CRD schema ratcheting is the other feature usually cited
# with it and it is NOT binding: available since 1.33, so it constrains nobody here.
# AND THERE IS NO REDUCED-FUNCTION PATH. oasgen-provider has a repair, backfillVersionLabel,
# which stamps the CURRENT SERVED version because the storage version erases the apiVersion an
# object was written as -- so under version coexistence it binds an instance to the WRONG
# generation. The fallback is not less function, it is wrong and late, which is why refusing
# is correct rather than conservative.
# COST, stated: three currently-supported Kubernetes versions (1.33-1.35) are excluded, and
# the failure is a refusal rather than a warning. Deliberate -- an install that comes up green
# and reconciles nothing points at the controller instead of the cluster.
kubeVersion: '>=1.36.0-0'
appVersion: CHART_VERSION
# 2.13.74 (2026-11-07). Diego's go in session, as 0.3.526 ALONE -- he chose to keep it out of the
# 0.3.525 pin group so its expected restart burst and a controller retirement cannot be confused
# with an unrelated change. BOTH charts in LOCKSTEP.
#
# TWO BEHAVIOUR CHANGES, both of which look like faults if you do not expect them:
#
# 1. LEADER ELECTION IS ON BY DEFAULT (#383). The chart now renders
#    CORE_PROVIDER_LEADER_ELECTION: "true" plus a Lease rule in core-provider's ClusterRole.
#    THIS FIRST ROLL STILL BURSTS ONCE, because the OUTGOING 2.13.72 pod does not elect -- so
#    expect 1-5 ReplicaSets per cdc, exactly as on the 2.13.72 roll. Verify: a Lease
#    `leader-election-core-provider` in core-provider's namespace with holderIdentity naming
#    the NEW pod. THE ROLL AFTER THIS ONE should show 1 ReplicaSet per cdc whose template
#    changed -- its author measured 5/5 runs with election against 3 of 5 fights without.
#
# 2. THE LEAKED installers-v0-3-480-controller IS RETIRED (#385) -- but NOT by the roll itself.
#    Only on the next Update of the `installer` CompositionDefinition, and the installer chart
#    bump in this release IS such an update. Verify GONE: the Deployment, ServiceAccount
#    `installers-v0-3-480` and ConfigMap `installers-v0-3-480-configmap`; core-provider logging
#    `retired leaked per-version controllers nothing claims (#327)` naming it; and the CURRENT
#    installers controller untouched. The old line `safe to remove by hand (#270)` NO LONGER
#    EXISTS in 2.13.74 -- if it still appears after that update, look instead for
#    `could not retire a leaked per-version controller; will retry on the next update (#327)`
#    and send core-provider its error.
#
#    That controller is the one I found on the 2.13.72 roll by counting cdc IMAGES and seeing
#    2.13.45 where I expected one number. It churned ~1 revision/minute for 19h and stopped at
#    2026-10-31T08:03:06Z. I first attributed the silence to its CRD version being pruned --
#    WRONG: 2.13.46, carrying the #270 fix, was tagged at 07:23Z, so the fix rolling silenced
#    it. Two timestamps and a plausible story is not a mechanism.
#
# THE CDC CODE IS IDENTICAL TO 2.13.73 (new digest from the rebuild), and 2.13.73 differs from
# 2.13.72 only in the CPU saturation opt-in, which 057 does not set -- verified on all three
# surfaces when 2.13.72 was pinned: values file, every ConfigMap, every cdc Deployment env.
#
# THE FREEZE CHECK ON 2.13.73 IS NOW DONE, BOTH ARMS, by its author: opt-in OFF, 0/64 stuck;
# opt-in ON, no freeze -- 14 were late at 420s and all 64 converged by ~15 min on the same pod.
# So if 057 ever enables the opt-in, EXPECT A LONG TAIL, NOT A FREEZE.
#
# Digests from its author: core-provider sha256:b1a8afd6..., cdc sha256:7ef287c6...,
# chart-inspector sha256:7148693a... (2.13.73's were 0c11792a / 8a598a04 / fc6f3588).
# My controls: 2.13.74 and -crds both resolve; 2.13.72 (outgoing) resolves; 9.9.9 not found.
#
# --- the 2.13.72 note it replaces, kept because its reasoning still applies ---
# 2.13.72 (2026-11-07). Diego's direct go in session, confirmed AGAINST a newer tag.
# BOTH charts in LOCKSTEP. 2.13.68 -> 2.13.72 is four releases.
# *** 2.13.73 EXISTS AND IS DELIBERATELY NOT TAKEN. *** It is published and pullable, and the
# ENTIRE diff 2.13.72 -> 2.13.73 is one commit, 13092b34:
#     fix(cdc): take unstructured-runtime v1.12.0, so saturation keeps the queue's order (#380)
#     go/composition-dynamic-controller/go.mod +1 -1, internal/saturation/governor.go +2 -2,
#     governor_test.go +14 -5
# So 2.13.73 looks like the safer choice and is NOT, for a reason worth keeping: 2.13.72 is the
# build with a PASSED REPRODUCTION of the freeze defect -- 0 of 64 stale, drained in 387s, 19
# status conflicts all recovered, 0 restarts. 2.13.73's artifacts are pipeline-verified only and
# NO reproduction has been run on it. A measured pass beats a newer tag with no measurement.
# And #380 acts on the SATURATION path, which is off by default on krateo-057, so it buys 057
# nothing today. 2.13.73 follows as its own step once core-provider has exercised it.
# *** THE CONDITION, VERIFIED ON 057 RATHER THAN ASSUMED. *** Its author stated the rule
# precisely: 2.13.72 is correct and complete for a cluster that does NOT set
# COMPOSITION_CONTROLLER_SATURATION_ENABLED=true, because #72 cannot occur with the opt-in off
# -- the CPU gate is not built at all. Checked on all three surfaces where it could be set:
#     057's values file        0 occurrences
#     every ConfigMap          0 keys mentioning SATURATION
#     every cdc Deployment env 0 variables
# So the condition holds on 057 as a measurement, not as a default.
# THEY ARE TWO DEFECTS, NOT ONE, and conflating them is what made 2.13.73 look necessary:
#   #70 THE FREEZE   queue kept an expired ReadyAt, so items sorted behind fresh work forever
#                    under sustained load. NO governor involved. Fixed in the queue itself
#                    (promoteDueItems), runtime v1.11.2, IN 2.13.72, and measured fixed on a
#                    real cdc with the opt-in OFF.
#   #72              a worker popped an item, the CPU gate deferred it ~30s, the slot went to a
#                    resync. SLOW, not frozen, and ONLY with the opt-in ON. v1.12.0, in 2.13.73.
# NOT measured by its author: the freeze with the opt-in ON, on any version. By code the
# governor's re-queued items go through the same fixed queue -- their words: a reading, not a
# measurement. So IF 057 EVER ENABLES SATURATION, this pin must be revisited against 2.13.73.
# WHAT THE JUMP CARRIES, per its author: runtime v1.9.0 -> v1.11.2, plumbing v1.26.2-era ->
# v1.28.1 (crdgen keeps the unknown-fields marker alongside `properties`, so a generation run MAY
# show changed CRDs for charts with that shape -- none found in 2748 local schemas, but that scan
# was local only), ApiRefRBACComplete on apiRef definitions, and the CPU opt-in, off.
# NOT EXERCISED AS A JUMP: 2.13.68 -> 2.13.72 together. Only clean installs and in-place upgrades
# on GKE have been run. The verdict plus the stall detector is the check.
# *** READ THE ROLL ON END STATE ONLY (core-provider#382). *** Leader election is off by default
# and the Deployment rolls with a surge, so for ~10-20s the OLD and NEW core-provider pods BOTH
# reconcile. Expect each composition controller to restart 5-9 times in a few seconds, plus
# `cannot update managed resource status: Operation cannot be fulfilled ... the object has been
# modified` in the log. NEITHER IS A FAILURE. Verify: each cdc Deployment on its new image, one
# pod Ready, CompositionDefinitions Ready=True. Measured by its author across 820 helm operations
# with 0 "another operation in progress" errors, and the new pod's write last in both windows.
dependencies:
# 2.13.46 IS A FLOOR, not merely the current version. Do not pin below it.
#
# PINNED 2.13.51 (2026-11-01), above that floor, for FRESH-INSTALL reasons specifically -- not
# newest-is-better. core-provider's argument, which is why this moved off .46:
#   2.13.50  unstructured-runtime v1.7.2: tools.UpdateStatus had NO conflict retry at all, so a
#            stale resourceVersion was a RETURNED ERROR the caller recorded on the object -- one
#            lost race became a PERMANENT ReconcileError. A fresh install, with every object
#            created at once and every status written for the first time, is the highest-
#            contention moment there is. Not firing on 057 (Synced=True 84/85) because the
#            handler's own retry wins the race there.
#   2.13.51  #287: a chart named y/no/on/off -- all valid Helm names -- crashed the controller.
#            A day-2 build is when unfamiliar charts get installed for the first time.
# The .46 floor notes below still stand; .53 is above them.
#
# MOVED .51 -> .53 (2026-11-01) to unblock krateo-demo: PR 294 fixes the CDC's "installing rbac"
# step full-PUTting the tenant Namespace, which Kyverno's protect-generation-labels webhook (Fail,
# */*) DENIES -- so demo could not create a Krateo child for any tenant onboarded since Kyverno
# 1.19.2 on 30 Oct. acme and globex are unaffected (Helm-created namespaces). 2.13.53 also carries
# #293 (the managedDigest status-schema prune), measured on a0-openstack-d2 as a fleet-wide ~1/min
# drift-report loop that did NOT produce a revision storm.
#
# 2.13.45 shipped #263's controller-drain wait, which LISTs the retiring controller's pods, WITHOUT
# the RBAC rule to do it. The informer swallows the resulting 403 and reports a SYNC TIMEOUT, so the
# error names the informer and never the permission:
#   Synced=False (ReconcileError) waiting for retiring controller to drain: listing pods of
#   retiring controller ...: Timeout: failed waiting for *v1.Pod Informer to sync
# ...with the cluster already correct. The reconcile then errors, retries and errors again, forever.
#
# IT IS NOT ONLY VERSION BUMPS. Both core-provider and this session said so, repeatedly, and both
# were wrong -- the boundary read as the operator-friendly summary, which is exactly what made it
# harmful: a narrow claim that SOUNDS exculpatory does not get interrogated. Four paths reach
# waitForControllerDrained:
#   Update              compositiondefinitions.go:1560   a version migration
#   Delete              compositiondefinitions.go:1973   removing a CompositionDefinition
#   Delete              compositiondefinitions.go:2015   removing a CompositionDefinition
#   handOverController  controllerowner.go:384           handing a shared controller to a successor
#   CONTROL: zero Undeploy calls inside Create -- so a FRESH INSTALL genuinely is unaffected.
# So: a fresh install is fine; EVERY path that retires a controller wedges. Component removal wedges.
# handOverController is the one nobody predicts -- a shared controller passing between two
# definitions retires a controller while NEITHER is deleted or bumped.
#
# Proven live, not inferred: on a0-openstack a CompositionDefinition delete hung from 08:42:57Z with
# that exact message, and completed with NO intervention the moment 2.13.46 reached the cluster.
#
# Verified in the PUBLISHED chart rather than the template that feeds it, with a negative control:
#   helm template of the published chart, --kube-version 1.36.0
#     2.13.45   pods-rules=0  deployments-rules=1
#     2.13.46   pods-rules=1  deployments-rules=1
#
# AND THE MANAGED-SET BASELINE CANNOT SEE THIS. A wedge leaves every status.managed set perfect --
# the failure is in the retirement path, after the work succeeded -- so hack/managed-drift.py returns
# a true result about the wrong quantity. Assert Synced=True per composition as well; on its first
# run that arm found three non-Synced compositions on krateo-057 that the managed-set arm reported
# nothing about.
- condition: bootstrap.coreProvider.enabled
  name: core-provider
  repository: oci://ghcr.io/krateo-platformops/charts
  version: 2.13.74
- condition: bootstrap.coreProvider.enabled
  name: core-provider-crds
  repository: oci://ghcr.io/krateo-platformops/charts
  version: 2.13.74
