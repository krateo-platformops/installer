# retired-components.yaml — the RETIRED-NAMES allowlist for inst.componentsYaml.
#
# WHY THIS EXISTS (installer#144 Landmine 1):
# A live Installer CR ships its FULL component list wholesale (self-bootstrap.yaml
# replaces spec.components on every upgrade). When a component pin is DELETED from
# files/component-pins.yaml as part of retiring a feature, the live CR's own
# spec.components (= .Values.components at render time) still carries that name for
# at least one more reconcile. The inst.componentsYaml helper's typo-guard would then
# `fail` with "unknown name not in files/component-pins.yaml", aborting the ENTIRE
# umbrella render — in BOTH composition mode (ordered-teardown.yaml) and bootstrap
# mode (self-bootstrap.yaml) — on every existing install.
#
# A name listed here is a KNOWN-RETIRED component: when it appears in
# .Values.components but is NOT pinned, the helper SKIPS it (does not append it as a
# new CompositionDefinition, does not fail). The typo-guard stays intact for every
# name that is neither pinned nor listed here.
#
# To retire another component in a future release: DELETE its pin from
# component-pins.yaml (and its krateo-autopilot deps: line) AND append its name here,
# in the SAME commit. Removing a name from this list once no live CR can still carry
# it is safe cleanup.
retired:
- code-analysis-agent
- ansible-to-operator-agent
- tf-provider-to-operator-agent
- tf-to-helm-agent
# Retired 2026-09-25 (installer 0.3.279 drained it, 0.3.281 deletes the pin): core-provider-agent is
# the sole blueprint author. Its Composition and CompositionDefinition were gone on 057 before this landed.
- krateo-blueprint-agent
# Replaced by alert-provider and alert-provider-crd (same repo, renamed charts). The Alert CRD moves
# between their helm releases; docs/configuration.md#upgrading-from-alert-troubleshooter has the steps.
- alert-troubleshooter
- alert-troubleshooter-crd
# Retired by the incident-controller -> incident-provider cutover (installer #619 removed the
# component, the 3-PR cutover swapped incident-controller-crd -> incident-provider-crd 0.6.1).
# THE PINS WERE DELETED AND THESE NAMES WERE NEVER APPENDED HERE, which is exactly what the
# instructions above forbid -- and the landmine detonated: krateo-demo's installer composition
# recorded `ChartRenderable=False` at 2026-11-04T07:00:49Z with
#   components[incident-controller-crd]: unknown name not in files/component-pins.yaml
# from ordered-teardown.yaml:58, which aborts the ENTIRE umbrella render. demo's CR has since
# been patched clear of the name so it renders again, but any cluster still carrying either name
# in spec.components would be wedged the same way on its next reconcile. 057 never carried them
# (68 components, checked 2026-11-05) so it was never exposed.
- incident-controller
- incident-controller-crd
# Retired 2026-11-12 by installer 0.3.606 (#849), which deleted the pin. ITS NAME WAS NOT APPENDED
# HERE IN THAT COMMIT, repeating the incident-controller mistake above, and the exposure was
# measured the same day: krateo-057 was already clear (its self-bootstrap had rewritten
# spec.components, 86 entries, name absent) but krateo-demo's CR carried `krateo-autopilot` in
# spec.components with no registerOnly, i.e. the `fail` branch, AND carried
# componentValues.krateo-autopilot (agents, knowledge). Reproduced against 0.3.606 with demo's own
# block: the components entry gives
#   components[krateo-autopilot]: unknown name not in files/component-pins.yaml
# from withheld-components.yaml:31, and the values key gives
#   at '/componentValues': additional properties 'krateo-autopilot' not allowed
# -- the schema error masks the render error, so fixing one reveals the other. demo is frozen on
# 0.3.592 (which still pins it) and was never wedged; both would have fired on its catch-up roll.
# `.github/scripts/check-retired-components.py` now enforces this file mechanically.
- krateo-autopilot
