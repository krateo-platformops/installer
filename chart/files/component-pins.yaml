  # 1.6.5: LOCKSTEP with the frontend image 1.6.5 (Diego's rule: always bump the -crds pin with its main
  # chart). NOT image-only: 14 widget CRDs changed 1.6.2->1.6.4 (identical at 1.6.5). Verified backward-
