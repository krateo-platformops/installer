- name: authn
  kind: Authn
  chart: authn
  # 0.27.3 (#29): AUTHN_KUBECONFIG_SERVER_URL default kube-apiserver:6443 -> kubernetes.default.svc.
  # The old kubeadm-style placeholder was written verbatim into every <user>-clientconfig server-url
  # (unreachable NXDOMAIN on GKE, wrong port), breaking the cert-replay per-user RBAC hop. Users must
  # re-login after this rolls so authn re-issues the clientconfig with the corrected server-url.
  version: 0.27.3
  deps:
  - authn-crd
  tier: platform
  feature: portal
  expose: true
  exposePort: 8082
  nodePort: 31001   # pinned deterministic NodePort (host-mappable) for exposure.type=NodePort
  svcMatch: authn
  configKeys:
  - AUTHN_API_BASE_URL
  # exposure.type=Gateway, gatewayMode=path: this component is routed through the agentgateway on the
  # single platform listener at gatewayPath (compositions.yaml emits it into agentgateway-policies'
  # spec.platformRoutes). gatewayRewrite strips the path prefix before forwarding to the backend
  # (authn serves at /, so the /auth prefix must be rewritten away). gatewayAuth is the listener-route
  # auth posture: public = no token required (login endpoints must be reachable unauthenticated).
  gatewayPath: /auth
  gatewayRewrite: true
  gatewayAuth: public
- name: snowplow
  kind: Snowplow
  chart: snowplow
  # 1.12.9: SKIPS 1.12.8, and that is safe — verified linear history with 1.12.8 an ancestor, so the
  # :1.12.9 image CONTAINS both 1.12.8 commits, and neither touches a CRD, a schema or any persisted
  # state, so there is no migration to have missed. The chart is byte-identical; all 660 lines of new app
  # code ride the image tag (distinct GHCR digests verified), so a chart diff is the WRONG instrument here.
  # 1.12.8 = two audit fixes: an informer gate that stops registering reflectors for resources discovery
  # declares without list+watch (metrics.k8s.io pods/nodes advertise get+list only, so the reflector LISTed
  # then failed WATCH forever — measured on 057 at +236k dirty-marks per 14min for ZERO evictions), and a
  # CA-bundle install for token-auth endpoints (every NON-GET api-step against snowplow's own SA endpoint
  # was dying x509: certificate signed by unknown authority). 1.12.9 = the built-in `quantity` jq module
  # (#236) plus an otel bump. THE INFORMER GATE IS THE RISK: it sits on the registration path for every
  # GVR, fails safe OPEN, and a wrong skip is SILENT — it degrades to apiserver fallthrough, which looks
  # perfectly healthy. Confirm from the eviction/fallthrough counters, not from pod readiness.
  # 1.12.10 (#237 A + A3): OBSERVABILITY ONLY — no serve-path behaviour change, no cache-key change, no
  # repair verb. A = GET /debug/store?gvr=&namespace=&name= behind the existing /debug/* JWT gate,
  # reporting the INFORMER STORE's view of one object (resourceVersion, uid, last-seen; metadata and
  # sha256 only, never a body). A3 = per-GVR reflector-path attribution, warn on transition only.
  # Deliverable B (divergence detection + evidence-driven repair) is MERGED but deliberately NOT here:
  # it fires a targeted relist that takes a GVR non-servable for minutes, and 057 is carrying the live
  # #237 staleness defect. Non-servable is a LATENCY excursion, not an outage — serve_assert.go makes a
  # not-servable informer fall through to the apiserver rather than serve as authoritative — but the
  # split was a safety call and B ships separately once 057 is quiet.
  # WHY THIS TAG IS WORTH IT: L1 is structurally BLIND to store staleness. A successful refresh against
  # a stale store resolves stale bytes and Puts them with a fresh CreatedAt, so cell age resets and every
  # L1 counter reads healthy while the defect is active. /debug/store is the first per-object read of the
  # store itself. READ IT AS A LAYER DISCRIMINATOR, NOT A DETECTOR: nothing in A fires on its own.
  # 1.12.11 (#237 deliverable B): divergence detection + evidence-driven repair. This is the FIRST
  # thing in the system that compares the informer store against an authority at all. A and A3
  # (1.12.10) gave a per-object store READ; B compares.
  # WHY IT WAS SPLIT OUT OF 1.12.10, and why that split was right: on a CONFIRMED divergence B fires
  # a targeted relist, which takes that GVR non-servable for a few minutes while it rebuilds, and
  # 057 was carrying the live #237 staleness defect at the time. NON-SERVABLE IS A LATENCY
  # EXCURSION, NOT AN OUTAGE — verified from source, not from the handoff: a not-servable informer
  # falls through to the apiserver rather than serving as authoritative
  # (go/snowplow/internal/cache/serve_assert.go). Read the PRODUCTION citation at lines 121-123
  # (serveRequiresServableViolations incremented, function returns false, caller falls through);
  # line 112 is the TEST-MODE panic string and is the wrong evidence for runtime behaviour.
  # Globally serialised — one relist in flight across all GVRs — with an alarmable breaker, and it
  # fires only on evidence. Firing rate on 057 is UNKNOWN and deliberately not estimated: B is the
  # first instrument that can detect this class, so there is no prior. That is the measurement.
  # CLAIM CONSTRAINT, carry it verbatim: B closes invisibility for every loss class EXCEPT A STALE
  # CACHER. Its oracle is the snapshot just received, not the apiserver, so if that snapshot is
  # itself stale the store and the snapshot agree and every divergence counter reads 0 WITH THE
  # DEFECT ACTIVE. #237's root cause is OPEN and that candidate is live. B MUST NOT be described as
  # having made #237 detectable — only its other candidate classes.
  # READING INSTRUCTION, inverted from the usual: read store_verifications_total and
  # objects_verified_total FIRST. If those are zero, every divergence zero beneath them means "did
  # not look", not "looked and found nothing". That pairing is why both counters exist.
  # WHAT IT DOES NOT BUY: it will not explain the occurrence that prompted #237 — that object is
  # currently fine and the pod holding the stale state is gone. It arms the next one, which on three
  # occurrences in a week is not hypothetical.
  # 1.12.12: OBSERVABILITY ONLY — four fields on the resolved-cache metadata surface, read via
  # /debug/apistage: rbacSubGen, perPage, page, extrasHash. No key change, no serve-path behaviour
  # change, no Put decision change, and NO repair verb — so the risk profile is 1.12.10's (A + A3),
  # not 1.12.11's (B). Nothing here can take a GVR non-servable.
  # THE ONE COST, NAMED BY THE AUTHOR RATHER THAN DISCOVERED: a hash computed ONCE PER PUT, off the
  # lock, at a measured 49.99 Puts/s. Deliberately NOT on the read path, because hashing under the store
  # mutex during a metadata walk would stall serving at 100K entries.
  # WHY IT MATTERS: it is the instrument that tests whether the 40.7% cache-waste figure is real. That
  # number was computed on a tuple which COLLAPSED three of the key's own components — the exact three
  # this adds — so IT MAY REVISE DOWNWARD, and that would be the instrument working rather than failing.
  # A threshold is pre-registered so the outcome cannot be argued after the fact.
  # THE GUARD IS THE PART WORTH COPYING. The capture script REFUSES to compute if the four fields are
  # absent from the rows, and that guard was tested against a pre-instrument capture rather than assumed:
  # it aborts with "this capture is from a build WITHOUT the instrument; a zero below would mean 'not
  # measured', not 'no excess'." Without it, a clean zero across 4,823 cells would have read as evidence
  # the fix is unnecessary — the same "did not look" vs "looked and found nothing" confusion B's paired
  # denominators exist to prevent.
  # 1.12.11 (B) IS LIVE AND ITS FIRST PRODUCTION READING WAS HONEST: eight divergence counters at zero
  # AND their denominators at zero, with 191 skips attributed to the initial-sync guard, so it refused to
  # present "did not look" as "looked and found nothing". /debug/store also returned an object's
  # resourceVersion matching etcd exactly. That was the design intent and it held on first contact.
  # The gated /debug/* capture is the component owner's to take; it is not blocked on this roll.
  # 1.12.13 (#247/#255): FOUR OBSERVABILITY COUNTERS AND NOTHING ELSE. No behaviour change — every
  # existing code path fires exactly as today, with a dedicated test arm asserting it. No flag, no new
  # endpoint, no chart default changed, and it authorises no fix.
  #   snowplow_rbac_subgen_bumps_total
  #   snowplow_rbac_subgen_subjects_tracked
  #   snowplow_rbac_binding_noop_updates_total
  #   snowplow_rbac_binding_semantic_noop_updates_total
  # SCOPE VERIFIED FROM THE DIFF, not from a green workflow: 1 commit, 10 files, +1204/-5, of which 659
  # additions are TESTS in two new files. Production changes are two counter files, two expvar files,
  # +110/-3 in rbac_subgen.go, +18/-2 in bindings_by_gvr_delta.go, +52 in the OTLP mirror, +16/-0 in
  # main.go. Tag 1.12.13 -> 0508aab5; image and both charts confirmed by manifest fetch (HTTP 200
  # anonymously), not inferred from CI.
  # THE ONE NON-OBVIOUS THING, declared by the author rather than found by review: internal/metrics is
  # the OTLP mirror and is gated by OTEL_METRICS_ENABLED (default FALSE), so the counters ALSO needed
  # unconditional expvar registration in main.go to be readable at /debug/vars at all — otherwise they
  # would be ABSENT rather than zero on every default-configuration pod. That is two new unconditional
  # calls on the STARTUP path (RegisterRBACSubGenExpvar, RegisterRBACBindingNoopExpvar), sitting beside
  # the existing RegisterRBACSnapshotExpvar and the same shape. Nothing on the request path reads them;
  # the hot read side (subGenValue) is untouched.
  # WHY IT IS WORTH A ROLL: it measures whether a watch relist rotates the L1 cache key for EVERY user
  # with no RBAC change anywhere (#253). The current instrument cannot distinguish "RBAC is quiet" from
  # "rotation is happening and we cannot see it", and that question gates a key-version decision held
  # for 1.13.0 (#254).
  # DO NOT READ AN ALL-ZERO /debug/vars AFTER THIS ROLL AS A FAILURE. A freshly rolled pod has no
  # history, so every counter starts at zero and the first captures REFUSE to report: the #253 gate
  # makes INADMISSIBLE a distinct verdict from a real reading, and it needs >=2 distinct rbacSubGen
  # values resident before any number means anything. That is the instrument working.
  version: 1.12.13
  deps:
  - snowplow-crd
  - authn
  tier: platform
  feature: portal
  expose: true
  exposePort: 8081
  nodePort: 31002   # pinned deterministic NodePort (host-mappable) for exposure.type=NodePort
  svcMatch: snowplow
  configKeys:
  - SNOWPLOW_API_BASE_URL
  # exposure.type=Gateway, gatewayMode=path: snowplow's content API is routed at /content and the
  # prefix is rewritten away (snowplow serves at /). optional = a token is verified WHEN PRESENT but
  # not required, so anonymous portal content reads still work while an authenticated caller is
  # identified (matches snowplow's own optional-auth content posture).
  gatewayPath: /content
  gatewayRewrite: true
  gatewayAuth: optional
  frontendConfigEnv: FRONTEND_CONFIG_CONFIGMAP
  # Internal (ClusterIP, server-to-server) URLs the snowplow chart hardcodes at the per-component
  # default ports (env.URL_SELF=snowplow:8081, env.URL_AUTHN=authn:8082) for the #57 seed->authn
  # loopback-token exchange (and the JWKS fetch derived from URL_AUTHN). exposure.port collapses those
  # Services to the shared port, so compositions.yaml recomputes these on exposure.port.
  internalUrls:
  - path: env.URL_SELF
    peer: snowplow
  - path: env.URL_AUTHN
    peer: authn
- name: frontend
  kind: Frontend
  chart: frontend
  # 1.5.27 adds the Autopilot voice/dictation control to the composer, gated ENTIRELY on the config
  # key AUTOPILOT_VOICE_TRANSCRIBE_URL: empty (chart default) => no microphone renders and the composer
  # DOM is byte-identical to 1.5.26; set it (to the HTTPS /stt/v1 route) to turn it on. Dictation also
  # needs a secure context, so on plain-HTTP it stays invisible regardless. Bumping the pin alone is
  # inert; voice goes live only when the CR sets componentValues.frontend.config.AUTOPILOT_VOICE_TRANSCRIBE_URL.
  # 1.5.28 (#119): the publish destination form documents that the target repo must ALREADY EXIST
  # (git-provider clones, it never creates it), and a claim publish now shows a live per-file
  # LocalResource status in the rail (✓/✗ + the git error) instead of a silent hang; also activates
  # the #163 per-artifact blueprint targeting (krateo-blueprints/<chart>). All UI-only, default-inert.
  # 1.5.30 (#185/#186): #185 fixes the Autopilot publish-destination form opening BEHIND the preview
  # drawer (antd 6 z-index tie → "Confirm destination" unreachable, publish uncompletable) + the
  # remembered-destination global-slot bug (a page publish inheriting the KOG repo). #186 makes voice
  # input conversational (spoken turn + spoken answer, both in the transcript) + fixes Escape. SPA-only,
  # no CRD/widget-schema change → frontend-crd pin stays (1.5.30 frontend-crds published only because one
  # tag publishes all of helm/). Schema image.* defaults verified krateo-platformops/frontend (no braghettos trap).
  # 1.5.31: voice endpoint-timing fix ONLY — turn-end silence 8s->1.2s (conversational endpoint), with a
  # split so the 1.2s applies only AFTER speech is heard (lead-in stays 8s, so a think-pause before the
  # first word doesn't end the turn). Fixes "I talk and nothing happens" (~10s lag, not broken). NOTE:
  # 1.5.31 also ships an inert Cloud TTS speak-back path gated on AUTOPILOT_VOICE_TTS_URL — that key is
  # DELIBERATELY NOT set (Diego's call: move speak-back to Gemini Live native audio, frontend#190; Cloud
  # TTS demoted to fallback). The installer voice knob derives only *_TRANSCRIBE_URL, never *_TTS_URL, so
  # this stays inert by construction. frontend-crd stays 1.5.21 (no widget-schema change).
  # 1.5.32: the page-publish PATH half (paired with krateo-autopilot 0.4.11) — the host now writes widget
  # CRs to helm/portal/templates/ + the nav fragment to helm/portal/files/nav-fragments/ (was chart/…,
  # a directory the portal repo dropped 2026-08-03, so page publishes merged clean but the page never
  # rendered). The prompt half (0.4.11) stops the model naming the dead repo/emitting a path. frontend-crd
  # stays 1.5.21 (no widget-schema change).
  # 1.5.33: per-fenced-code-block copy buttons in the Markdown widget — previously allowCopy copied the
