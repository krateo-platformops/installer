- name: controller-render-service
  # 0.26.1 fixes a defect in 0.26.0's NEW controller-render-service chart: its values.schema.json had
  # `additionalProperties: false` on the `global` block, but the composition engine injects ten keys
  # there at install time (compositionId/Name/Namespace/Group/Resource/ApiVersion/Kind/InstalledVersion,
  # krateoNamespace, gracefullyPaused), so helm REFUSED the install — "at '/global': additional
  # properties ... not allowed". Live effect on 057: the ControllerRenderService composition sat
  # Ready=False (reason Creating) with NO helm release ever created, so the renderer never came up and
  # Controller Builder Preview stayed down until this pin. blueprint-render-service omits that line for
  # exactly this reason; 0.26.0 copied its structure but not the omission. Root stays strict; only
  # `global` is permissive, and the reason is documented in the schema so it is not re-tightened.
  # The controller renderer: previews the CRDs a set of RestDefinitions would generate (POST /render),
  # backing the portal's Controller Builder Preview via the controller-render-draft RESTAction. Placed
  # next to blueprint-render-service deliberately — these are the two render services and they are now
  # packaged identically.
  #
  # WHY THIS PIN EXISTS. Until oasgen-provider 0.26.0 this was a conditional sub-deployment of the
  # oasgen-provider chart, gated on six componentValues keys. That made it the ONLY Krateo render
  # service needing install-time configuration: a fresh install left them unset, so there was no render
  # service and Controller Builder Preview and Publish were simply off, while blueprint-render-service
  # worked out of the box (installer#434). The chart's defaults are now correct for composition use
  # (snowplowEndpoint.enabled true, name controller-render-endpoint, port 8080 on both the container and
  # the Service), so this pin needs NO componentValues — exactly like its sibling.
  #
  # Version is the oasgen-provider TAG: keep it equal to the oasgen-provider and oasgen-provider-crd
  # pins. feature: portal, not oasgenProvider — the consumer is the portal's Controller Builder, and it
  # matches blueprint-render-service. No deps: it ships no CRDs and reads nothing from the cluster (the
  # OAS documents arrive in the request), so it has nothing to wait for.
  kind: ControllerRenderService
  # 0.27.0: co-versioned with oasgen-provider (the triple moves together). Verified byte-identical to
  # 0.26.1 outside Chart.yaml - the render split landed in 0.26.x and nothing in it changed here.
  # 0.28.0: co-versioned with oasgen-provider (the triple moves together). Declares NO kubeVersion
  # floor — it ships no CRDs and no controller, so it installs anywhere.
  # 0.28.1: co-versioned with oasgen-provider (the triple moves together). No kubeVersion floor.
  version: 0.28.1
  tier: platform
  feature: portal
  chart: controller-render-service
- name: oasgen-provider
  # 0.26.0 is a BREAKING CHART CHANGE (oasgen-provider#165): `render.*` is gone from this chart's
  # values and `render.enabled=true` is now REJECTED rather than ignored. The oasgen-render service it
  # used to deploy conditionally now ships as its own chart, controller-render-service, pinned below.
  # That repo now publishes THREE charts from one tag, so oasgen-provider, oasgen-provider-crd and
  # controller-render-service are a co-versioned TRIPLE and must move together — the invariant
  # installer#432 proposes enforcing in CI.
  # componentValues.oasgen-provider.render is REMOVED from values.schema.json in this same change.
  # componentValues.<component> is additionalProperties:false, so a cluster still carrying that key in
  # its live spec has the upgrade REJECTED. On krateo-057 the key was dropped FIRST, by a separate
  # `helm upgrade -f` on 0.3.359, which also deleted the old render objects — which is what makes the
  # handover below collision-free.
  kind: OasgenProvider
  chart: oasgen-provider
  # 0.23.0 (0.21.1 -> 0.23.0, lockstep with oasgen-provider-crds): resolves the delete-finalizer
  # saga, fixes read-only/findBy resources, and the #113 GitHub-contents double-escape (%252F) 404.
  # Big-version wrapper-CRD jump (OasgenProvider v0-21-1 -> v0-23-0 CDC controllers) — may need a
  # cdc restart + CRD helm-ownership nudge on the live roll. oasgen is idle on 057 (0 RestDefinition
  # CRs), so data-plane blast radius is just this deployment's restart.
  # 0.27.0: TWO changes; the second is not in the release notes and is the one that moves cluster state.
  #   (a) additionalStatusFields becomes APPEND-ONLY instead of immutable. The CEL is a prefix compare,
  #       `size(self) >= size(oldSelf) && oldSelf.all(i, v, self[i] == v)`; entries may be added at the
  #       END, and removing/renaming/reordering is still refused. This is what unblocks
  #       github-provider-kog 0.3.2, whose PullRequest list goes ['number','html_url','state'] ->
  #       + 'merged','merged_at' - verified a prefix-preserving append across all 29 rd-*.yaml.
  #   (b) NEW: the provider now creates ONE MutatingAdmissionPolicy per distinct spec.resourceGroup to
  #       stamp krateo.io/oas-version, and clusterrole.yaml grows create/get/list/watch on
  #       admissionregistration.k8s.io mutatingadmissionpolicies + ...bindings. 057 is k8s 1.36 so this
  #       ACTIVATES. Expected: 2 groups (github.krateo.io x29, petstore.example.io x1) -> 2 policies,
  #       krateo-oas-version-{github-krateo-io,petstore-example-io}; cluster goes 2 -> 4.
  #   UPGRADE NOTE, read before assuming this is quiet: status.resourceHash is NEW in 0.27.0 (absent from
  #   0.26.1's types.go AND its CRD), and the regeneration gate is
  #   `oasHash != Status.OASHash || resHash != Status.ResourceHash`. resourceHash() never returns empty,
  #   so "" != <hash> is true for EVERY RestDefinition and all 30 regenerate on first reconcile - ~60
  #   CRD re-applies against 77+ live CRs. Safe because nothing under internal/tools/oas2jsonschema or
  #   internal/tools/crd changed between the tags, so the renders are byte-identical; but it is also the
  #   ONLY reason the policies reach an existing install at all. Once resourceHash is populated,
  #   generateAndApplyCRDs never runs again on a stable install and EnsureVersionPolicy is only called
  #   from inside it - so no future policy change can reach this cluster until oasgen-provider#173 lands.
  #   #172 (slug collision: [^a-z0-9]+ -> '-' collapses github.krateo.io and github-krateo.io onto one
  #   object, second group silently never stamped) CANNOT fire here - the two groups do not collide.
  # 0.28.0: BREAKING — raises the Kubernetes floor. Supersedes 0.27.1 (its #172/#173 fixes are
  #   included); 0.27.1 was never rolled here.
  #   THE FLOOR: oasgen-provider and -crds now declare kubeVersion '>=1.36.0-0' and REFUSE to install
  #     below it (verified against the published charts: 1.33/1.35 refuse, 1.36 accepts).
  #     057 is v1.36.2-gke.2064000, read from the API, so it passes. controller-render-service keeps
  #     NO floor — it ships no CRDs and no controller.
  #     Why the floor moved: rest-dynamic-controller now watches ONLY the instances its own CRD
  #     version owns, selecting on krateo.io/oas-version with exact equality. The
  #     MutatingAdmissionPolicy that writes that label is GA from 1.36. Below 1.36 nothing writes it,
  #     the selector matches nothing, and the install comes up GREEN while reconciling no instance at
  #     all. A refused install is the better failure.
  #   THE BACKFILL: the policy stamps only on CREATE/UPDATE, so instances untouched since the policy
  #     landed carry no label and would be orphaned by an exact-equality selector. The provider
  #     backfills them before deploying the selecting controller.
  #     ON 057 THE BACKFILL IS A NO-OP, measured pre-roll: of 87 github.krateo.io CRs, 29 lacked the
  #     label and ALL 29 are *Configuration* kinds — which are fetched by reference, never
  #     version-scope-watched, so they cannot be orphaned. ZERO resource instances were unlabelled.
  #     DO NOT test this with `-l '!krateo.io/oas-version'` across all 58 served kinds: that lists the
  #     unlabelled Configurations, never returns empty, and reads as a failed backfill on a correct
  #     release. 58 = 2 x 29 because each RestDefinition generates a resource CRD AND a Configuration
  #     CRD. The correct check is the 29 RESOURCE kinds only; empty there is the pass.
  #     So a clean roll here proves "no instance required the backfill, and none was orphaned" — NOT
  #     that the migration path works. The real population lives on krateo-installer-release (oasgen
  #     0.9.8, no oas-version policy ever): 36 unlabelled RESOURCE instances there.
  #   RELEASE-GATE CAVEAT: the chart-images CI gate was FAIL-OPEN for this release — raising the floor
  #     above the CI runner's helm made both charts unrenderable there and the workflow warns rather
  #     than fails, so it checked one image of three. Both images were verified by hand instead
  #     (amd64+arm64, org.opencontainers.image.revision=6cc364f4059c). Fix: krateo-platformops/.github#25,
  #     unmerged — every release until it lands inherits the same silent downgrade.
  # 0.28.1: FIXES A 0.28.0 REGRESSION THAT WEDGED EVERY RestDefinition AT Ready=False/Creating.
  #   Symptom on 057: all 30 RestDefinitions flipped to Creating 3 minutes after the 0.28.0 roll and
  #   stayed there for 3 hours. Nothing was functionally broken — 58 generated CRDs Established=True,
  #   30 rest-dynamic-controllers 1/1, 0 unlabelled resource instances, no API churn — but
  #   GithubProviderKog and Petstore never went Ready, so the INSTALLER UMBRELLA reported a permanent
  #   false-RED. That is the dangerous half: anything gating on installer readiness could not tell
  #   this from a real failure.
  #   CAUSE: three `deploy.DeployOptions` literals in restdefinition.go and LabelSelector was set on
  #   only two. Observe (:436) rendered the controller deployment WITHOUT the version-scoped selector;
  #   Create (:621) and Update (:909) rendered it WITH. So Observe computed digest A, the write paths
  #   stored digest B, A != B every pass, Observe returned ResourceUpToDate:false, Update re-stored the
  #   value it already had, and Available() at :523 — downstream of the comparison — was never reached.
  #   THE SIGNATURE, worth recognising again: "Rendered resources digest changed" ~36x/5min while
  #   status.digest stayed CONSTANT and resourceVersion never moved. A stable stored digest with a
  #   churning rendered one means the two code paths disagree, NOT that persistence is failing.
  #   FIX: one `deployOptions()` constructor serving all three call sites, dry-run the only permitted
  #   difference — verified in the 0.28.1 source (1 literal, 3 call sites, constructor present).
  #   Restoring the missing field alone would have fixed this instance and left the next added field
  #   free to diverge identically.
  #   PASS CRITERION: the RestDefinitions must reach Ready=True with NOTHING deleting or editing them,
  #   and the composition rollup must return to full. If any needs a nudge, the digests still disagree.
  #   Nothing else from 0.28.0 changes: the k8s>=1.36 floor, the version-scoped watch, the policy
  #   requirement and the label backfill are all unchanged and all worked.
  #   RELEASE-GATE CAVEAT, same as 0.28.0: the chart-images gate was FAIL-OPEN again (the 1.36 floor
  #   makes both charts unrenderable on the CI runner, and the workflow warns rather than fails).
  #   Images verified by hand instead. The .github fix is still unmerged and now blocks core-provider's
  #   tag too — the issue number was cited as #25 once and #24 once, so confirm which before chasing.
  version: 0.28.1
  deps:
  - oasgen-provider-crd
  tier: platform
  feature: oasgenProvider
# ---- observability backend (portal-gated: installs WITH the portal feature) -----------
# ClickStack (ClickHouse + OTel gateway + HyperDX + MongoDB) as compositions. The data-plane
# operators install FIRST (krateo-observability deps them), then the data layer, collectors,
# and sse-proxy (whose EVENTS_* config the frontend events bell consumes). All public
# krateo-platformops/charts (no repo override).
- name: clickhouse-operator
  kind: ClickhouseOperator
  version: 0.1.1
  tier: observability
  feature: portal
- name: mongodb-operator
  kind: MongodbOperator
  version: 0.2.0
  tier: observability
  feature: portal
- name: krateo-observability
  kind: KrateoObservability
  # 0.1.19 (observability#62): the log-scoped default alerts also exclude ServiceName
  # 'krateo-alert-provider', so they never count the alert-provider's own logs.
  version: 0.1.20
  deps:
  - clickhouse-operator
  - mongodb-operator
  tier: observability
  feature: portal
  # HyperDX IS NOT PUBLICLY ROUTED, deliberately. It was: a Next.js root-asset app (hardcoded /_next,
  # /assets) cannot live under a path prefix, so it had its OWN listener (platform-hdx:3000) with a
  # public route at /. That put the whole trace search over ClickHouse on the platform LoadBalancer,
  # and — because the TLS upgrade only moved the SHARED listener — it sat there on plaintext HTTP
  # beside the HTTPS portal, with HyperDX's own login as the entire perimeter and the login itself
  # crossing the internet in the clear.
  #
  # An operator console is not an end-user surface. The portal already reads the same ClickHouse
  # through snowplow's RestActions, which is what users are meant to see; HyperDX is for operators and
  # is reached in-cluster (kubectl port-forward svc/krateo-clickstack 3000). Nothing in the portal
  # depends on the public route: the alert-detail deep-links are gated on a console URL that is unset,
  # so they render inert either way.
  #
  # Restoring it means BOTH a listener and the TLS block that listener needs — agentgateway-policies
  # refuses a mixed TLS posture, so a plaintext re-add fails the render rather than shipping quietly.
  # And prefer gatewayAuth: authenticated over public if it ever comes back.
  #
  # svcMatch stays: it names the live HyperDX app Service (the clickstack chart's fullnameOverride) for
  # anything that still resolves it. No expose:true, so no service-flip / host HTTPRoute either.
  # FRONTEND_URL is consequently NOT set by the installer — with no external origin there is no honest
  # value to compute, and the chart default stands (compositions.yaml gates on gatewayPort).
  svcMatch: krateo-clickstack
- name: otel-collector-deployment
  kind: OtelCollectorDeployment
  version: 0.3.7
  deps:
  - krateo-observability
  tier: observability
  feature: portal
- name: otel-collector-daemonset
  kind: OtelCollectorDaemonset
  # 0.1.9 (#122): traces pipeline redacts caller JWTs before ClickHouse — drops the
  # http.header.Authorization span attr + strips eyJ… tokens from exception/error/status
  # messages (backstop for the upstream kagent-tools JWT-in-span leak, amplified by per-user RBAC).
  version: 0.1.10
  deps:
  - otel-collector-deployment
  tier: observability
  feature: portal
- name: krateo-sse-proxy
  kind: KrateoSseProxy
  version: 0.1.12
  deps:
  - krateo-observability
  tier: observability
  feature: portal
  expose: true
  exposePort: 8080
  nodePort: 31003   # pinned deterministic NodePort (host-mappable) for exposure.type=NodePort
  svcMatch: sse-proxy
  configKeys:
  - EVENTS_API_BASE_URL
  - EVENTS_PUSH_API_BASE_URL
  # exposure.type=Gateway, gatewayMode=path: the events/notifications SSE stream is routed at /events
  # with the prefix rewritten away (sse-proxy serves at /). optional mirrors sse-proxy's own MANDATORY-
  # by-design token check happening in-app; the gateway passes the token through (a token is verified
  # when present) rather than terminating auth at the edge. NB: an SSE stream needs listener-level
  # long-lived-connection handling — the same single-replica/no-sticky-session caveat as host mode.
  gatewayPath: /events
  gatewayRewrite: true
  gatewayAuth: optional
  # sse-proxy verifies authn JWTs MANDATORY/fail-closed, fetching the JWKS from <auth.urlAuthn>/
  # .well-known/jwks.json (chart-hardcoded authn:8082). exposure.port collapses authn to the shared
  # port, so recompute auth.urlAuthn on it (else the events bell can't verify tokens and breaks).
  internalUrls:
  - path: auth.urlAuthn
    peer: authn
# ---- ingress / edge (OPT-IN, feature: ingress — default OFF) ---------------------------
# The FULL edge as blueprints (everything-is-a-blueprint): the Gateway itself + its CRDs, DNS,
# and certs — so exposure.type=Gateway needs no BYO Gateway. Public krateo-blueprints charts
# (repo override; no credentials), gated on features.ingress so the base install pulls nothing
# from krateo-blueprints unless enabled. Kinds are crdgen PascalCase(chart) — crdgen is
# INITIALISM-AWARE (Go common-initialisms: api->API, dns->DNS; but crds->Crds, NOT CRDS), so:
# gateway-api-crds -> GatewayAPICrds, external-dns -> ExternalDNS, agentgateway -> Agentgateway,
# cert-manager -> CertManager, cert-manager-issuers -> CertManagerIssuers. Pass B's inst.crdExists
# matches spec.names.kind by EXACT string, so a naive PascalCase mispin silently blocks Pass B
# (installer#31; the check-pins CI guard enforces this at PR time).
# DEP-CHAINED so the edge converges in order:
#   gateway-api-crds -> agentgateway -> cert-manager -> cert-manager-issuers -> external-dns
# The Gateway API CRDs must be served before the Gateway; the Gateway (agentgateway 0.4.0 bundles
# its own agentgateway-crds subchart, else the controller never programs it) before the routes;
# cert-manager (operator + CRDs) before cert-manager-issuers (Issuers only) — 0.3.x bundled both in
# ONE release and the cert-manager.io CRDs were not established when the Issuers applied (installer#34,
# blueprint 0.4.0 split them). Pair with exposure.type=Gateway (installer#27). Preconditions:
# external-dns needs its provider-credential Secret placed out-of-band.
# All are public krateo-blueprints charts at 0.4.0 (ingress-blueprint tag 0.4.0).
- name: gateway-api-crds
  kind: GatewayAPICrds
  version: 0.10.0
  repo: oci://ghcr.io/krateo-blueprints/charts
  tier: platform
  feature: ingress
- name: agentgateway
  kind: Agentgateway
  version: 0.10.0
  repo: oci://ghcr.io/krateo-blueprints/charts
  deps:
  - gateway-api-crds
  tier: platform
  feature: ingress
- name: cert-manager
  kind: CertManager
  version: 0.10.0
  repo: oci://ghcr.io/krateo-blueprints/charts
  deps:
  - agentgateway
  tier: platform
  feature: ingress
- name: cert-manager-issuers
  kind: CertManagerIssuers
  version: 0.10.0
  repo: oci://ghcr.io/krateo-blueprints/charts
  deps:
  - cert-manager
  tier: platform
  feature: ingress
- name: external-dns
  kind: ExternalDNS
  version: 0.10.0
  repo: oci://ghcr.io/krateo-blueprints/charts
  # #115: external-dns is STANDALONE on its OWN feature (externalDns), NOT bundled under ingress — so it
  # runs with the agentgateway-controller path (057) without dragging the gateway-api-crds + agentgateway +
  # cert-manager stack. The old deps (agentgateway, cert-manager-issuers) were ingress-ordering, not real
  # deps, and are dropped. A host-mode ingress install that also wants DNS enables BOTH ingress + externalDns.
  tier: platform
  feature: externalDns
# ---- agents (PRIVATE krateo-agentiko registry) ----------------------------------------
# Every agent chart lives in the private krateo-agentiko/charts OCI registry (repo override
# below), so pulling them needs registryAuth.enabled=true + a read:packages credential
# (the license, model A). kagent stays ClusterIP: the frontend nginx `/autopilot/` proxies
# to the kagent-ui Service in-cluster, so the Autopilot toggle works without an external LB.
# Kinds are crdgen PascalCase(chart name): the 5 specialists dropped the krateo- prefix in the
# migration, so authn-agent -> AuthnAgent (NOT KrateoAuthnAgent). agent:true marks the components
# that DEPLOY a kagent Agent — it earns the .Values.vertexAI injection (pod ADC), the HITL gate, the
# gateway wiring and fleet membership; modelOwner (model-configs) owns the shared ModelConfigs every
# agent references by name (WHICH one each agent gets is operator policy, not a pin: values.yaml
# componentValues.<agent>.modelConfig.name); orchestrator (autopilot) auto-derives its extraAgents
# fleet from every feature-enabled agent.
- name: kagent-crds
  kind: KagentCrds
  version: 0.1.6
  repo: oci://ghcr.io/krateo-agentiko/charts
  tier: observability
  feature: coreAgents
- name: kagent
  kind: Kagent
  version: 0.1.18
  mcpBackend: true  # #116 roll-guard: hashed into gateway.mcpBackendHash + every agent rollGuard
  repo: oci://ghcr.io/krateo-agentiko/charts
  deps:
  - kagent-crds
  tier: observability
  feature: coreAgents
- name: model-configs
  # 0.1.2 adds an optional per-slot `reasoningEffort` and the slot `flashLow`
  # (ModelConfig gemini-flash-low, gemini-3.8-flash at reasoningEffort: low), for the Autopilot
  # page-building A/B whose baseline put 69% of the chain's reasoning tokens on snowplow-agent.
  # INERT until an agent's componentValues.<agent>.modelConfig.name is set to gemini-flash-low —
  # nothing references the new slot, so the pin bump alone changes no agent's behaviour, and
  # gemini-flash/gemini-pro render byte-identically (verified against 057's live values).
  # reasoningEffort is emitted ONLY on the agentgateway route path (kagent sends it as OpenAI
  # reasoning_effort, agentgateway maps it to Gemini 3 thinkingLevel); on the vertexAI/local paths
  # the field does not exist and the chart drops it. 057 IS on the route path (live gemini-flash
  # has provider OpenAI + the /llm/v1 baseUrl), so the effort lands here. A bare `helm template`
  # with chart defaults takes the vertexAI branch and shows NO effort — that render is the wrong
  # instrument for this question, not evidence the feature is broken.
  kind: ModelConfigs
  version: 0.1.2
  repo: oci://ghcr.io/krateo-agentiko/charts
  deps:
  - kagent
  tier: observability
  feature: coreAgents
  # modelOwner: this component OWNS the fleet's ModelConfigs. Deliberately NOT `agent` — it deploys
  # no kagent Agent, it only renders ModelConfigs. modelOwner earns it the same .vertexAI injection
  # (which selects provider GeminiVertexAI on them) and agentgateway.enabled that agents get, plus
  # the .localModel injection and the LLM-route wiring that are its alone.
  modelOwner: true
- name: installer-agent
  kind: InstallerAgent
  version: 0.3.2
  repo: oci://ghcr.io/krateo-agentiko/charts
  deps:
  - repo-mcp-server
  - kagent
  - model-configs
  tier: observability
  feature: coreAgents
  agent: true
- name: repo-mcp-server
  kind: RepoMcpServer
  # 0.1.4: THE CORPUS EVERY AGENT GROUNDS ON HAS BEEN STALE, and nothing said so. Verified on 057
  # BEFORE this bump, not taken from the handoff:
  #   kubectl auth can-i get configmaps -n krateo-system \
  #     --as=system:serviceaccount:krateo-system:repo-mcp-server   ->  no
  #   in-pod corpus: frontend-1.4.8 (cluster ran 1.6.46), portal-1.6.0 (cluster 1.8.39),
  #                  core-provider-2.13.14 (cluster 2.13.15)
  #   cm/krateo-installed-versions: present and CORRECT (frontend 1.6.46, snowplow 1.12.9)
  #
  # repo-mcp-server overrides its build-time pins by reading that ConfigMap with its OWN
  # ServiceAccount, and the chart created the SA and bound it to nothing. Two Roles named
  # repo-mcp-server DO exist but they bind the CDC CONTROLLER SAs (repomcpservers-v0-1-2 / -v0-1-3),
  # not the app SA — so the obvious object is once again the wrong one. The loader FAILS OPEN, so the
  # 403 was swallowed and stale pins served: the denial was log.debug and the startup banner reported
  # repository COUNTS but never VERSIONS. Healthy pod, correct ConfigMap, silently wrong answers.
  #
  # OBSERVED COST: frontend-agent, asked to build a page on quantity.jq (snowplow 1.12.9), searched
  # provisioning_verdict, found only health.jq and ended its turn having written nothing. TWO earlier
  # PROMPT fixes aimed at that behaviour changed nothing, because it was never a prompt problem.
  #
  # 0.1.4 adds templates/rbac.yaml — verified from the RENDERED chart, minimal and correctly scoped:
  #   Role/repo-mcp-server-installed-versions  configmaps verbs=[get]
  #                                            resourceNames=[krateo-installed-versions]
  #   RoleBinding -> ServiceAccount/repo-mcp-server;  ZERO secrets rules.
  # It also promotes the denial to a WARNING naming the cause and makes the banner state the versions
  # it serves — so the next occurrence is visible rather than silent.
  #
  # BLAST RADIUS IS THE WHOLE FLEET: this pin is mcpBackend:true, so the roll-guard hash moves and all
  # 16 agents re-roll, not five. Largest radius of any roll today; coordinate before applying.
  #
  # VERIFY AFTER (two commands, neither of which trusts the release object):
  #   kubectl auth can-i get configmaps -n krateo-system --as=...:repo-mcp-server   -> yes
  #   kubectl exec deploy/repo-mcp-server -- ls -d /tmp/krateo-repos/*/*/  -> frontend-1.6.48
  # The pod resolves pins AT IMPORT and caches checkouts in an emptyDir, so the corpus only re-fetches
  # on a NEW pod. The version bump recreates it, so no manual rollout restart is expected — but that is
  # a prediction to CHECK, not to assume: if the paths still read 1.4.8, bounce it.
  # 0.1.5: THE PINS WERE READ ONCE, AT IMPORT. 0.1.4 gave the pod permission to read the
  # installed-versions ConfigMap; it still read it exactly once, so the corpus tracked the platform as
  # it was when the pod started and nothing after. Measured on 057 before this bump:
  #   pod banner (17:17Z, 14h old, 0 restarts):  frontend@1.6.48, installer@0.3.256
  #   cm/krateo-installed-versions now:          frontend@1.6.52, installer@0.3.260
  #   corpus on disk:                            frontend-1.6.48/
  # Four frontend releases went by underneath a pod that never restarted.
  #
  # WHAT IT COST, taken from the A2A stream rather than inferred: an agent asked
  #   search_repo {"pattern":"composeBind","repo":"frontend"}
  # and was told "frontend @ 1.6.48 — no matches". composeBind shipped in frontend 1.6.50. So the
  # agent CHECKED before using the verb, was told it did not exist, and correctly did not emit it.
  # That had been written up as an agent claiming an action it never performed. It was not: it
  # reasoned properly from a confidently wrong answer.
  #
  # THE 0.1.4 VERIFICATION PASSED AND THE BUG WAS ALREADY THERE. Its banner read frontend@1.6.48 and
  # that was CORRECT at that moment — we had just rolled 1.6.48. A check true at the instant of the
  # roll and false forever after; the staleness window was a pod lifetime, so nothing re-checked it.
  # 0.1.5 re-reads the pins on a 300s TTL, lazily, from the one function every fetch path goes
  # through, fail-open. The bump alone fixes today's instance; the TTL fixes the next one.
  #
  # NOTE the TTL knob is NOT chart-configurable. The handoff cites KRATEO_PIN_REFRESH_SECONDS, but it
  # appears nowhere in the chart — not in the deployment template, not in values — so 300s is an
  # in-image default and tuning it needs a new image. Not blocking; recorded so nobody looks for a
  # value that is not there.
  #
  # BLAST RADIUS IS THE WHOLE FLEET: repo-mcp-server is mcpBackend:true, so the roll-guard hash moves
  # and all 16 agents re-roll, as in 0.3.256. Not the quiet single-pod kind — coordinate first.
  #
  # DECISIVE POST-CHECK, one line:
  #   kubectl logs -n krateo-system deploy/repo-mcp-server | grep "runtime pin"
  # must read frontend@1.6.52, NOT 1.6.48.
  version: 0.1.5
  mcpBackend: true  # #116 roll-guard: hashed into gateway.mcpBackendHash + every agent rollGuard
  repo: oci://ghcr.io/krateo-agentiko/charts
  deps:
  - kagent
  # Every grounding agent deps on this, not the reverse: the edge makes the fleet converge in one
  # pass. It is a convergence/log-noise concern, not a correctness cliff — an agent reconciled
  # before this server's RemoteMCPServer CR exists fails its compile LOUDLY (Accepted=False,
  # ReconcileFailed, `RemoteMCPServer.kagent.dev "repo-mcp-server" not found`) and gets no
  # Deployment at all; the kagent Agent controller watches RemoteMCPServer and re-reconciles
  # within a second of the CR appearing, so it self-heals. (kagent v0.9.12,
  # go/core/internal/controller/watch_helpers.go:58-65.)
  tier: observability
  feature: coreAgents
  # features.repoGraph flips graph.enabled -> GRAPH_ENABLED here (server side of the domain-graph
  # lockstep); the consumer agents carry the matching graphToggle onto their repoSearch.graph.enabled.
  graphToggle: graph.enabled
- name: structure-graph-mcp-server
  kind: StructureGraphMcpServer
  version: 0.1.2
  repo: oci://ghcr.io/krateo-agentiko/charts
  deps:
  - kagent
  # Own feature, not coreAgents: both consumers reference it off by default, so coreAgents would
  # deploy a server nothing names.
  tier: observability
  feature: structureGraph
- name: config-refs-mcp-server
  kind: ConfigRefsMcpServer
  # 0.2.4 is the first release that SERVES the second tool, k8s_analyze — a deterministic,
  # read-only namespace analyzer (live objects + Nodes, pure-function condition checks, typed
  # findings). Nothing NAMES it yet: the k8s-agent and incident-agent bindings are unreleased, and
  # kagent's toolNames is a client-side allowlist, so on this pin the server simply serves one tool
  # more than anyone asks for and no agent behaviour changes. The pin has to lead the bindings
  # anyway — a name the server does not serve is dropped SILENTLY (Agent still Accepted=True), so
  # a binding released against 0.2.3 would be inert with no trace. Its only cluster-facing change
  # is the ClusterRole: still read-only, widened from GET on a few kinds to GET+LIST (never watch,
  # no writes) on the kinds k8s_analyze reads.
  # 0.2.6 adds a structured stderr log line per tool invocation (event/tool/clipped-args/latency_ms/
  # ok/error/ts, wrapped so it can never break a tool response) — observability only, no change to
  # tool outputs or RBAC, so the render and behaviour are identical to 0.2.4. Gives the bench
  # unambiguous per-invocation proof of which config-refs tools fire during an investigation.
  version: 0.3.0
  mcpBackend: true  # #116 roll-guard: hashed into gateway.mcpBackendHash + every agent rollGuard
  repo: oci://ghcr.io/krateo-agentiko/charts
