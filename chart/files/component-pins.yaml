  # 1.5.7: PROMPT ONLY. Chart-diffed against 1.5.6 — only Chart.yaml and files/prompts-eng.yaml.
  #   Pairs with snowplow-agent 1.2.3: the delegation now asks snowplow-agent for an EXPLICIT sort
  #   order rather than leaving it implicit, and adds tie-breakers so the ordering is DETERMINISTIC
