  # rendered k8s-agent, helm-agent and orchestrator are byte-identical to 0.4.7. Turn the knowledge
  # on deliberately, one file at a time, and measure it.
  # 0.4.9 adds the k8s_analyze binding on the k8s-agent and its prompt section, both behind
  # mcpServers.configRefs.k8sAnalyze.enabled which defaults FALSE. With the switch off the render is
  # byte-identical to 0.4.8. The chart refuses loudly if the switch is on while agents.k8s is off.
  version: 0.4.10
