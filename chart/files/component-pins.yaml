  # BUT #339 CHANGES WHAT A FUTURE CRD CHANGE WILL COST, so do not read "harmless" as "always harmless".
  # The composer now derives its whole widget model — palette, which kinds are containers, named slots,
  # required fields, the create-modal schema — from these CRD FILES at BUILD time (scripts/gen-widget-kinds.ts
  # globs helm/frontend-crds/templates/*.crd.yaml into a COMMITTED widgetKinds.generated.ts; CI re-derives
