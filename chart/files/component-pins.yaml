  kind: SnowplowAgent
  # 1.2.2: PROMPT-ONLY, and one bullet of it. The chart diff is Chart.yaml plus files/prompts-eng.yaml;
  # the rendered Agent CR is BYTE-IDENTICAL (4393 bytes at both versions) and the whole `helm template`
  # diff is exactly TWO lines, both halves of the prompts ConfigMap. The chart does declare an appVersion
  # — an earlier note here said it did not — but NO template references .Chart.AppVersion, so it still
  # ships no image: the only thing this bump delivers is text.
  #
  # WHAT THE TEXT FIXES — "USE THE WHOLE MODULE, NOT JUST THE PARSING", added to the jq-modules bullet.
  # Measured on a live cluster: asked for a table of overprovisioned pods, the agent correctly reached for
  # `include "quantity"` and `sum_quantities` to PARSE the values, then hand-wrote the verdict as
  # `usage < request` — which calls 75 of 91 pods overprovisioned where `provisioning_verdict` calls 54.
  # The arithmetic was individually correct at every step; the defect is a THRESHOLD NOBODY CAN REPRODUCE
  # presented as a finding, and "uses less than it reserved" is nearly every healthy pod, so the insight
  # is a tautology. The new text puts the ratio in `utilization_pct` and the verdict in
  # `provisioning_verdict`, states that an invented threshold is a bug EVEN WHEN THE ARITHMETIC IS RIGHT
  # (thresholds live in the module so policy is one edit, and so two pages cannot disagree about what
  # "overprovisioned" means), and extends the same rule to `health`/`normalize_health`/`usage_health`.
  #
  # THE snowplow >= 1.12.9 FLOOR FROM 1.2.1 STILL BINDS and is already met (snowplow is 1.12.9 here).
  # This release deepens the same dependency rather than adding one: it names `sum_quantities`,
  # `utilization_pct` and `provisioning_verdict`, all of which live in the `quantity` module that only
  # exists from snowplow 1.12.9 (#236). Rolling snowplow BACK below 1.12.9 would leave the agent
  # authoring filters that include a module that is not there.
  #
  # PROMPT-ONLY MEANS THE RUNNING POD MAY KEEP THE OLD PROMPT, and the obvious check is the wrong one.
  # The prompt reaches the pod through the agent's config SECRET (deploy volume `config` -> secret
  # snowplow-agent), so grepping the snowplow-agent-prompts-eng ConfigMap proves the chart RENDERED,
  # not that the running agent reads the new bytes. Verify by the FIELD:
  #   kubectl get deploy snowplow-agent -o jsonpath='{.spec.template.metadata.annotations.kagent\.dev/config-hash}'
  # It reads 16245247268778634987 before this roll (it moved from 12276131171719429138 on the 1.2.1
  # roll, so the mechanism is confirmed working). If it does not move, bounce the pod.
  # 1.2.3: PROMPT ONLY. Chart-diffed against 1.2.2 — only Chart.yaml and files/prompts-eng.yaml.
  #   THE RULE IS A REAL DEFECT CLASS, not polish: jq's `sort_by` is ASCENDING, so "worst first"
  #   requires every magnitude key to DESCEND. Get it backwards and the page is well-formed, renders
  #   cleanly and ranks exactly wrong — which is why it survives review. The prompt now states the
  #   direction explicitly, and an unstated threshold must be chosen, written into the RESTAction and
  #   reported rather than left implicit.
  #   ORDERING: goes BEFORE frontend-agent 1.5.7, whose delegation asks snowplow-agent for an explicit
  #   order. The receiving side must understand the request before the asking side starts making it.
  #   MARKER (note the backticks — grep the exact bytes, not a paraphrase):
  #     'jq `sort_by` IS ASCENDING'   (1.2.2=0, 1.2.3=1)
  # 1.2.4: CORRECTS 1.2.3 — same day, and the correction is about PLACEMENT, not about the rule.
  #   1.2.3's observation was right (jq sort_by is ascending, so "worst first" needs descending keys)
  #   but it put the ordering INSIDE the RESTAction. That violates Diego's rule that a RESTAction is
  #   completely agnostic of the widget calling it: the widget orders and formats through its own
  #   widgetDataTemplate. It also dragged back repo research — 5-11 calls and a ~12-minute turn.
  #   1.2.4 removes the ordering rule entirely (the 'jq `sort_by` IS ASCENDING' line is GONE, 1 -> 0)
  #   and states the principle instead.
  #   ORDERING, and why snowplow-agent goes FIRST despite appearances: dropping RESTAction ordering
  #   before frontend-agent stops asking for it looks like it leaves a window with nothing sorting. It
  #   does not — frontend-agent 1.5.7 ALREADY orders in widgetDataTemplate (13 references) and merely
  #   delegates AS WELL, not INSTEAD. So this leaves no gap, and the reverse order would only
  #   double-sort on the same key, which is idempotent. Checked rather than assumed.
  #   MARKER: 'WIDGET-AGNOSTIC -- A RESTACTION IS DATA'   (1.2.3=0, 1.2.4=1)
  version: 1.2.4
  repo: oci://ghcr.io/krateo-agentiko/charts
