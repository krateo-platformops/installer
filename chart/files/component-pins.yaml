  version: 0.1.30
  # Reads ClickHouse (krateo-observability) and kagent sessions through kagent's own API — which is why
  # kagent is a dep and why there is no Postgres reader: the API path inherits the per-user RBAC that
  # a direct database read would have had none of. It no longer consults krateo-autopilot at all; the
  # reviewer it talks to is created by its own chart, so that dependency would now be a false statement
  # about the graph rather than a stale but harmless one.
  deps:
  - nightly-review-crd
  - kagent
  - krateo-observability
  tier: observability
  feature: specialistAgents
- name: agentgateway-controller
