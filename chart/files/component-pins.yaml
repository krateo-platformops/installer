  # `refused` stays on ReviewRun status, both re-described as historical, because two Proposal objects
  # on 057 sit in exactly that phase and removing the value would invalidate them on their next status
  # write. A schema that cannot represent what is already stored under it is the worse outcome.
  # 0.1.13: BYTE-IDENTICAL, lockstep only.
  # 0.1.14: NOT byte-identical — ReviewRun gains truncated/truncatedAtChars/droppedChars per
  # evidence source, and `empty` is re-described because it is no longer degradation on its own.
  # 0.1.15: BYTE-IDENTICAL, lockstep only — the range touches evidence.py and tests.
- name: nightly-review-crd
  # 0.1.30: lockstep with nightly-review, one tag. The CRDs gain status.evidence fields (failing /
  # recovered) and a warningEvents stat — ADDITIVE and optional, so a rollback does not strand
  # stored CRs. Ordered BEFORE the nightly-review app pin: the app writes these fields, and neither
  # CRD sets x-kubernetes-preserve-unknown-fields, so an app-first order would have the apiserver
  # silently PRUNE them rather than fail loudly.
  # 0.1.29: lockstep with nightly-review, one tag. The CRDs DID change this time (proposal.crd.yaml
  # and reviewrun.crd.yaml both differ, 47660 -> 49549 B) but gained only OPTIONAL fields — verified by
  # diffing the packaged trees for any new `required` entry, of which there are none. That matters
  # because a newly-required field would strand stored CRs on a rollback.
  kind: NightlyReviewCrds
  chart: nightly-review-crds
