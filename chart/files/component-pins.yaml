  # THE RISK THAT MATTERS ON A KOG ROLL, and the reason the post-checks are what they are: a kog bump
  # regenerates the per-kind RestDefinitions. If one lands Ready=False its Repository CRs lose
  # `status.default_branch`, the builder-publish gate closes, and every publish LocalResource is
  # pruned — the 0.3.1 incident. So CHECK THE PER-KIND RestDefinitions, never the composition rollup,
  # which stays green while the RDs underneath are broken.
  # Pre-roll baseline, so none of that can be read as vacuous: RestDefinitions 30/30 Ready,
  # Repository `status.default_branch` 24/24, LocalResources Synced 187/187, and PullRequest
  # `.status.merged` present on 0/24 — the last is the one that must RISE.
  kind: GithubProviderKog
