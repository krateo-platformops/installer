  # literally, so a reworded comment or two reordered YAML keys re-proposed a suggestion already open,
  # while `superseded` was reported as a hardcoded 0 beside a docstring describing a mechanism that did
  # not exist; YAML is now compared as parsed data with mappings sorted, and a same-target
