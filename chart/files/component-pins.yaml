  # 0.1.7: STOPS ASKING AN ORCHESTRATOR TO DO THE REVIEW, and that is why krateo-autopilot leaves the
  # dep list below. `autopilot` carries twelve tools of which NINE are sibling agents, so delegation is
  # its declared capability list, not a behaviour a system prompt can suppress: the 02:00 run on
  # 2026-09-26 handed the review to incident-agent at 02:04:15 and that agent was still calling tools at
  # 03:32, an hour after the client had given up, and the run Failed at 42m49s with nothing to show.
  # The chart now creates its OWN reviewer, `nightly-review-agent`, holding a model and NO tools —
  # which is all a review needs, because evidence.py gathers everything in code BEFORE the agent is
  # called. A reviewer with no tools cannot delegate, cannot wander, and cannot reach a repository.
  # Checked against this cluster rather than assumed: tk-swarm-ro runs today with zero tools, is Ready,
  # and gets its own Deployment and Service on :8080, so kagent already supports the shape.
  # Second defect in the same release: A2A_TIMEOUT was passed to requests alongside stream=True, where
  # it bounds SILENCE BETWEEN READS rather than duration — the runaway task never went quiet, so a
  # 900s budget never fired. It is now the total wall-clock budget, with A2A_READ_TIMEOUT (180s) for
  # silence, and on expiry the client stops READING rather than trying to stop the agent, so the
  # session stays inspectable while the run gets its window back.
  # 0.1.8: THREE CHECKS THAT REPORTED SOMETHING OTHER THAN WHAT THEY MEASURED, each fixed against a
