components:
- name: authn-crd
  kind: AuthnCrds
  chart: authn-crds
  version: 0.26.0
  tier: platform
  feature: portal
- name: oasgen-provider-crd
  kind: OasgenProviderCrds
  chart: oasgen-provider-crds
  version: 0.20.0
  tier: platform
  feature: oasgenProvider
- name: frontend-crd
  kind: FrontendCrds
  chart: frontend-crds
  version: 1.4.0
  tier: platform
  feature: portal
- name: snowplow-crd
  kind: SnowplowCrds
  chart: snowplow-crds
  version: 1.9.0
  tier: platform
  feature: portal
- name: authn
  kind: Authn
  chart: authn
  version: 0.26.0
  deps:
  - authn-crd
  tier: platform
  feature: portal
  expose: true
  exposePort: 8082
  svcMatch: authn
  configKeys:
  - AUTHN_API_BASE_URL
- name: snowplow
  kind: Snowplow
  chart: snowplow
  version: 1.9.0
  deps:
  - snowplow-crd
  - authn
  tier: platform
  feature: portal
  expose: true
  exposePort: 8081
  svcMatch: snowplow
  configKeys:
  - SNOWPLOW_API_BASE_URL
  frontendConfigEnv: FRONTEND_CONFIG_CONFIGMAP
- name: frontend
  kind: Frontend
  chart: frontend
  version: 1.4.3
  deps:
  - frontend-crd
  - authn
  - snowplow
  tier: platform
  feature: portal
  expose: true
  exposePort: 8080
  svcMatch: frontend
  consumer: true
- name: portal
  kind: Portal
  version: 1.6.0
  deps:
  - frontend
  tier: platform
  feature: portal
  chart: portal
- name: krateo-helm-render-service
  kind: KrateoHelmRenderService
  version: 0.3.0
  tier: platform
  feature: portal
  chart: krateo-helm-render-service
- name: oasgen-provider
  kind: OasgenProvider
  chart: oasgen-provider
  version: 0.20.0
  deps:
  - oasgen-provider-crd
  tier: platform
  feature: oasgenProvider
# ---- agents (PRIVATE krateo-agentiko registry) ----------------------------------------
# Every agent chart lives in the private krateo-agentiko/charts OCI registry (repo override
# below), so pulling them needs registryAuth.enabled=true + a read:packages credential
# (the license, model A). kagent stays ClusterIP: the frontend nginx `/autopilot/` proxies
# to the kagent-ui Service in-cluster, so the Autopilot toggle works without an external LB.
# Kinds are crdgen PascalCase(chart name): the 5 specialists dropped the krateo- prefix in the
# migration, so authn-agent -> AuthnAgent (NOT KrateoAuthnAgent). vertexAI:true injects
# .Values.vertexAI; modelOwner (autopilot) owns the shared ModelConfigs and auto-derives its
# extraAgents fleet from every feature-enabled vertexAI agent.
- name: kagent-crds
  kind: KagentCrds
  version: 0.1.3
  repo: oci://ghcr.io/krateo-agentiko/charts
  tier: observability
  feature: coreAgents
- name: kagent
  kind: Kagent
  version: 0.1.7
  repo: oci://ghcr.io/krateo-agentiko/charts
  deps:
  - kagent-crds
  tier: observability
  feature: coreAgents
- name: fetch-mcp-server
  kind: FetchMcpServer
  version: 0.1.1
  repo: oci://ghcr.io/krateo-agentiko/charts
  deps:
  - kagent
  tier: observability
  feature: coreAgents
- name: krateo-autopilot
  kind: KrateoAutopilot
  version: 0.1.53
  repo: oci://ghcr.io/krateo-agentiko/charts
  deps:
  - kagent
  tier: observability
  feature: coreAgents
  vertexAI: true
  modelOwner: true
- name: clickhouse-mcp-server
  kind: ClickhouseMcpServer
  version: 0.1.8
  repo: oci://ghcr.io/krateo-agentiko/charts
  deps:
  - kagent
  tier: observability
  feature: specialistAgents
- name: authn-agent
  kind: AuthnAgent
  version: 0.22.24
  repo: oci://ghcr.io/krateo-agentiko/charts
  deps:
  - kagent
  tier: observability
  feature: specialistAgents
  vertexAI: true
- name: snowplow-agent
  kind: SnowplowAgent
  version: 1.0.89
  repo: oci://ghcr.io/krateo-agentiko/charts
  deps:
  - kagent
  tier: observability
  feature: specialistAgents
  vertexAI: true
- name: frontend-agent
  kind: FrontendAgent
  version: 1.3.96
  repo: oci://ghcr.io/krateo-agentiko/charts
  deps:
  - kagent
  tier: observability
  feature: specialistAgents
  vertexAI: true
  requireApproval: []
- name: clickstack-agent
  kind: ClickstackAgent
  version: 3.0.34
  repo: oci://ghcr.io/krateo-agentiko/charts
  deps:
  - kagent
  tier: observability
  feature: specialistAgents
  vertexAI: true
- name: core-provider-agent
  kind: CoreProviderAgent
  version: 0.53.16
  repo: oci://ghcr.io/krateo-agentiko/charts
  deps:
  - kagent
  tier: observability
  feature: specialistAgents
  vertexAI: true
