# ---- agent gateway (OPT-IN, feature: agentGateway — default OFF) -----------------------
# JWT authentication + per-user RBAC over the agents, their MCP tools and A2A delegation.
# Two components because helm maps every kind in a manifest before applying any of it, so the
# release shipping the Gateway API CRDs can carry no Gateway API resource: the control plane
# (CRDs + agentgateway controller) installs first, the Gateway/routes/policies dep-chain behind
# it. Both are krateo-agentiko charts (private registry, like the agent charts).
# The policies chart deps stop at the substrate — depending on the agents themselves would stall
# it on any profile where one of them is absent. Every rule and every default is the chart's own:
# componentValues.agentgateway-policies.
- name: agentgateway-controller
  kind: AgentgatewayController
  version: 0.2.0
  repo: oci://ghcr.io/krateo-agentiko/charts
  tier: platform
  feature: agentGateway
- name: agentgateway-policies
  kind: AgentgatewayPolicies
  # 0.1.23 added gateway.internalDataPlane (default false, off => byte-identical). 0.1.24 moves it to a
  # TWO-GATEWAY design (#114): when gateway.internalDataPlane is set the chart flips the PRIMARY
  # controller-provisioned proxy Service (krateo-agent-gateway) to ClusterIP — so the agent data plane
  # (:8080 — /llm/v1, /mcp, A2A) has no external path — and renders a SEPARATE platform Gateway
  # (krateo-agent-gateway-platform) as a LoadBalancer carrying ONLY the platform listeners
  # (portal :443/:80 + HyperDX :3000). No static IP anywhere: the platform LoadBalancer takes a
  # cloud-assigned address (loadBalancerIP dropped). Driven by exposure.internalDataPlane via
  # compositions.yaml (which also points the portal/HyperDX browser origins at the -platform Service).
  # Inert unless that knob is set.
  # 0.1.25 consumes gateway.mcpBackendHash: the installer computes a hash of every MCP-backend
  # component's <name>:<version> (compositions.yaml) and forcePaths it here; the chart stamps it on the
  # proxy pod template so the proxy pod ROLLS whenever an MCP-server version changes. Fixes a prod
  # outage — rolling an MCP server rolls its own pod but the controller flips the proxy Service in
  # place, leaving the proxy on a STALE backend. Absent/empty hash => byte-identical.
  # 0.1.27 adds gateway.platformHostname (#115): when set (installer forcePaths exposure.tls.host), the
  # platform Gateway's LoadBalancer Service is annotated external-dns.alpha.kubernetes.io/hostname, so a
  # deployed external-dns keeps the portal's DNS record following the LB IP (DNS-follows-LB, no static IP).
  # 0.2.2 (#44): cert-replay-hop JWKS_URL now includes authn's :8082 port — without it the JWKS fetch hit
  # :80, timed out, and every per-user-RBAC hop request 503'd (ErrKeyUnavailable), breaking all Autopilot
  # k8s tool calls the moment perUserRbac was activated on 057; also logs that 503 (was silent).
  # 0.2.3 (#46): ADDITIVE — registers krateo-blueprint-agent + its chart gate at the gateway (was missing
  # entirely: 0 of 31 HTTPRoutes / 29 policies referenced it). Renders 8 new objects (subagent HTTPRoute +
  # authz Allow/passthrough/resiliency-a2a; chart-gate Backend/HTTPRoute/NetworkPolicy/resiliency-mcp) so
  # autopilot's delegation to krateo-blueprint-agent stops 403ing at the agent-card hop + the agent enters
  # NetworkPolicy containment. Nothing existing modified. NOTE: bumping this proxy chart rolls the
  # krateo-agent-gateway proxy pod → strands gateway-routed agents' MCP sessions → rollout restart the
  # fleet after (roll-guard mcpHash does NOT cover agentgateway-policies itself).
  # 0.2.4 (#49) adds uiTokenHop — the kagent dashboard's authenticating front door — and its paired
  # networkPolicy.ui. BOTH DEFAULT OFF, so this bump is byte-identical until one is switched on.
  # kagent-controller runs trusted-proxy (it only DECODES the bearer; an alg:none token with any sub
  # is accepted) and kagent-ui sends no bearer at all, so the dashboard 401s with or WITHOUT the
  # containment policies — allowUi was therefore a bypass that did not fix it. The hop exchanges its
  # own audience-bound projected SA token at authn for a real RS256 Krateo JWT, drops whatever the
  # client sent, and routes /api through the gateway where the signature is actually verified;
  # networkPolicy.ui then makes the hop the ONLY way into kagent-ui, which also closes the frontend
  # IMAGE's unconditional /autopilot/ proxy as a tokenless route to the controller. allowUi stays false.
  # Enabling uiTokenHop also makes compositions.yaml inject componentValues.kagent.kagentapp.ui
  # .backendInternalUrl (the gateway): the dashboard fetches through Next.js SERVER ACTIONS that run
  # inside the UI pod and dial that URL, so without it the UI loads and then fails every action with
  # "fetch failed". Same proxy-pod roll caveat as 0.2.3.
  version: 0.2.4
  repo: oci://ghcr.io/krateo-agentiko/charts
  deps:
  - agentgateway-controller
  tier: platform
  feature: agentGateway
  # The portal's Autopilot rail calls an agent's A2A endpoint straight from the browser, so the
  # gateway needs a BROWSER-reachable address like authn/snowplow/sse-proxy do. svcMatch is the
  # proxy Service the agentgateway controller provisions for the Gateway (named after it, so this
  # tracks componentValues.agentgateway-policies.gateway.name if that is overridden).
  expose: true
  # The agentgateway controller — not this chart — creates the proxy Service, so there is no values
  # key to flip to exposure.type (and the chart's schema would reject one); compositions.yaml skips
  # the service-flip for this component by name instead of a pin field, so it never needs its own
  # entry in values.schema.json's components[] schema (and the generated Installer CRD). Exposure
  # still READS the live Service. It is a LoadBalancer by default, so it resolves on any cluster
  # that has an LB controller; elsewhere pin componentValues.frontend.config.AUTOPILOT_API_BASE_URL
  # to a reachable origin.
  exposePort: 8080
  svcMatch: krateo-agent-gateway
  # The frontend gets this as the gateway's ORIGIN; its own chart appends the A2A path for the
  # namespace the agents live in (agentgateway.enabled).
  configKeys:
  - AUTOPILOT_API_BASE_URL
  # jwt.jwks.port is the port of the authn Service the gateway fetches JWKS from to verify agent
  # tokens (chart-default 8082). exposure.port collapses authn to the shared port, so the gateway
  # would fetch from a dead port and reject EVERY token ("unknown key krateo-authn-key-1"). Port-only
  # sibling of internalUrls: compositions.yaml sets this to exposure.port when it is set.
  internalPorts:
  - path: jwt.jwks.port
# ---- krateo-blueprint-agent (a CORE agent) ---------------------------------------------
# The blueprint-authoring agent: PROMOTED from the (now-retired) codegen group to coreAgents in
# #144 — "it is a core agent". Deploys with the base agent layer (kagent + the model-configs-owned
# ModelConfigs) and joins the autopilot fleet as an A2A sub-agent. Its chart bundles the
# krateo-chart-gate-mcp-server (render-and-validate gate) whose image ships from the SAME release
# tag, so the pin version must name a chart whose gate image is published: 0.2.7 (fix #9 unblocked
# the promotion + a clean tag builds the image); 0.2.3/0.2.6 are pre-fix (0.2.6's gate image is
# `manifest unknown`). Kind is crdgen PascalCase(chart).
# (The four codegen/conversion specialists code-analysis / ansible-to-operator / tf-provider-to-
# operator / tf-to-helm were RETIRED in #144; features.codegenAgents is kept hard-defaulted false.)
- name: krateo-blueprint-agent
  kind: KrateoBlueprintAgent
  version: 0.2.9
  repo: oci://ghcr.io/krateo-agentiko/charts
  deps:
  - kagent
  tier: observability
  feature: coreAgents
  agent: true
