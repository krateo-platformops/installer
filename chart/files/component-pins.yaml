  # 1.5.4 (frontend-agent#17): PROMPT ONLY. Chart-diffed against 1.5.3 — only Chart.yaml and
  #   files/prompts-eng.yaml differ (+74/-33); no template, tool or model change.
  #   Fixes the failure that blocked PB V2 twice on autopilot 0.6.7: the agent emitted a Flex carrying
  #   spec.allowedResources at the TOP LEVEL, which validation rejected. Verified against the LIVE
  #   CRDs: across all 44 served widget kinds, allowedResources exists at
  #   spec.widgetData.allowedResources on 14 kinds and at spec top level on ZERO.
  #   WHY THE REJECTION WAS LUCK, and the reason to keep every builder apply path strict: spec has no
  #   x-kubernetes-preserve-unknown-fields, so under a structural schema an unknown
  #   spec.allowedResources is normally PRUNED SILENTLY — giving a Flex that applies cleanly, reports
  #   healthy and renders nothing. The path that hit this applies with strict validation; any path
  #   that does not turns the same mistake into a silent blank widget.
  #   Also in it: lean cold start (no repo research for a fully-specified page), all validations in one
