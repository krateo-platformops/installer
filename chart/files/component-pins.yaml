  # invalidates on CR UPDATE but NOT on delete+recreate-under-the-same-name. Zero of the 7 added names
  # reuse any of the 3 deleted names, and the page root flex.page-portal-builder changes IN PLACE,
  # which fires an UPDATE and evicts correctly.
  #
  # ROLLBACK IS THE TRAP, NOT THE ROLL. Going back to 1.8.38 re-creates Flex/portal-builder-ask-cta,
  # Card/compose-in-ui-card and Paragraph/compose-in-ui-body under IDENTICAL names — precisely the case
  # the cache does not evict — so a rollback must poke krateo.io/cache-poke on flex.page-portal-builder.
  #
  # Expect a brief partial render of /portal-builder while cdc prunes before re-rendering. Self-heals.
  # 1.8.40: CONTENT-ONLY, and genuinely additive-free — 476 -> 476 rendered objects, ZERO added and
  # ZERO removed. Three files: Chart.yaml plus card.your-drafts and paragraph.your-drafts. Unlike
  # 1.8.39 nothing is deleted, so there is no delete+recreate-under-the-same-name risk at all.
  #
  # Two design-system defects, both found by reading the RENDERED PAGE rather than the templates:
  #   P3, say it once — the header reads "Portal Builder (N drafts in progress)" while the section
  #     listing those same drafts was titled "Your unfinished drafts". One set of objects under two
  #     names is worse than a duplicate: the reader has to work out they are the same things. Now
  #     "Drafts in progress", matching the counter.
  #   P17, no implementation vocabulary — "applied to the preview sandbox", "swept on a timer" and
  #     "not wired yet" were our words for the reader's situation. They manage drafts, not sandboxes
  #     and timers. Replaced with what they can act on: a draft survives a closed tab, discarding
  #     removes it, reopening is not possible yet.
  #
  # A THIRD FINDING WAS REVERTED RATHER THAN SHIPPED, and verified here: orientation is still
  # `horizontal` in BOTH 1.8.39 and 1.8.40. The Steps were believed to be cramping; a frame from a
  # screen recording showed they lay out fine and the Ask Autopilot button was simply printed OVER
  # step four's text — fixed in frontend #358, live since 1.6.52. Vertical would have made it worse,
  # since a taller card pushes the button further down.
  #
  # THE DESIGN LINT PASSES CLEAN ON THIS CHART — 0 violations across 477 CRs — and caught none of the
  # three. It checks ten mechanical rules and all three findings sit outside them. "Design lint green"
  # is not "follows the design system", and this pin is the evidence.
  #
  # CACHE NOTE, learned this morning: both changed CRs change IN PLACE, which should fire an UPDATE
  # and evict snowplow's resolved-body cache. But the portal-builder pageheader was ALSO an in-place
  # change that snowplow missed, serving a v1-8-36 body for two releases. If /portal-builder still
  # reads "Your unfinished drafts" after this lands, that is the CACHE and not the roll: poke
  # krateo.io/cache-poke on card.your-drafts rather than re-rolling.
  # 1.8.44: three changes in one release — the publish-chain Register (#246), the palette RESTAction
  # (#247), and S11c, the composition topology (#248). 1.8.41-1.8.43 are contained in it.
  #
  # TWO PRECONDITIONS, BOTH CHECKED ON 057 RATHER THAN TAKEN ON TRUST.
  # (1) S11c reads FlowChart's architecture fields. The live CRD serves widgetData.data[] with state,
  #     detail and exception, required [kind,name,uid] — met by frontend-crd 1.6.62, already rolled.
  # (2) THE RBAC ONE IS THE RISK, and a live `auth can-i` CANNOT answer it before the pin lands: the
  #     v1-8-44 ServiceAccount does not exist yet, and the CURRENT builderpublishes-v1-8-40 SA — which
  #     does exist and runs the live controller — answers `no` to creating configmaps too. The real
  #     instrument is the DERIVED ClusterRole, which today grants configmaps get/list/watch and NO
  #     create, while granting secrets create because the chart renders a Secret. Those rules are
  #     derived from what the chart renders, so 1.8.44's new templates/architecture.yaml (a ConfigMap
  #     per composition, and ungated — the chart's other five templates all sit behind a lookup, this
  #     one does not, so every render path sees it) should widen that rule the same way. VERIFY
  #     ClusterRole/builderpublishes-v1-8-44 grants configmaps create IMMEDIATELY AFTER this lands; if
  #     it does not, every composition's architecture ConfigMap fails to apply and the detail page has
  #     nothing to read. Do not hand-patch the RBAC — that is a chart fix.
  #
  # Helm prunes four objects S3c retired on upgrade: Card author-blueprint-card, Form author-blueprint,
  # Flex blueprint-builder-ask-cta and RESTAction page-composable.
  # 1.8.50 (#254): closes the three known Blueprint Builder bugs. (1) A composition-detail node whose
  # gate is open but which was never created no longer reads "waits for <a parent that is done>"; it
  # says it was not created and why, carrying the composition's NotSynced exception when that is the
  # cause. (2) blueprint-create no longer fails with `split cannot be applied to: null` before
  # core-provider has generated the kind — it reports that the blueprint is still being registered.
  # Measured on 057 BEFORE this roll, so the fix is checkable after it: that defect produced 48
  # malformed-path 401s in 30 minutes on snowplow's prewarm path (logged with the template error
  # sitting in the request path), and nightly-review independently counted 8,459 observations
  # overnight. (3) CI now validates every resolved Form in test-builder-install against the released
  # Form CRD, which caught a null stringSchema fixed in the same release.
  # 1.8.51 (#255): fixes the marketplace-detail filter. The prewarm resolves that RESTAction with no
  # ?extras.name, so its own `.name` is null and `.entries[$n]` fails — gojq renders that identically
  # to a null key in from_entries, which is why the log text alone could not localise it (jq says
  # "Cannot index object with null"). An absent name is now found:false, nameless compdef entries are
  # dropped defensively, and a named resolve is unchanged. Five widgets were failing: the four
  # marketplace-detail-* and blueprint-install-page-header. Baseline before this roll, so it is
  # checkable after: 336 occurrences per 30 minutes on 1.8.50, all with an empty traceId (prewarm
  # path only, nothing user-facing). Confirmed NOT a snowplow cache artifact — they survived a cold
  # cache when snowplow 1.12.16 replaced the pod.
  # 1.8.52 (#256): adds the RESTAction blueprint-render-draft, and supersedes 1.8.51 (which it
  # contains, marketplace-detail filter fix included). Preview used to send the WHOLE chart in
  # blueprint-render's ?extras on a GET, and the gateway refuses HTTP/2 requests whose headers exceed
  # 16 KB — core-provider-agent's 12.4 KB chart becomes 20.3 KB of URL, so Preview 431'd on any
  # realistic chart. The draft is now written to krateo-preview as one ConfigMap, POSTed in a body as
  # the user, rendered BY NAME through this RA, and deleted as soon as the render answers.
  # 1.8.53 (#257): STEP 2 of the ordered pair — frontend-crd 1.6.75 had to be live first, and was,
  # confirmed not by reading the pin but by writing itemTemplate.rowActionsDisplay to a probe Listy on
  # 057 and reading the value back. That distinction matters: the field's path is structural, so under
  # the old CRD the apply SUCCEEDS with the field pruned — a read-back is the only check that separates
  # 'served' from 'silently dropped'.
  # Adds the RESTActions my-drafts and unowned-drafts plus Listy lists on /blueprint-builder and
  # /portal-builder, and REMOVES restaction.preview-drafts, table.preview-drafts, card.your-drafts and
  # paragraph.your-drafts, which helm prunes on upgrade.
  # The 229 legacy sandbox objects are NOT touched: they appear as 'Unowned drafts' with Adopt and
  # Discard. Nothing is deleted by this roll.
  # 1.8.55 (#258): the Platform Review — /reviews with Proposals and Runs tabs, admin-tier detail routes,
  # 70 review templates and the decision forms. Reject and 'record as change request open' write
  # spec.decision with the caller's token.
  # STEP 2 of an ordered pair. nightly-review-crd 0.1.23 had to serve spec.decision first, and did —
  # proven by WRITING a probe Proposal with spec.decision and reading it back, not by comparing pins,
  # because spec is structural and a prune returns 200. Against the old CRD a Reject would have been
  # reported by the page and never recorded by the cluster.
  # The probe also proved the MutatingAdmissionPolicy is live and unspoofable: decidedBy was written as
  # 'probe-user' and came back stamped with the real authenticated identity, with decidedAt added.
  # Effective phase is decision-first (only Merged status overrides), actions are gated by phase
  # (Proposed both, PrOpen reject-only, otherwise none), and Reject's reason is optional.
  # 1.8.56 (#259): fixes AT THE SOURCE the malformed-dial class I measured on 057 — 19 RestActions that
  # built an apiserver path by concatenating a `//` fallback and then dialled it. snowplow 1.12.21 has no
  # step `condition`, so the fix is a dependsOn.iterator that returns [] when the input is missing, which
  # means THE STEP DOES NOT RUN rather than running against a placeholder. That is the right shape and
  # the only one that works for the sentinel case: changing the fallback string would just move the 404.
  #   review-proposal      `(.name // "")`      -> /…/builderpublishes/review-        measured x601/20min
  #   blueprint-detail     sentinel fake GVR    -> /apis/none.krateo.io/v1/none       measured x358/20min
  #   composition-arch.    empty ns + suffix    -> /api/v1/namespaces//configmaps/-…  measured x67/20min
  # Root causes per the author: review-proposal was the phase-1 prewarm resolving with extras=nil
  # (phase1_walk.go:1610); blueprint-detail/comps had NO dependsOn at all and RACED compdef on map order
  # (sort.go:28) — that race, not a missing value, is why the sentinel fired.
  # WHY THIS PIN AND snowplow 1.12.22's #288 GUARD ARE NOT REDUNDANT, and the measurement that proved it:
  # the guard rejects DNS-invalid path segments, so it closes the review- and -architecture shapes but
  # CANNOT close the sentinel — `none.krateo.io/v1` and `none` are valid DNS-1123, and snowplow must not
  # refuse them, because it cannot tell a deliberate fake GVR from a legitimate one not yet discovered
  # (the pre-CRD case it correctly dials and retries). Measured on 1.12.22 BEFORE this pin, 45-minute
  # window: review- 0, -architecture 0, none.krateo.io STILL 95. Exactly as predicted, and the 95 also
  # served as the positive control proving the log was not merely quiet. This pin closes the third.
  # TWO BEHAVIOUR CHANGES TO KNOW:
  #  (a) composition-detail/-editdef/-events/-resources `found` read `/namespaces//<plural>`, i.e. an
  #      ALL-NAMESPACES list, so the #72/#74 scoping never applied. Now truly namespaced, same output,
  #      needs strictly less privilege. NOTE it is NOT a chart-RBAC change — #259 touches no Role, and
  #      portal grants users nothing here; the list ran under the CALLER's rights. So on 057, where
  #      admins are cluster-admin, it worked before and works after: 057 CANNOT demonstrate this fix.
  #      Its real effect is on installs where users are not cluster-admin, where that step was 403ing all
  #      along and continueOnError hid it — i.e. this is likely a functional fix for those installs, not
  #      a privilege reduction for this one.
  #  (b) resource-detail `object` now runs after `disco`, and alert-editdef DEGRADES with "The Alert
  #      schema could not be read" instead of failing the resolve. Verify (b) by finding that STRING: a
  #      resolve that no longer fails is indistinguishable from one that was never exercised.
  # Also: portal now ships scripts/lint-ra-paths.py, so this class has a lint rather than only a fix.
  # 1.8.57 (#260): FIXES A LIVE USER-FACING REGRESSION THAT 1.8.56 INTRODUCED AND THAT I ROLLED AND
  # "VERIFIED" AS 0.3.333. Every composition detail page resolved nothing — "composition · Unknown",
  # empty architecture — for any caller able to list cluster-wide, i.e. admins. Measured by the author
  # over real 057 data: 1 of 44 compositions resolving before, 44 of 44 after.
  # THE MECHANISM, and it is a good trap to know: 1.8.56 made composition-detail, -editdef, -events and
  # -resources fan out `found` as PER-NAMESPACE LISTs over 46 kinds. snowplow's cluster-list collapse
  # (resolvers/restactions/api/cluster_list.go:156, GVR taken from the FIRST element only at :664)
  # replaces an iterator of namespaced lists with ONE cluster list of the first element's kind, for a
  # caller allowed to list it cluster-wide. So every other kind went unread. A CLUSTER-SCOPE path is not
  # collapsed (:715), which is the fix: one cluster-scope list per kind, plus a userAccessFilter so a
  # namespace-scoped tenant still resolves only its own (#72). The snowplow side is filed as #351, and
  # the author confirms per-kind cluster-scope is the right shape REGARDLESS of #351 — portal's README
  # now forbids fanning out per-namespace LISTs over different kinds, so nobody reverts it later.
  # MY VERIFICATION FAILURE, recorded because the lesson outlives the bug: on 0.3.333 I flagged this very
  # behaviour change and concluded "057 CANNOT demonstrate this fix; it worked before and works after."
  # Wrong in the worst direction — on 057 it worked before and BROKE after, for exactly the
  # cluster-wide-capable callers I said were unaffected. I verified that the INTENDED fix landed (the
  # sentinel dials went 352 -> 0 on the same pod either side of the content landing) and never checked
  # that anything else still worked. CONFIRMING A FIX AND CONFIRMING NO REGRESSION ARE DIFFERENT TESTS.
  # For a change touching the four RestActions that serve the composition pages, "does a composition page
  # still resolve" was the obvious second test. The author's 1.8.56 test had the same gap: it asserted the
  # requests were BUILT; 1.8.57's asserts the composition RESOLVES.
  # KNOWN COST, accepted: the userAccessFilter puts these four high-traffic RestActions into the
  # UAF-declaring set, so snowplow DECLINES their L1 puts — the cache key does not fold UAF scope until
  # v7/1.13.0. The widgets carrier of that decline already runs ~10,100/hour on 057. So the composition
  # pages are now UNCACHED, correctness over cache, and the author has noted it on #351 so the
  # decline-rate rise is not later read as a regression.
  # Rolled INSIDE an agreed benchmark hold, on Diego's direct go, after telling the benchmark owner first
  # — a live user-facing regression outranks a baseline that can be re-run. Confirmed with them that the
  # run only builds pages in /portal-builder and never touches these four RestActions, so it is not
  # perturbed. Content-only: no snowplow restart.
  # Chart diff is Chart.yaml plus exactly those four restaction templates; userAccessFilter occurrences in
  # composition-detail go 3 -> 5.
  # 1.8.64 (#244, #289): the incident pages read Incidents (header chip, the three scripts with their
  # last exit codes, Close, check history from status.checks), and an alert's page gains Pause and
  # Resume (krateo.io/paused). Its RESTActions read the Incident CRD, which incident-controller-crd
  # installs.
  # 1.8.67: an incident whose fix is only a script gets Run apply (creates an IncidentApply as the
  # clicking user; incident-controller runs the apply script with that user's own rights) and an
  # Apply runs tab. Needs incident-controller 0.2.0 for the IncidentApply CRD; without it the button
  # stays hidden.
  version: 1.8.67
  deps:
  - frontend
  - git-provider
  tier: platform
  feature: portal
  chart: portal
  # Portal is an outlier: it renders hundreds of managed children (RBAC across krateo-system +
  # demo-system, widgets, templates, CRDs), so its per-Kind CDC controller peaks well above the
  # shared 256Mi cdc.resources default and gets OOMKilled on the cold reconcile — an incomplete
  # create then loops on the external-create handshake and the composition never goes Ready.
  # Override just this controller's memory via the CompositionDefinition spec.resources (requests
  # unchanged, so no scheduling impact); other controllers keep the small default.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi

# The agent control plane — /agents, agent detail, agent policies — as its own composition.
# SPLIT OUT FOR A HARD REASON, not tidiness: a Helm release record is ONE Kubernetes Secret and a
# Secret's data is capped at 1 MiB by a compiled-in constant. The portal crossed it on 2026-09-11
# and silently stopped recording releases for three days — CDC applies content BEFORE writing the
# record, so the cluster stayed correct while helm history froze and every rollback target aged out.
# Comment conversion (portal 1.8.15) recovered headroom only to 91.5%, and one feature section has
# historically cost ~18% of the cap. Splitting changes the SLOPE: each composition gets its own
# budget, so one section can no longer spend the whole portal's. Measured: portal 91.5% -> 61.9%,
# portal-agents 30.9%.
#
# deps: [portal] is the ordering, and it matters. Those 108 CRs belong to the PORTAL release today;
# the portal chart that drops them must land FIRST so Helm deletes them, and portal-agents then
# recreates them under its own release. The reverse order leaves the same objects claimed by two
# releases. The portal's agents.enabled flag (below, componentValues) defaults FALSE in the chart,
# so during the gap the sidebar entry is HIDDEN rather than pointing at pages that 404 — a clean
# disappearance instead of a broken link.
  # 1.8.45: co-versioned with portal, as always.
  # 1.8.46: co-versioned with portal, as always.
  # 1.8.47: co-versioned with portal, as always.
  # 1.8.48: co-versioned with portal, as always.
  # 1.8.49: co-versioned with portal, as always.
- name: portal-agents
  # 1.8.65: co-versioned with portal, as always — one tag, every chart under helm/.
  # 1.8.63: co-versioned with portal, as always — one tag, every chart under helm/ (builder-publish
  # also publishes at 1.8.63 but is registered by the portal chart, not pinned here).
  # 1.8.62: co-versioned with portal, as always — one tag, every chart under helm/. Carries none of
  # #283; it moves only to keep the pair equal.
  kind: PortalAgents
  # MUST equal the portal tag that ships the split: release-oci versions every chart under helm/
  # from the same tag, so portal and portal-agents always carry the SAME version. 1.8.19 is the
  # next tag; if the split lands on a different one, this and the portal pin move together.
  # 1.8.37: co-versioned with portal, as always.
  # 1.8.38: co-versioned with portal, as always.
  # 1.8.39: co-versioned with portal; content-only, no CRD change, no image.
  # 1.8.40: co-versioned with portal; content-only, no CRD change, no image.
  # 1.8.44: co-versioned with portal, as always.
  # 1.8.50: co-versioned with portal, as always. Verified byte-identical to 1.8.49 outside Chart.yaml.
  # 1.8.51: co-versioned with portal, as always. Verified byte-identical to 1.8.50 outside Chart.yaml.
  # 1.8.52: co-versioned with portal, as always. Verified byte-identical to 1.8.51 outside Chart.yaml.
  # 1.8.53: co-versioned with portal, as always. Verified byte-identical to 1.8.52 outside Chart.yaml.
  # 1.8.55: co-versioned with portal. Verified byte-identical to 1.8.54 outside Chart.yaml.
