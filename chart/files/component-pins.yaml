components:
- name: authn-crd
  kind: AuthnCrds
  chart: authn-crds
  version: 0.27.2
  tier: platform
  feature: portal
- name: oasgen-provider-crd
  kind: OasgenProviderCrds
  chart: oasgen-provider-crds
  # 0.23.0 (bumped in lockstep with oasgen-provider): additive RestDefinition schema only — the
  # compareScope `updatable` enum (CEL-guarded to an update verb) + a corrected oasPath/JQ ref
  # pattern. RestDefinition stays v1alpha1 served+storage (no conversion webhook); crds MUST match
  # the provider or the apiserver rejects compareScope:updatable at admission.
  version: 0.23.0
  tier: platform
  feature: oasgenProvider
- name: frontend-crd
  kind: FrontendCrds
  chart: frontend-crds
  version: 1.5.21
  tier: platform
  feature: portal
- name: snowplow-crd
  kind: SnowplowCrds
  chart: snowplow-crds
  version: 1.12.3
  tier: platform
  feature: portal
- name: authn
  kind: Authn
  chart: authn
  # 0.27.3 (#29): AUTHN_KUBECONFIG_SERVER_URL default kube-apiserver:6443 -> kubernetes.default.svc.
  # The old kubeadm-style placeholder was written verbatim into every <user>-clientconfig server-url
  # (unreachable NXDOMAIN on GKE, wrong port), breaking the cert-replay per-user RBAC hop. Users must
  # re-login after this rolls so authn re-issues the clientconfig with the corrected server-url.
  version: 0.27.3
  deps:
  - authn-crd
  tier: platform
  feature: portal
  expose: true
  exposePort: 8082
  nodePort: 31001   # pinned deterministic NodePort (host-mappable) for exposure.type=NodePort
  svcMatch: authn
  configKeys:
  - AUTHN_API_BASE_URL
  # exposure.type=Gateway, gatewayMode=path: this component is routed through the agentgateway on the
  # single platform listener at gatewayPath (compositions.yaml emits it into agentgateway-policies'
  # spec.platformRoutes). gatewayRewrite strips the path prefix before forwarding to the backend
  # (authn serves at /, so the /auth prefix must be rewritten away). gatewayAuth is the listener-route
  # auth posture: public = no token required (login endpoints must be reachable unauthenticated).
  gatewayPath: /auth
  gatewayRewrite: true
  gatewayAuth: public
- name: snowplow
  kind: Snowplow
  chart: snowplow
  version: 1.12.3
  deps:
  - snowplow-crd
  - authn
  tier: platform
  feature: portal
  expose: true
  exposePort: 8081
  nodePort: 31002   # pinned deterministic NodePort (host-mappable) for exposure.type=NodePort
  svcMatch: snowplow
  configKeys:
  - SNOWPLOW_API_BASE_URL
  # exposure.type=Gateway, gatewayMode=path: snowplow's content API is routed at /content and the
  # prefix is rewritten away (snowplow serves at /). optional = a token is verified WHEN PRESENT but
  # not required, so anonymous portal content reads still work while an authenticated caller is
  # identified (matches snowplow's own optional-auth content posture).
  gatewayPath: /content
  gatewayRewrite: true
  gatewayAuth: optional
  frontendConfigEnv: FRONTEND_CONFIG_CONFIGMAP
  # Internal (ClusterIP, server-to-server) URLs the snowplow chart hardcodes at the per-component
  # default ports (env.URL_SELF=snowplow:8081, env.URL_AUTHN=authn:8082) for the #57 seed->authn
  # loopback-token exchange (and the JWKS fetch derived from URL_AUTHN). exposure.port collapses those
  # Services to the shared port, so compositions.yaml recomputes these on exposure.port.
  internalUrls:
  - path: env.URL_SELF
    peer: snowplow
  - path: env.URL_AUTHN
    peer: authn
- name: frontend
  kind: Frontend
  chart: frontend
  # 1.5.27 adds the Autopilot voice/dictation control to the composer, gated ENTIRELY on the config
  # key AUTOPILOT_VOICE_TRANSCRIBE_URL: empty (chart default) => no microphone renders and the composer
  # DOM is byte-identical to 1.5.26; set it (to the HTTPS /stt/v1 route) to turn it on. Dictation also
  # needs a secure context, so on plain-HTTP it stays invisible regardless. Bumping the pin alone is
  # inert; voice goes live only when the CR sets componentValues.frontend.config.AUTOPILOT_VOICE_TRANSCRIBE_URL.
  # 1.5.28 (#119): the publish destination form documents that the target repo must ALREADY EXIST
  # (git-provider clones, it never creates it), and a claim publish now shows a live per-file
  # LocalResource status in the rail (✓/✗ + the git error) instead of a silent hang; also activates
  # the #163 per-artifact blueprint targeting (krateo-blueprints/<chart>). All UI-only, default-inert.
  # 1.5.30 (#185/#186): #185 fixes the Autopilot publish-destination form opening BEHIND the preview
  # drawer (antd 6 z-index tie → "Confirm destination" unreachable, publish uncompletable) + the
  # remembered-destination global-slot bug (a page publish inheriting the KOG repo). #186 makes voice
  # input conversational (spoken turn + spoken answer, both in the transcript) + fixes Escape. SPA-only,
  # no CRD/widget-schema change → frontend-crd pin stays (1.5.30 frontend-crds published only because one
  # tag publishes all of helm/). Schema image.* defaults verified krateo-platformops/frontend (no braghettos trap).
  version: 1.5.30
  deps:
  - frontend-crd
  - authn
  - snowplow
  tier: platform
  feature: portal
  expose: true
  exposePort: 8080
  nodePort: 31000   # pinned deterministic NodePort (host-mappable) for exposure.type=NodePort
  svcMatch: frontend
  consumer: true
  # exposure.type=Gateway, gatewayMode=path: the frontend (the portal SPA) is served at the gateway
  # ORIGIN, so its gatewayPath is `/` and there is nothing to rewrite (gatewayRewrite:false). public =
  # the SPA and its static assets load with no token. The portal is the catch-all; the other routes
  # (/auth, /content, /events) are more-specific prefixes the agentgateway matches first.
  gatewayPath: /
  gatewayRewrite: false
  gatewayAuth: public
- name: krateo-marketplace-catalog
  kind: KrateoMarketplaceCatalog
  version: 0.1.2
  repo: oci://ghcr.io/krateo-blueprints/charts
  tier: platform
  feature: portal
  # The marketplace catalog: a tiny composition (no deps) whose chart renders ConfigMap
  # blueprints-catalog-index (the curated blueprint+operator indexes as JSON). The portal reads it
  # in-cluster (marketplace.source=configmap, the portal chart default) instead of an external Pages
  # fetch. NOT a portal dep — the portal reads the ConfigMap with continueOnError, so the catalog pull
  # never gates portal availability (a missing ConfigMap = an empty marketplace that self-heals when
  # the catalog installs). Pulled from the public krateo-blueprints /charts base (no registryAuth).
# The classic Krateo git-provider controller (reconciles git.krateo.io Repo + LocalResource CRs),
# made composition-ready in 0.14.1 (values.schema.json added so crdgen derives the GitProvider CRD).
# Mandatory with the portal feature and ordered BEFORE portal (portal deps it), so the SCM controller +
# its git.krateo.io CRDs (esp. LocalResource) are present before portal registers the builder-publish
# composition that applies them. The SCM-publish CONSUMER is builder-publish (co-released WITH portal, chart
# charts/builder-publish:{{portal version}}, registered by the portal chart — NOT a separate installer pin).
# SCM publishing to github.com needs NO installer wiring: builder-publish's chart defaults already point at
# git.host=github.com with authMethod=bearer and secretRef=git-provider-credentials (key: token). The ONE
# PRECONDITION is operational (like external-dns's provider-cred secret): the operator places the
# git-provider-credentials Secret (key: token = a GitHub PAT with repo push scope) in the release namespace
# out-of-band; until it exists the branch push fails even though every CR applies. A non-github host would
# need a portal->builder-publish git.host passthrough (not present today).
- name: git-provider-crd
  kind: GitProviderCrds
  chart: git-provider-crds
  # 0.15.0 adds status.templatingErrors to LocalResource+Repo — must move in lockstep with the
  # provider (was skewed 0.14.2 vs provider 0.14.1 for 10 days).
  version: 0.15.0
  tier: platform
  feature: portal
- name: git-provider
  kind: GitProvider
  chart: git-provider
  # 0.15.0: #6 bearer auth no longer requires usernameRef (the real fix for the wedged publish
  # LocalResources); #8 BREAKING default templating delims {{ }}->{% %} (fixes {{ toYaml }} in
  # published charts; no-op on 057 — 0/13 LocalResources use placeholdersToOverride, 0 Repo CRs);
  # #9 Repo sync fails on unloadable template values (no Repo CRs on 057). Closes the CRD skew above.
  version: 0.15.0
  deps:
  - git-provider-crd
  tier: platform
  feature: portal
- name: github-provider-kog
  kind: GithubProviderKog
  version: 0.2.2
  repo: oci://ghcr.io/krateo-blueprints/charts
  tier: platform
  feature: portal
  # 28 GitHub RestDefinitions (incl. Repository) — REQUIRED by builder-publish >= 1.8.0 (registered by
  # the portal chart): builder-publish creates the destination repo as a github.krateo.io/Repository CR
  # and gates file-commits on its status.default_branch. Deliberately NOT a portal dep (mirrors
  # krateo-marketplace-catalog): the installer Ready-gates deps (compositions.yaml -> inst.depsReady ->
  # inst.ready requires Ready=True, no existence-only mode), and this composition's aggregate Ready is a
  # FALSE-NEGATIVE while the `team` RestDefinition is stuck in the external-create handshake
  # (oasgen-provider#122, repository kind itself is Ready) — so a portal dep would wedge portal FOREVER
  # on a fresh install. No deps of its own => converges independently; its github.krateo.io CRDs are
  # served before a BuilderPublish claim (publish-time) needs them. Private krateo-blueprints chart =>
  # inherits the default registryAuth creds like marketplace-catalog (no registries[] entry needed).
  # spec.resourceGroup defaults to github.krateo.io in the chart's own values (installer emits spec: {}).
- name: portal
  kind: Portal
  # 1.8.2 (#135): fixes the alert detail page — the alert-detail/alert-editdef RESTActions built the
  # apiserver path with a brace placeholder `{name}` but snowplow only substitutes `${ }` jq exprs, so
  # `/alerts/{namespace}/{name}` was sent literally (empty MANIFEST, "Pending" pill vs real status.state).
  # One portal tag also republishes builder-publish at the same version (charts/builder-publish:1.8.2).
  version: 1.8.2
  deps:
  - frontend
  - git-provider
  tier: platform
  feature: portal
  chart: portal
  # Portal is an outlier: it renders hundreds of managed children (RBAC across krateo-system +
  # demo-system, widgets, templates, CRDs), so its per-Kind CDC controller peaks well above the
  # shared 256Mi cdc.resources default and gets OOMKilled on the cold reconcile — an incomplete
  # create then loops on the external-create handshake and the composition never goes Ready.
  # Override just this controller's memory via the CompositionDefinition spec.resources (requests
  # unchanged, so no scheduling impact); other controllers keep the small default.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi
- name: krateo-helm-render-service
  kind: KrateoHelmRenderService
  version: 0.3.2
  tier: platform
  feature: portal
  chart: krateo-helm-render-service
- name: oasgen-provider
  kind: OasgenProvider
  chart: oasgen-provider
  # 0.23.0 (0.21.1 -> 0.23.0, lockstep with oasgen-provider-crds): resolves the delete-finalizer
  # saga, fixes read-only/findBy resources, and the #113 GitHub-contents double-escape (%252F) 404.
  # Big-version wrapper-CRD jump (OasgenProvider v0-21-1 -> v0-23-0 CDC controllers) — may need a
  # cdc restart + CRD helm-ownership nudge on the live roll. oasgen is idle on 057 (0 RestDefinition
  # CRs), so data-plane blast radius is just this deployment's restart.
  version: 0.23.0
  deps:
  - oasgen-provider-crd
  tier: platform
  feature: oasgenProvider
# ---- observability backend (portal-gated: installs WITH the portal feature) -----------
# ClickStack (ClickHouse + OTel gateway + HyperDX + MongoDB) as compositions. The data-plane
# operators install FIRST (krateo-observability deps them), then the data layer, collectors,
# and sse-proxy (whose EVENTS_* config the frontend events bell consumes). All public
# krateo-platformops/charts (no repo override).
- name: clickhouse-operator
  kind: ClickhouseOperator
  version: 0.1.1
  tier: observability
  feature: portal
- name: mongodb-operator
  kind: MongodbOperator
  version: 0.2.0
  tier: observability
  feature: portal
- name: krateo-observability
  kind: KrateoObservability
  version: 0.1.14
  deps:
  - clickhouse-operator
  - mongodb-operator
  tier: observability
  feature: portal
  # HyperDX behind the agentgateway in Gateway path mode (#100). Unlike the portal APIs
  # (authn/snowplow/sse-proxy) which share the :80 platform-http listener under a /path, HyperDX is a
  # Next.js root-asset app (hardcoded /_next, /assets) so it CANNOT live under a path prefix — it gets
  # its OWN listener (platform-hdx:3000), a public route at /, no rewrite. svcMatch is the live HyperDX
  # app Service (the clickstack chart's fullnameOverride krateo-clickstack), resolved by inst.svcname for
  # the route backend. gatewayListener/gatewayPort are the FIRST use of a per-component listener: the four
  # portal pins carry neither, so the platformRoutes generator's default-fallbacks keep them on
  # platform-http:$platformPort byte-identically. No expose:true, so no service-flip / host HTTPRoute —
  # HyperDX is reached only through the gateway route. FRONTEND_URL is computed from the gateway :3000
  # origin into clickstack.hyperdx.config (compositions.yaml), replacing the interim 057 override.
  svcMatch: krateo-clickstack
  gatewayPath: /
  gatewayRewrite: false
  gatewayAuth: public
  gatewayListener: platform-hdx
  gatewayPort: 3000
- name: otel-collector-deployment
  kind: OtelCollectorDeployment
  version: 0.3.7
  deps:
  - krateo-observability
  tier: observability
  feature: portal
- name: otel-collector-daemonset
  kind: OtelCollectorDaemonset
  # 0.1.9 (#122): traces pipeline redacts caller JWTs before ClickHouse — drops the
  # http.header.Authorization span attr + strips eyJ… tokens from exception/error/status
  # messages (backstop for the upstream kagent-tools JWT-in-span leak, amplified by per-user RBAC).
  version: 0.1.9
  deps:
  - otel-collector-deployment
  tier: observability
  feature: portal
- name: krateo-sse-proxy
  kind: KrateoSseProxy
  version: 0.1.11
  deps:
  - krateo-observability
  tier: observability
  feature: portal
  expose: true
  exposePort: 8080
  nodePort: 31003   # pinned deterministic NodePort (host-mappable) for exposure.type=NodePort
  svcMatch: sse-proxy
  configKeys:
  - EVENTS_API_BASE_URL
  - EVENTS_PUSH_API_BASE_URL
  # exposure.type=Gateway, gatewayMode=path: the events/notifications SSE stream is routed at /events
  # with the prefix rewritten away (sse-proxy serves at /). optional mirrors sse-proxy's own MANDATORY-
  # by-design token check happening in-app; the gateway passes the token through (a token is verified
  # when present) rather than terminating auth at the edge. NB: an SSE stream needs listener-level
  # long-lived-connection handling — the same single-replica/no-sticky-session caveat as host mode.
  gatewayPath: /events
  gatewayRewrite: true
  gatewayAuth: optional
  # sse-proxy verifies authn JWTs MANDATORY/fail-closed, fetching the JWKS from <auth.urlAuthn>/
  # .well-known/jwks.json (chart-hardcoded authn:8082). exposure.port collapses authn to the shared
  # port, so recompute auth.urlAuthn on it (else the events bell can't verify tokens and breaks).
  internalUrls:
  - path: auth.urlAuthn
    peer: authn
# ---- ingress / edge (OPT-IN, feature: ingress — default OFF) ---------------------------
# The FULL edge as blueprints (everything-is-a-blueprint): the Gateway itself + its CRDs, DNS,
# and certs — so exposure.type=Gateway needs no BYO Gateway. Public krateo-blueprints charts
# (repo override; no credentials), gated on features.ingress so the base install pulls nothing
# from krateo-blueprints unless enabled. Kinds are crdgen PascalCase(chart) — crdgen is
# INITIALISM-AWARE (Go common-initialisms: api->API, dns->DNS; but crds->Crds, NOT CRDS), so:
# gateway-api-crds -> GatewayAPICrds, external-dns -> ExternalDNS, agentgateway -> Agentgateway,
# cert-manager -> CertManager, cert-manager-issuers -> CertManagerIssuers. Pass B's inst.crdExists
# matches spec.names.kind by EXACT string, so a naive PascalCase mispin silently blocks Pass B
# (installer#31; the check-pins CI guard enforces this at PR time).
# DEP-CHAINED so the edge converges in order:
#   gateway-api-crds -> agentgateway -> cert-manager -> cert-manager-issuers -> external-dns
# The Gateway API CRDs must be served before the Gateway; the Gateway (agentgateway 0.4.0 bundles
# its own agentgateway-crds subchart, else the controller never programs it) before the routes;
# cert-manager (operator + CRDs) before cert-manager-issuers (Issuers only) — 0.3.x bundled both in
# ONE release and the cert-manager.io CRDs were not established when the Issuers applied (installer#34,
# blueprint 0.4.0 split them). Pair with exposure.type=Gateway (installer#27). Preconditions:
# external-dns needs its provider-credential Secret placed out-of-band.
# All are public krateo-blueprints charts at 0.4.0 (ingress-blueprint tag 0.4.0).
- name: gateway-api-crds
  kind: GatewayAPICrds
  version: 0.10.0
  repo: oci://ghcr.io/krateo-blueprints/charts
  tier: platform
  feature: ingress
- name: agentgateway
  kind: Agentgateway
  version: 0.10.0
  repo: oci://ghcr.io/krateo-blueprints/charts
  deps:
  - gateway-api-crds
  tier: platform
  feature: ingress
- name: cert-manager
  kind: CertManager
  version: 0.10.0
  repo: oci://ghcr.io/krateo-blueprints/charts
  deps:
  - agentgateway
  tier: platform
  feature: ingress
- name: cert-manager-issuers
  kind: CertManagerIssuers
  version: 0.10.0
  repo: oci://ghcr.io/krateo-blueprints/charts
  deps:
  - cert-manager
  tier: platform
  feature: ingress
- name: external-dns
  kind: ExternalDNS
  version: 0.10.0
  repo: oci://ghcr.io/krateo-blueprints/charts
  # #115: external-dns is STANDALONE on its OWN feature (externalDns), NOT bundled under ingress — so it
  # runs with the agentgateway-controller path (057) without dragging the gateway-api-crds + agentgateway +
  # cert-manager stack. The old deps (agentgateway, cert-manager-issuers) were ingress-ordering, not real
  # deps, and are dropped. A host-mode ingress install that also wants DNS enables BOTH ingress + externalDns.
  tier: platform
  feature: externalDns
# ---- agents (PRIVATE krateo-agentiko registry) ----------------------------------------
# Every agent chart lives in the private krateo-agentiko/charts OCI registry (repo override
# below), so pulling them needs registryAuth.enabled=true + a read:packages credential
# (the license, model A). kagent stays ClusterIP: the frontend nginx `/autopilot/` proxies
# to the kagent-ui Service in-cluster, so the Autopilot toggle works without an external LB.
# Kinds are crdgen PascalCase(chart name): the 5 specialists dropped the krateo- prefix in the
# migration, so authn-agent -> AuthnAgent (NOT KrateoAuthnAgent). agent:true marks the components
# that DEPLOY a kagent Agent — it earns the .Values.vertexAI injection (pod ADC), the HITL gate, the
# gateway wiring and fleet membership; modelOwner (model-configs) owns the shared ModelConfigs every
# agent references by name (WHICH one each agent gets is operator policy, not a pin: values.yaml
# componentValues.<agent>.modelConfig.name); orchestrator (autopilot) auto-derives its extraAgents
# fleet from every feature-enabled agent.
- name: kagent-crds
  kind: KagentCrds
  version: 0.1.5
  repo: oci://ghcr.io/krateo-agentiko/charts
  tier: observability
  feature: coreAgents
- name: kagent
  kind: Kagent
  version: 0.1.17
  mcpBackend: true  # #116 roll-guard: hashed into gateway.mcpBackendHash + every agent rollGuard
  repo: oci://ghcr.io/krateo-agentiko/charts
  deps:
  - kagent-crds
  tier: observability
  feature: coreAgents
- name: model-configs
  kind: ModelConfigs
  version: 0.1.1
  repo: oci://ghcr.io/krateo-agentiko/charts
  deps:
  - kagent
  tier: observability
  feature: coreAgents
  # modelOwner: this component OWNS the fleet's ModelConfigs. Deliberately NOT `agent` — it deploys
  # no kagent Agent, it only renders ModelConfigs. modelOwner earns it the same .vertexAI injection
  # (which selects provider GeminiVertexAI on them) and agentgateway.enabled that agents get, plus
  # the .localModel injection and the LLM-route wiring that are its alone.
  modelOwner: true
- name: installer-agent
  kind: InstallerAgent
  version: 0.2.3
  repo: oci://ghcr.io/krateo-agentiko/charts
  deps:
  - repo-mcp-server
  - kagent
  - model-configs
  tier: observability
  feature: coreAgents
  agent: true
- name: repo-mcp-server
  kind: RepoMcpServer
  version: 0.1.2
  mcpBackend: true  # #116 roll-guard: hashed into gateway.mcpBackendHash + every agent rollGuard
  repo: oci://ghcr.io/krateo-agentiko/charts
  deps:
  - kagent
  # Every grounding agent deps on this, not the reverse: the edge makes the fleet converge in one
  # pass. It is a convergence/log-noise concern, not a correctness cliff — an agent reconciled
  # before this server's RemoteMCPServer CR exists fails its compile LOUDLY (Accepted=False,
  # ReconcileFailed, `RemoteMCPServer.kagent.dev "repo-mcp-server" not found`) and gets no
  # Deployment at all; the kagent Agent controller watches RemoteMCPServer and re-reconciles
  # within a second of the CR appearing, so it self-heals. (kagent v0.9.12,
  # go/core/internal/controller/watch_helpers.go:58-65.)
  tier: observability
  feature: coreAgents
  # features.repoGraph flips graph.enabled -> GRAPH_ENABLED here (server side of the domain-graph
  # lockstep); the consumer agents carry the matching graphToggle onto their repoSearch.graph.enabled.
  graphToggle: graph.enabled
- name: structure-graph-mcp-server
  kind: StructureGraphMcpServer
  version: 0.1.2
  repo: oci://ghcr.io/krateo-agentiko/charts
  deps:
  - kagent
  # Own feature, not coreAgents: both consumers reference it off by default, so coreAgents would
  # deploy a server nothing names.
  tier: observability
  feature: structureGraph
- name: config-refs-mcp-server
  kind: ConfigRefsMcpServer
  # 0.2.4 is the first release that SERVES the second tool, k8s_analyze — a deterministic,
  # read-only namespace analyzer (live objects + Nodes, pure-function condition checks, typed
  # findings). Nothing NAMES it yet: the k8s-agent and incident-agent bindings are unreleased, and
  # kagent's toolNames is a client-side allowlist, so on this pin the server simply serves one tool
  # more than anyone asks for and no agent behaviour changes. The pin has to lead the bindings
  # anyway — a name the server does not serve is dropped SILENTLY (Agent still Accepted=True), so
  # a binding released against 0.2.3 would be inert with no trace. Its only cluster-facing change
  # is the ClusterRole: still read-only, widened from GET on a few kinds to GET+LIST (never watch,
  # no writes) on the kinds k8s_analyze reads.
  # 0.2.6 adds a structured stderr log line per tool invocation (event/tool/clipped-args/latency_ms/
  # ok/error/ts, wrapped so it can never break a tool response) — observability only, no change to
  # tool outputs or RBAC, so the render and behaviour are identical to 0.2.4. Gives the bench
  # unambiguous per-invocation proof of which config-refs tools fire during an investigation.
  version: 0.2.6
  mcpBackend: true  # #116 roll-guard: hashed into gateway.mcpBackendHash + every agent rollGuard
  repo: oci://ghcr.io/krateo-agentiko/charts
  deps:
  - kagent
  # coreAgents grounding, like repo-mcp-server: config_refs is core RCA tooling (which ConfigMaps/
  # Secrets a workload references + is the key present, incl. optional:true refs the runtime hides),
  # so it ships with the base agent layer and the consumers name it by default (krateo-autopilot
  # mcpServers.configRefs.enabled=true). NOT a dedicated feature: a new installer feature is not
  # re-applied to an existing CR on upgrade (self-bootstrap preserves spec.features as runtime state),
  # so it could never enable on a live cluster. krateo-autopilot deps this so the server is Ready
  # before the agent compiles its tool list (kagent compiles once, no requeue).
  tier: observability
  feature: coreAgents
- name: krateo-autopilot
  kind: KrateoAutopilot
  # 0.4.8 adds ONE thing to the chart: generic Kubernetes knowledge (files/knowledge/*.md) appended
  # to the K8S-AGENT's system prompt, gated on knowledge.kubernetes.playbook / .architecture — both
  # defaulted TRUE by the chart, and this chart sets agents.k8s.enabled=true, so an as-is bump would
  # append ~9,000 words (~11.7k input tokens, resent on every model call, never compacted) to that
  # agent as a side effect of a version bump. componentValues.krateo-autopilot.knowledge turns BOTH
  # off (values.yaml + a values.schema.json default so a live-values override still merges), which
