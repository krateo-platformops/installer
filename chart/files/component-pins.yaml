# alert-troubleshooter (krateo-platformops): the "auto-troubleshoot on fire" bridge — a HyperDX alert
# fires a webhook -> incident-agent A2A root-cause analysis -> TroubleshootingReport CR the portal
# renders. NOT a kagent Agent (a plain webhook service that CALLS incident-agent), so no `agent`. Needs
# BOTH the observability stack (HyperDX API + the hyperdx-api-token secret, from krateo-observability) AND
# incident-agent, so it deps both and rides the specialistAgents feature — the same portal cross-dep
# pattern clickhouse-mcp-server uses. Public krateo-platformops chart, so no repo override.
# Dedicated CRD composition (Alert + TroubleshootingReport). Every CRD-owning component ships a
# *-crds composition (cf. authn-crd/frontend-crd/snowplow-crd) so the CRD lifecycle is DECOUPLED from
# the app's version churn — an app-only bump no longer migrates or (on a handover mis-fire) tears down
# these CRDs (core-provider#89). crdgen kind = PascalCase(chart): crds -> Crds. Versioned in lockstep
# with alert-troubleshooter (same repo tag). Public krateo-platformops chart.
- name: alert-troubleshooter-crd
  kind: AlertTroubleshooterCrds
  chart: alert-troubleshooter-crds
  version: 0.2.35
  tier: observability
  feature: specialistAgents
- name: alert-troubleshooter
  kind: AlertTroubleshooter
  version: 0.2.35
  deps:
  - alert-troubleshooter-crd
  - incident-agent
  - krateo-observability
  tier: observability
  feature: specialistAgents
# ---- agent gateway (OPT-IN, feature: agentGateway — default OFF) -----------------------
# JWT authentication + per-user RBAC over the agents, their MCP tools and A2A delegation.
# Two components because helm maps every kind in a manifest before applying any of it, so the
# release shipping the Gateway API CRDs can carry no Gateway API resource: the control plane
# (CRDs + agentgateway controller) installs first, the Gateway/routes/policies dep-chain behind
# it. Both are krateo-agentiko charts (private registry, like the agent charts).
# The policies chart deps stop at the substrate — depending on the agents themselves would stall
# it on any profile where one of them is absent. Every rule and every default is the chart's own:
# componentValues.agentgateway-policies.
- name: agentgateway-controller
  kind: AgentgatewayController
  version: 0.1.4
  repo: oci://ghcr.io/krateo-agentiko/charts
  tier: platform
  feature: agentGateway
- name: agentgateway-policies
  kind: AgentgatewayPolicies
  version: 0.1.12
  repo: oci://ghcr.io/krateo-agentiko/charts
  deps:
  - agentgateway-controller
  tier: platform
  feature: agentGateway
  # The portal's Autopilot rail calls an agent's A2A endpoint straight from the browser, so the
  # gateway needs a BROWSER-reachable address like authn/snowplow/sse-proxy do. svcMatch is the
  # proxy Service the agentgateway controller provisions for the Gateway (named after it, so this
  # tracks componentValues.agentgateway-policies.gateway.name if that is overridden).
  expose: true
  # The agentgateway controller — not this chart — creates the proxy Service, so there is no values
  # key to flip to exposure.type (and the chart's schema would reject one); compositions.yaml skips
  # the service-flip for this component by name instead of a pin field, so it never needs its own
  # entry in values.schema.json's components[] schema (and the generated Installer CRD). Exposure
  # still READS the live Service. It is a LoadBalancer by default, so it resolves on any cluster
  # that has an LB controller; elsewhere pin componentValues.frontend.config.AUTOPILOT_API_BASE_URL
  # to a reachable origin.
  exposePort: 8080
  svcMatch: krateo-agent-gateway
  # The frontend gets this as the gateway's ORIGIN; its own chart appends the A2A path for the
  # namespace the agents live in (agentgateway.enabled).
  configKeys:
  - AUTOPILOT_API_BASE_URL
  # jwt.jwks.port is the port of the authn Service the gateway fetches JWKS from to verify agent
  # tokens (chart-default 8082). exposure.port collapses authn to the shared port, so the gateway
  # would fetch from a dead port and reject EVERY token ("unknown key krateo-authn-key-1"). Port-only
  # sibling of internalUrls: compositions.yaml sets this to exposure.port when it is set.
  internalPorts:
  - path: jwt.jwks.port
# ---- codegen agents (OPT-IN, feature: codegenAgents — default OFF) ---------------------
# Cross-cutting codegen/conversion specialists from krateo-agentiko/codegen-agents (migrated
# from krateo-agentiko (formerly krateo-codegen-agents), krateo- prefix dropped). A distinct opt-in group
# (like ingress) so the default specialist fleet stays lean. Needs coreAgents (kagent + the
# model-configs-owned ModelConfigs); agent:true wires Vertex + joins the autopilot fleet when
# enabled. Kinds are crdgen PascalCase(chart) — tf is NOT an initialism (-> Tf).
- name: code-analysis-agent
