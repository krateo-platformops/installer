- name: krateo-marketplace-catalog
  kind: KrateoMarketplaceCatalog
  version: 0.1.2
  repo: oci://ghcr.io/krateo-blueprints/charts
  tier: platform
  feature: portal
  # The marketplace catalog: a tiny composition (no deps) whose chart renders ConfigMap
  # blueprints-catalog-index (the curated blueprint+operator indexes as JSON). The portal reads it
  # in-cluster (marketplace.source=configmap, the portal chart default) instead of an external Pages
  # fetch. NOT a portal dep — the portal reads the ConfigMap with continueOnError, so the catalog pull
  # never gates portal availability (a missing ConfigMap = an empty marketplace that self-heals when
  # the catalog installs). Pulled from the public krateo-blueprints /charts base (no registryAuth).
# The classic Krateo git-provider controller (reconciles git.krateo.io Repo + LocalResource CRs),
# made composition-ready in 0.14.1 (values.schema.json added so crdgen derives the GitProvider CRD).
# Mandatory with the portal feature and ordered BEFORE portal (portal deps it), so the SCM controller +
# its git.krateo.io CRDs (esp. LocalResource) are present before portal registers the builder-publish
# composition that applies them. The SCM-publish CONSUMER is builder-publish (co-released WITH portal, chart
# charts/builder-publish:{{portal version}}, registered by the portal chart — NOT a separate installer pin).
# SCM publishing to github.com needs NO installer wiring: builder-publish's chart defaults already point at
# git.host=github.com with authMethod=bearer and secretRef=git-provider-credentials (key: token). The ONE
# PRECONDITION is operational (like external-dns's provider-cred secret): the operator places the
# git-provider-credentials Secret (key: token = a GitHub PAT with repo push scope) in the release namespace
# out-of-band; until it exists the branch push fails even though every CR applies. A non-github host would
# need a portal->builder-publish git.host passthrough (not present today).
  # 0.15.6: CATCHING UP A LOCKSTEP THAT WAS BROKEN HERE, not shipping anything new. git-provider moved
  # 0.15.4 -> 0.15.5 -> 0.15.6 in two separate bumps and this pin was left behind in both; the block
  # above says the two must move together and that is exactly the rule that was missed. Harmless today,
  # verified rather than assumed: 0.15.4...0.15.6 is 7 files with ZERO under helm/, and the packaged
  # git-provider-crds templates are byte-identical between the two versions. The rule exists so a FUTURE
  # CRD change cannot ship a controller expecting fields the CRDs lack — and a skew that is harmless is
  # precisely the state in which the rule gets forgotten again.
  # NOTE it is still an operational event despite identical content: version IS the API version here, so
  # the leaf is pruned and recreated at v0-15-6.
- name: git-provider-crd
  kind: GitProviderCrds
  chart: git-provider-crds
  # 0.15.0 adds status.templatingErrors to LocalResource+Repo — must move in lockstep with the
  # provider (was skewed 0.14.2 vs provider 0.14.1 for 10 days). 0.15.1 = security-only (no CRD
  # change); kept in lockstep with the provider to preserve the no-skew invariant.
  version: 0.15.6
  tier: platform
  feature: portal
  # 0.15.5 (#27, fixes #26): a Repo whose PUSH LANDED but whose status write afterwards hit a 409 stayed
  # stuck on krateo.io/external-create-pending forever. Both status writes in the Repo sync path now
  # retry on conflict with a re-read, the external name is preserved, and Observe falls back to the
  # external name when targetCommitId is empty. This is the RIGHT SHAPE of fix: the standing rule is
  # that cdc must self-recover from a stuck handshake and that those annotations are never removed by
  # hand, so the repair belongs in the reconciler's conflict handling, which is exactly where it went.
  # It does NOT unstick Repos already wedged (#22) — those stay as they are, deliberately.
  # 0.15.6 (#25): bumps provider-runtime to v1.4.0, which RECOVERS a stuck create. Inside a 2-minute
  # grace it keeps re-observing; after that, if the resource is still absent, the RUNTIME clears
  # external-create-pending itself and the create runs again. That keeps the never-by-hand rule intact —
  # nothing external reaches in. Checked the blast radius before accepting it: git-provider manages
  # repoes AND localresources, and LocalResource.Observe asks the forge (it walks the branch for a
  # commit whose footer names the resource), so a create that landed is found and grace-then-clear is
  # never reached; only a genuinely absent commit re-commits, which is correct rather than duplicate.
  # LIVE CHECK AFTER THIS ROLLS, and it is falsifiable: exactly TWO Repos are pending-WITHOUT-succeeded
  # (publish-e2e-bp-0928-source, publish-pod-sizing-v1b-source) and they should converge. The other 18
  # Repos and all 146 marker-carrying LocalResources carry -succeeded too and must NOT move; movement
  # there is a stop signal, not a success.
- name: git-provider
  kind: GitProvider
  chart: git-provider
  # 0.15.0: #6 bearer auth no longer requires usernameRef (the real fix for the wedged publish
  # LocalResources); #8 BREAKING default templating delims {{ }}->{% %} (fixes {{ toYaml }} in
  # published charts; no-op on 057 — 0/13 LocalResources use placeholdersToOverride, 0 Repo CRs);
  # #9 Repo sync fails on unloadable template values (no Repo CRs on 057). Closes the CRD skew above.
  # 0.15.1: SECURITY-ONLY, no behaviour change from 0.15.0 — x/crypto 0.52.0 (4 CRITICAL x/crypto/ssh
  # advisories: agent-constraint drop, key-constraint enforcement, VerifiedPublicKeyCallback skew,
  # @revoked auth bypass), go-git 5.19.2, moby/spdystream 0.5.1 (HIGH CRI DoS). git-provider speaks
  # SSH/git to forges so these matter here; 0.15.0 (running on 057) has them unpatched.
  version: 0.15.6
  deps:
  - git-provider-crd
  tier: platform
  feature: portal
- name: github-provider-kog
  # HISTORICAL (resolved by oasgen-provider 0.27.0 — see the 0.3.2 note below). REVERTED TO 0.3.1 at
  # the time because: 0.3.2 COULD NOT BE INSTALLED IN PLACE and this was not a transient — it was
  # rejected on every cluster that has already generated the PullRequest CRD, which is every existing
  # install. It succeeds only on a fresh one.
  #   RestDefinition "github-provider-kog-pullrequest" is invalid:
  #   spec.resource.additionalStatusFields: AdditionalStatusFields are immutable, you cannot change
  #   them once the CRD has been generated
  # 0.3.2 grows that list 3 -> 5 (adds `merged`, `merged_at`). oasgen-provider treats it as immutable
  # post-generation, so helm refuses, the release stays on the OLD chart, and the composition retries
  # forever at Ready=False/Synced=False.
  # NOTE THE TRAP, because it is why this looked fine at first: the CompositionDefinition reported
  # 0.3.2 Ready=True — Pass A registration succeeded. Only the COMPOSITION CR was failing. A check on
  # the CD, or on the composition rollup, reads GREEN here while the component never upgraded. The
  # honest signals were the helm release still on 0.3.1 rev33 (three weeks old) and the field that had
  # to rise, PullRequest .status.merged, still at 0/24.
  # Reverting is a no-op on the cluster — the 0.3.1 release is what is actually deployed — so this
  # only clears the stuck composition. Nothing depends on 0.3.2: portal 1.8.63's #287 reads `merged`
  # only when present and shows "-" otherwise.
  # The fix belongs in oasgen-provider: let additionalStatusFields grow by APPEND ONLY, keeping
  # removals and renames immutable. Adding optional status properties to a generated CRD is safe for
  # stored CRs; removing them is what breaks. A new kind/version would instead make every existing
  # PullRequest CR a migration, and deleting the CRD to force regeneration would destroy 24 publish
  # records.
  # 0.3.2 (ANNOTATED tag -> commit 965d158 = main HEAD; note the LIGHTWEIGHT ref on the same tag
  # resolves to 9af5ffe, so read the deref, not the bare ref, for THIS repo).
