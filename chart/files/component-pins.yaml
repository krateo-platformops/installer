- name: oasgen-provider-crd
  # 0.26.0: co-versioned with oasgen-provider; one tag publishes all three charts in that repo.
  # Carries no CRD change of its own.
  # 0.25.1 (tag -> commit dd2c6b3, verified by ls-remote). Lockstep. Adds the knobs the render
  # preview service needed to be CONFIGURABLE from the installer: render.fullnameOverride,
  # render.service.port, render.resources and render.snowplowEndpoint.{enabled,name}. render itself
  # arrived in 0.25.0; 0.25.1 is what makes it safe to turn on.
  # WHY resources MATTERED: 0.25.0 shipped render.resources {} — no CPU or memory ceiling — while the
  # service accepts an untrusted user-supplied OpenAPI body per request. An unbounded pod is not
  # OOMKilled into a bounded blast radius, it consumes node memory until the kubelet evicts and takes
  # neighbours with it. This platform has had that failure (portal OOMKilled chart-inspector at a
  # shared 256Mi default, installer #65). 0.25.1 also lowers the body cap to 4 MiB to match a 512Mi
  # limit, so the two now agree.
  # render stays OFF in the chart default; it is enabled per-install via componentValues. All the new
  # keys are typed in values.schema.json with NO default — a default on a componentValues passthrough
  # leaf lands in the composition CR spec and would force the preview service on for every install.
  # 0.25.0 (two minors from 0.23.0; tag derefs to commit 9c93f45). Lockstep with oasgen-provider.
  # THE CHANGE THAT MATTERS: e4fc190 "a deleted RestDefinition must not own anything" (#137). A CRD
  # whose krateo.io/owned-by-restdefinition names a DELETED RestDefinition is now ADOPTED instead of
  # blocking regeneration forever — previously that leftover was indistinguishable from a real second
  # owner, so an ordinary OAS change could never be applied again without a human editing annotations.
  # This platform HAS hit that: a kog bump drove an RD Ready=False, Repository CRs lost
  # status.default_branch, the builder-publish gate closed and 35 LocalResources were pruned.
  # Ownership is read ONLY in ApplyOrUpdateCRD for the one CRD a reconciling RestDefinition writes —
  # there is no cluster-wide CRD List and no startup sweep (verified by reading apply.go at the tag,
  # and independently by the oasgen session). An undetermined lookup (RBAC/transport) RETRIES rather
  # than adopting, so a flaky check cannot hand a CRD to a second controller.
  # 057 carries 6 CRDs owned by deleted tk-keycloak-kog RestDefinitions. They are INERT: no live RD
  # produces any keycloak kind, no main keycloak CRD exists, 0 instances. Left in place deliberately —
  # 0.25.0 is the fix for them, so deleting them is a production action for no remaining reason.
  # Also: #110 changes generated status types for a kind with findby and no get — exactly ONE on 057,
  # github-provider-kog-collaborator (Collaborator), with 0 instances, so only the schema moves.
  # render.enabled DEFAULTS FALSE — no render Deployment until portal T6 wants one. Left off.
  # Charts now declare kubeVersion ">=1.33.0-0" and helm REFUSES below it; 057 is v1.36.2-gke.2064000.
  kind: OasgenProviderCrds
  chart: oasgen-provider-crds
  # 0.23.0 (bumped in lockstep with oasgen-provider): additive RestDefinition schema only — the
  # compareScope `updatable` enum (CEL-guarded to an update verb) + a corrected oasPath/JQ ref
  # pattern. RestDefinition stays v1alpha1 served+storage (no conversion webhook); crds MUST match
  # the provider or the apiserver rejects compareScope:updatable at admission.
  # 0.27.0: co-versioned with oasgen-provider. Carries the append-only CEL rule on
  # additionalStatusFields plus the maxItems:64 / maxLength:253 bounds the rule REQUIRES - without them
  # the apiserver costs the comprehension as effectively infinite and rejects the WHOLE CRD. Also adds
  # the new status.resourceHash property (see the oasgen-provider pin for why that matters on upgrade).
  # 0.28.0: co-versioned with oasgen-provider. Carries the same kubeVersion '>=1.36.0-0' floor, so it
  # refuses below 1.36 rather than installing a label-selector mechanism nothing can satisfy.
  # 0.28.1: co-versioned with oasgen-provider. Same k8s >= 1.36 floor; carries no part of the
  # regression fix, which is provider-side only.
  version: 0.28.1
  tier: platform
  feature: oasgenProvider
