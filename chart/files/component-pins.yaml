  # 248 of 256 tool calls (96.9%) against the repo corpus, 7 against Kubernetes, and ZERO to any of
  # the 10 wired sub-agents. The turn is BIMODAL, not merely slow: ~1 run in 3 falls into a corpus
  # loop and never comes out (one still issuing search_repo at 900s, 56 calls in), and in that state
  # the user gets NOTHING because the turn ends before a directive is emitted.
  # DELIVERY WAS NEVER THE PROBLEM — the 0.5.9 prompt was confirmed present in the mounted config
  # Secret after that roll. Checking the Secret rather than the ConfigMap is what made this
  # diagnosable at all; a ConfigMap-only check would have sent us back to re-verifying the rollout.
  # NOT CLAIMED: that this works. 0.5.9's mechanism was right and its remedy failed; this can fail the
  # same way. If the rate does not move, the contradiction was not what was driving the greps.
  # Verified prompt-only by pulling both charts: only Chart.yaml (version + source URL), Chart.lock
  # (its `generated` timestamp alone — no subchart moved) and files/prompts-eng.yaml differ, the last
