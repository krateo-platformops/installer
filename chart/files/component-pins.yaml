  # BuilderPublish is the live test (watch the PullRequest CR reach Available with NO PATCH on the 2nd
  # reconcile; a PATCH every pass = drift, the failure its jq transform exists to prevent).
  # 0.3.2 RE-ROLLED, and this time it installs. The blocker was never kog: oasgen-provider treated
  #   additionalStatusFields as immutable post-generation. oasgen 0.27.0 makes it APPEND-ONLY (a CEL
  #   prefix compare), and PullRequest's list grows ['number','html_url','state'] -> + 'merged',
  #   'merged_at', which is a pure append. Verified across ALL 29 rd-*.yaml templates before rolling,
  #   not just the one named in the handoff: exactly one file differs and its change is prefix-preserving.
  #   ORDERING: requires oasgen-provider >= 0.27.0, which went in as installer 0.3.370 immediately
