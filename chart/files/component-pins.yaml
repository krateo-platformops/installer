  # and gates file-commits on its status.default_branch. Deliberately NOT a portal dep (mirrors
  # krateo-marketplace-catalog): the installer Ready-gates deps (compositions.yaml -> inst.depsReady ->
  # inst.ready requires Ready=True, no existence-only mode), and this composition's aggregate Ready is a
  # FALSE-NEGATIVE while the `team` RestDefinition is stuck in the external-create handshake
  # (oasgen-provider#122, repository kind itself is Ready) — so a portal dep would wedge portal FOREVER
  # on a fresh install. No deps of its own => converges independently; its github.krateo.io CRDs are
  # served before a BuilderPublish claim (publish-time) needs them. Private krateo-blueprints chart =>
  # inherits the default registryAuth creds like marketplace-catalog (no registries[] entry needed).
