# ---- agent gateway (OPT-IN, feature: agentGateway — default OFF) -----------------------
# JWT authentication + per-user RBAC over the agents, their MCP tools and A2A delegation.
# Two components because helm maps every kind in a manifest before applying any of it, so the
# release shipping the Gateway API CRDs can carry no Gateway API resource: the control plane
# (CRDs + agentgateway controller) installs first, the Gateway/routes/policies dep-chain behind
# it. Both are krateo-agentiko charts (private registry, like the agent charts).
# The policies chart deps stop at the substrate — depending on the agents themselves would stall
# it on any profile where one of them is absent. Every rule and every default is the chart's own:
# componentValues.agentgateway-policies.

# ---------------------------------------------------------------------------------------------
# Nightly platform review. Reads this platform's own telemetry and its agents' conversations once a
# night and PROPOSES changes as pull requests — alerts, widgets, agent prompts, gateway policies,
# documentation. It applies nothing, and the agent it consults holds no write tool: Autopilot returns
# JSON, and this component's service is what validates, redacts and writes. A prompt injection in the
# corpus can therefore produce a refused proposal, never a commit.
#
# IT SHIPS INERT. The chart defaults dryRun:true and an EMPTY proposalAllowlist, so a fresh install
# reviews the platform, writes Proposal objects you can read, and opens nothing. Two switches have to
# be thrown deliberately before it can reach a repository.
# ---------------------------------------------------------------------------------------------
- name: nightly-review-crd
  kind: NightlyReviewCrds
  chart: nightly-review-crds
  # ReviewRun (an event, pruned) and Proposal (a decision record, kept). Separate CRDs because they
  # have different lifetimes, and Proposal deliberately carries NO ownerReference to its run — that
  # wiring would let the run's expiry garbage-collect the decision.
  # 0.1.1: ships values.schema.json. 0.1.0 had none, and core-provider reads it to derive the
  # Composition CRD — so both compositions wedged Synced=False with NO Ready condition at all
  # (not Ready=False), which a sweep filtering on Ready==False misses entirely.
  # 0.1.2: BYTE-IDENTICAL here, verified rather than assumed — the single commit between the tags
  # touches autopilot.py, evidence.py and main.py and neither helm/ directory. Lockstep only.
  version: 0.1.2
  tier: observability
  feature: specialistAgents
- name: nightly-review
  kind: NightlyReview
  # 0.1.1: ships values.schema.json (see the -crd pin above).
  # 0.1.2: THE CLIENT NEVER READ THE AGENT'S ANSWER. ask() harvested result.message.parts and
  # result.parts; kagent's A2A executor sends neither — the reply arrives in result.status.message.parts
  # with an artifact event beside it — so five consecutive nights failed with "empty response" on turns
  # that reached `completed` and returned exactly the contracted JSON. A2A_TIMEOUT (900s) was never
  # involved: the runs ended at ~264s. Proven with a probe on this cluster using the real nightly-review
  # SA identity: old parser 0 texts, new parser 4, newest exactly {"proposals": []}. The same release
  # stops a terminal `failed` task reporting as silence, and marks an empty kagent session list
  # `degraded` instead of a bare returned: 0 that three different causes all produce.
  version: 0.1.2
  # Reads ClickHouse (krateo-observability), kagent sessions through kagent's own API — which is why
  # kagent is a dep and why there is no Postgres reader: the API path inherits the per-user RBAC that
  # a direct database read would have had none of — and consults krateo-autopilot over A2A.
  deps:
  - nightly-review-crd
  - krateo-autopilot
  - kagent
  - krateo-observability
  tier: observability
  feature: specialistAgents
- name: agentgateway-controller
  kind: AgentgatewayController
  version: 0.2.0
  repo: oci://ghcr.io/krateo-agentiko/charts
  tier: platform
  feature: agentGateway
- name: agentgateway-policies
  kind: AgentgatewayPolicies
  # 0.1.23 added gateway.internalDataPlane (default false, off => byte-identical). 0.1.24 moves it to a
  # TWO-GATEWAY design (#114): when gateway.internalDataPlane is set the chart flips the PRIMARY
  # controller-provisioned proxy Service (krateo-agent-gateway) to ClusterIP — so the agent data plane
  # (:8080 — /llm/v1, /mcp, A2A) has no external path — and renders a SEPARATE platform Gateway
  # (krateo-agent-gateway-platform) as a LoadBalancer carrying ONLY the platform listeners
  # (portal :443/:80 + HyperDX :3000). No static IP anywhere: the platform LoadBalancer takes a
  # cloud-assigned address (loadBalancerIP dropped). Driven by exposure.internalDataPlane via
  # compositions.yaml (which also points the portal/HyperDX browser origins at the -platform Service).
  # Inert unless that knob is set.
  # 0.1.25 consumes gateway.mcpBackendHash: the installer computes a hash of every MCP-backend
  # component's <name>:<version> (compositions.yaml) and forcePaths it here; the chart stamps it on the
  # proxy pod template so the proxy pod ROLLS whenever an MCP-server version changes. Fixes a prod
  # outage — rolling an MCP server rolls its own pod but the controller flips the proxy Service in
  # place, leaving the proxy on a STALE backend. Absent/empty hash => byte-identical.
  # 0.1.27 adds gateway.platformHostname (#115): when set (installer forcePaths exposure.tls.host), the
  # platform Gateway's LoadBalancer Service is annotated external-dns.alpha.kubernetes.io/hostname, so a
  # deployed external-dns keeps the portal's DNS record following the LB IP (DNS-follows-LB, no static IP).
  # 0.2.2 (#44): cert-replay-hop JWKS_URL now includes authn's :8082 port — without it the JWKS fetch hit
  # :80, timed out, and every per-user-RBAC hop request 503'd (ErrKeyUnavailable), breaking all Autopilot
  # k8s tool calls the moment perUserRbac was activated on 057; also logs that 503 (was silent).
  # 0.2.3 (#46): ADDITIVE — registers krateo-blueprint-agent + its chart gate at the gateway (was missing
  # entirely: 0 of 31 HTTPRoutes / 29 policies referenced it). Renders 8 new objects (subagent HTTPRoute +
  # authz Allow/passthrough/resiliency-a2a; chart-gate Backend/HTTPRoute/NetworkPolicy/resiliency-mcp) so
  # autopilot's delegation to krateo-blueprint-agent stops 403ing at the agent-card hop + the agent enters
  # NetworkPolicy containment. Nothing existing modified. NOTE: bumping this proxy chart rolls the
  # krateo-agent-gateway proxy pod → strands gateway-routed agents' MCP sessions → rollout restart the
  # fleet after (roll-guard mcpHash does NOT cover agentgateway-policies itself).
  # 0.2.5 (#52): ADDITIVE — a /tts/v1 route (gated tts.enabled, default off) so Autopilot speak-back can
  # use Google Cloud Text-to-Speech instead of the browser's voice. Rides its own static backend to the
  # EU TTS endpoint (eu-texttospeech.googleapis.com, keeps answer text in-region) with its own JWT gate +
  # bounds; rewrites /tts/v1/text:synthesize -> /v1/text:synthesize upstream. Requires a TLS platform
  # listener (fails render otherwise). Enabled via exposure.voice (compositions.yaml), which also derives
  # the frontend AUTOPILOT_VOICE_TTS_URL that points at it — same knob as the /stt/v1 dictation route.
  # 0.2.8: INERT ON ARRIVAL, verified rather than asserted. Adds templates/policy-llm-turn-budget.yaml,
  # gated on .Values.llm.turnBudget.enabled which ships FALSE. Rendered output at default values is
  # IDENTICAL to 0.2.7 apart from the helm.sh/chart label — 56 docs both sides, same line count, checked
  # by rendering both charts and diffing. The new template contains no `lookup`, so that diff is sound
  # (the chart DOES use lookup elsewhere, in cert-replay-hop.yaml, where both sides render equally
  # vacuously and the comparison still holds).
  # WHAT IT WILL DO, once a probe has confirmed the body root: bound a runaway agent turn. Every
  # agent-loop iteration POSTs the whole conversation to /llm/v1, so the iteration count is already in
  # the request body; past a budget a CEL transformation clamps tool_choice to "none", the provider can
  # no longer return tool calls, and the turn ends on its next message WITH its answer.
  # WHY NOT A RATE LIMIT: a turn ends when the model returns a message carrying no tool calls. A 429 does
  # not produce that — it produces a tool error, and tool errors are MEASURED non-terminal here (a real
  # search_repo failure landed mid-run and the loop carried on to 256 calls). On this route llm.retry
  # retries the 429 and the turn then dies producing NOTHING. Throttling turns a 900s grind into a longer
  # one, which is a regression against "the turn must end with an answer".
  # WHY IT SHIPS OFF, AND WHY THAT GATE MUST BE RESPECTED: agentgateway documents the request body as
  # `llmRequest` but does not enumerate its fields. A CEL expression naming a field that does not exist
  # FAILS SILENTLY — the transformation does nothing and the policy still reports Accepted=True, which is
  # indistinguishable from "the gateway cannot help". Two earlier fixes to this same problem were lost
  # exactly that way. So bodyRoot is a VALUE to confirm, not a constant to trust.
  # DO NOT SET enabled: true WITHOUT A PROBE READING. The sequence is: layer
  # examples/turn-budget-probe/values.yaml (access-log attributes only, still no behaviour change), run
  # ONE agent turn, then read probe_msgcount — rising across the turn means ship it; empty means the root
  # is spelled differently (change a value, not the chart); sawtoothing means the predicate must key on
  # something else. The component owner asked explicitly to be refused if they request enablement
  # without that reading.
  # CONTEXT WORTH CARRYING: this exists because PROMPTS COULD NOT FIX IT. Two prompt releases
  # (krateo-autopilot 0.5.9 and 0.5.10) targeted the same runaway turn and moved the corpus-call ratio
  # from 96.9% (248/256) to 96.1% (173/180) — i.e. not at all. A prompt can lower the probability of a
  # loop; it cannot bound one. See also nightly-review, whose review turn times out at its 900s
  # A2A_TIMEOUT against exactly this behaviour.
  # 0.2.9: turn-budget units fix — maxMessages 40 -> 150. 40 was reasoned in TOOL CALLS and written into
  # a field that counts MESSAGES; a round trip adds two, so 40 fired at ~19 calls, below the ~62 messages
  # a healthy turn needs. Still OFF, so inert either way.
  # 0.2.10 (agentgateway-policies#58): llm.toolHistory.truncate, ON by default — truncates the tool results
  # an agent loop has already acted on out of the history it resends every step, keeping the newest whole.
  # Also MOVES the turn budget off its route-attached policy and onto the AgentgatewayBackend: a backend
  # transformations list REPLACES a route one whole rather than merging, so the budget would have gone
  # inert the moment truncation rendered, with every object still Accepted=True. Both now compose on one
  # backend. BREAKING for one knob: llm.turnBudget.routeName fails the render (it could never work — one
  # backend serves every LLM route this chart renders).
  # 0.2.11: THE PIN ALONE CHANGES NOTHING ON 057 — it MUST ship with a componentValues change.
  # The chart default is llm.retry.attempts: 0, so the retry policy exists only because this install
  # sets it (live: attempts 2, backoff 2s, codes [429,503], confirmed in both the live
  # AgentgatewayPolicy and the Installer CR). 0.2.11 changes ONLY the chart DEFAULT backoff 2s -> 15s,
  # so with componentValues still saying 2s you get the old behaviour on the new chart. Paired with
  # componentValues.agentgateway-policies.llm.retry = {attempts: 3, backoff: 15s}. Both keys already
  # exist in the CR, so this is a value change and NOT the nested-new-key gap.
  # THE BUG: 429 and 503 share one backoff and should not. A 503 means "try again shortly"; a capacity
  # 429 means "wait out the window". attempts 2 x backoff 2s plus ~6s per upstream call gives a
  # THIRTEEN SECOND survivable window, so every retry lands inside the same exhausted window and the
  # call fails. A failed LLM call fails the SUB-AGENT'S WHOLE A2A TASK, so autopilot receives
  # {error, subagent_session_id} with no result and re-derives the work itself. One provider 429 costs
  # a delegation and the turn that depended on it.
  # BUDGET, verified not taken: attempts 3 x backoff 15s = 45s of gaps plus four ~6s calls is ~69s,
  # inside llm.limits.timeout which reads traffic.timeouts.request = 120s live and 120s as the chart
  # default. Keep that relationship if these numbers are ever tuned.
  # NOT A QUOTA PROBLEM, checked before asking: on operations-dev-krateo-io the global input-tokens/min
  # limit for gemini-3.8-flash is effectively 50,000,000 against a measured peak of 235,175 (0.5%), and
  # global requests/min per base model is 250 against a peak of ~10 (4%). That model has NO regional
  # quota buckets, only global, so pinning the backend off `region: global` is not available either.
  # This is shared-capacity contention on the global endpoint — the case values.yaml already documented
  # on 2026-09-03 ("Resource exhausted under regional contention, 26 of 1,234 bench-route calls, with no
  # pattern in our own rate"). The retry policy was written for exactly this and given too short a backoff.
  # THE 429s ARE REAL AND REPRODUCIBLE. An earlier version of this note said they could not be found —
  # that was a WRONG INSTRUMENT on my part, corrected here rather than left standing, because a false
  # "could not confirm" in a pin comment invites the next reader to distrust a real finding.
  #   kubectl -n krateo-system logs deploy/krateo-agent-gateway --since=6h \
  #     | grep "agentgateway-policies-llm" | grep "http.status=429"
  # Two details are load-bearing. (a) deploy/krateo-agent-gateway, NOT krateo-agent-gateway-platform —
  # there are two gateways and only the first carries the LLM route. (b) Filter to the llm route:
  # grepping 429 alone also catches MCP routes, where kagent-tools answers steadily for unauthenticated
  # callers under TOKEN_PASSTHROUGH, which is a different story. That returns 19 lines across the day,
  # including 15:01:05/10/18 and 15:06:23/30/37.
  # TWO WRONG READINGS, recorded because the lesson generalises beyond this component:
  #   - `-l app.kubernetes.io/name=agentgateway` matches the agentgateway-CONTROLLER, not either
  #     data-plane gateway, so the "six 429 lines" it returned were control-plane xDS logs and never
  #     request records. Address a Deployment BY NAME when two deployments share a label.
  #   - "4 x 429 on the platform gateway" was `grep 429` matching digits inside a microsecond timestamp
  #     (15:00:04.429639Z) on lines whose actual field reads http.status=200. Grep for the FIELD
  #     (http.status=429), never the bare number.
  # ALSO CORRECTED HERE: an earlier reading of this same incident blamed a slow snowplow-agent for a 341s
  # A2A call. It was a call that took 310s to FAIL. Nothing is slow about the specialist.
  version: 0.2.11
  repo: oci://ghcr.io/krateo-agentiko/charts
  deps:
  - agentgateway-controller
  tier: platform
  feature: agentGateway
  # The portal's Autopilot rail calls an agent's A2A endpoint straight from the browser, so the
  # gateway needs a BROWSER-reachable address like authn/snowplow/sse-proxy do. svcMatch is the
  # proxy Service the agentgateway controller provisions for the Gateway (named after it, so this
  # tracks componentValues.agentgateway-policies.gateway.name if that is overridden).
  expose: true
  # The agentgateway controller — not this chart — creates the proxy Service, so there is no values
  # key to flip to exposure.type (and the chart's schema would reject one); compositions.yaml skips
  # the service-flip for this component by name instead of a pin field, so it never needs its own
  # entry in values.schema.json's components[] schema (and the generated Installer CRD). Exposure
  # still READS the live Service. It is a LoadBalancer by default, so it resolves on any cluster
  # that has an LB controller; elsewhere pin componentValues.frontend.config.AUTOPILOT_API_BASE_URL
  # to a reachable origin.
  exposePort: 8080
  svcMatch: krateo-agent-gateway
  # The frontend gets this as the gateway's ORIGIN; its own chart appends the A2A path for the
  # namespace the agents live in (agentgateway.enabled).
  configKeys:
  - AUTOPILOT_API_BASE_URL
  # jwt.jwks.port is the port of the authn Service the gateway fetches JWKS from to verify agent
  # tokens (chart-default 8082). exposure.port collapses authn to the shared port, so the gateway
  # would fetch from a dead port and reject EVERY token ("unknown key krateo-authn-key-1"). Port-only
  # sibling of internalUrls: compositions.yaml sets this to exposure.port when it is set.
  internalPorts:
  - path: jwt.jwks.port
# ---- krateo-blueprint-agent (DRAINING — retired, do not re-enable) ---------------------
# The blueprint-authoring agent, now LEGACY: core-provider-agent is the sole blueprint author and
# autopilot's routing has pointed there since 2026-08-12, so nothing delegates here any more. It had been
# PROMOTED from the (now-retired) codegen group to coreAgents in #144 — "it is a core agent" — Deploys with the base agent layer (kagent + the model-configs-owned
# ModelConfigs) and joins the autopilot fleet as an A2A sub-agent. Its chart bundles the
# krateo-chart-gate-mcp-server (render-and-validate gate) whose image ships from the SAME release
# tag, so the pin version must name a chart whose gate image is published: 0.2.7 (fix #9 unblocked
# the promotion + a clean tag builds the image); 0.2.3/0.2.6 are pre-fix (0.2.6's gate image is
# `manifest unknown`). Kind is crdgen PascalCase(chart).
# (The four codegen/conversion specialists code-analysis / ansible-to-operator / tf-provider-to-
# operator / tf-to-helm were RETIRED in #144; features.codegenAgents is kept hard-defaulted false.)
- name: krateo-blueprint-agent
  kind: KrateoBlueprintAgent
  # 0.2.10 (#12): modelConfig.name gemini-pro -> gemini-flash (+ the create=true branch's modelConfig.model
  # 2.5-pro -> 3.8-flash) — closes the fleet flash-repoint (label correction; both slots resolve to
  # gemini-3.8-flash on Vertex). Chart-default only; the agent pod rolls, NOT an mcpBackend so no fleet
  # bounce. Served version migrates v0-2-9 -> v0-2-10 (schema unchanged, clean rename).
  version: 0.2.10
  repo: oci://ghcr.io/krateo-agentiko/charts
  deps:
  - kagent
  tier: observability
  # DRAINING (2026-09-25). coreAgents -> codegenAgents, which is hard-defaulted false, so this stops
  # being emitted and the cdc tears it down. NOT deleted from this file in the same change: it is
  # deployed, and a pin that vanishes while its Composition still exists fails the unknown-name check
  # on every existing install. The block goes, and the name joins retired-components.yaml, only once
  # the Composition AND its CompositionDefinition are gone on every cluster.
  feature: codegenAgents
  agent: true
