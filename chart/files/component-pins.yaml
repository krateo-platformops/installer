  version: 0.1.30
  tier: observability
  feature: specialistAgents
  # 0.1.12: THE ALLOWLIST IS REMOVED, at Diego's direction. It bounded which repository a proposal
  # could name, and existed because target.repo is model-chosen from a corpus containing user chat
  # while this service held a GitHub write credential. Both premises are going: publishing moves to the
  # platform's own chain so the credential becomes git-provider's, and every proposal becomes a pull
  # request on a branch that a human reads before anything merges — a proposal blocked before it can
  # become one teaches nobody anything, including the next night's review, which is meant to learn from
  # what was merged and what was rejected. THE COST, stated rather than left to be discovered: the
  # reviewer may now name any repository the install-level git credentials can write to. dryRun is the
  # single remaining switch.
  # 0.1.13: PUBLISHES THROUGH THE PLATFORM'S OWN CHAIN AND NO LONGER HOLDS A GITHUB TOKEN. It used to
  # branch, GET the file, PUT it with its sha and POST a pull request over the REST API with its own
  # credential; it now creates ONE BuilderPublish claim per proposal and stops, and the chain
  # (Repository -> Repo -> LocalResource -> PullRequest) does the rest — the same one portal-builder and
  # blueprint-builder use. The credential becomes git-provider's, the readiness gate that prevents
  # GitHub's 422 is the chain's, and PullRequest is level-based so re-asserting a claim cannot open a
  # second one. GITHUB_TOKEN is gone from the chart, its values entry and its schema entry.
  #
  # REQUIRES portal >= 1.8.46, which is where the builderpublishes CRD and its `builder: review` enum
  # value ship. Publishing as `blueprint` would have made an overnight machine suggestion
  # indistinguishable from a person's authored blueprint on every list selecting krateo.io/builder, and
  # in the commit messages. Verified server-side on 057 at v1-8-46: a claim with builder: review is
  # accepted and one with builder: blueprint still is, so the enum was widened, not replaced.
  #
  # Publishing is ASYNCHRONOUS now: the run creates a claim and exits, and the pull request appears on
  # the chain's own reconcile. So the run no longer writes phase PrOpen or status.pullRequest — both
  # would be guesses — and records the claim as a LABEL, because the Proposal CRD is structural and an
  # undeclared status key is pruned silently. Reading the outcome back is the next piece of work.
  #
  # RBAC: the namespaced Role gains get/list/create/patch on builderpublishes, and a ClusterRole grants
  # exactly one verb on exactly one resourceName (the BuilderPublish CRD) for version discovery, gated
  # on dryRun. The version is discovered because the kind is version-pinned per portal release; note
  # that the CRD's STORAGE version is `vacuum` (served:false, no schema), so discovery reads SERVED
  # versions only — preferring storage returns a kind the apiserver will not serve.
  # 0.1.14: four of the eight findings filed against this component, all about what the run RECORDS.
  # Every successful run used to report PartiallyCompleted forever, because kagent scopes A2A sessions
  # per caller so this service's identity sees none of its own — an empty source that EXPLAINS itself is
  # no longer degradation, and a status that is always the same is a status nobody reads. An unwindowed
  # ClickHouse query is now refused rather than run (the window is a disclosure control, not a cost
  # one). Truncation is recorded on the run instead of only marked inside the corpus, where the model
  # could see it and the record could not. And the redaction denylist gained glpat-, xox[abposr]-,
  # AIza..., user:pass@host and generic api_key/client_secret/access_token/password.
  # The pull request also now quotes the queries the SERVICE issued rather than the model's paraphrase
  # of them — the first real proposals cited SQL with no window clause that matched nothing that ran.
  # 0.1.15: ONE LINE, AND IT WAS THE WHOLE OF THE CLICKHOUSE TIMEOUT. The run records its window as
  # ISO-8601 (right for the CR, whose schema types it date-time) and the same string went straight into
  # SQL — so ClickHouse compared a DateTime64 column to '2026-09-27T14:17:43.745807+00:00', could not
  # prune by primary-key range, and full-scanned 13.9M rows every night. Measured on 057 with the same
  # predicate and the same 96k matching rows: the ISO literal takes 167 SECONDS against a 120s read
  # timeout; 'YYYY-MM-DD HH:MM:SS' takes 15.7s and the full grouped query 2.3s. It also explains what
  # never added up — this query failed on half the runs while the other two, reading the SAME window,
  # never did: they scan far less, so the same handicap stayed inside budget.
  # Only what enters SQL is converted; the ReviewRun keeps its ISO window. A NAIVE timestamp is not
  # shifted — astimezone() on one assumes the host's local zone and slid the window two hours on the
  # machine this was written on, which a test caught before it shipped.
- name: nightly-review
  # 0.1.30 (annotated tag on main f8e6264, PR #41). Ships the RBAC that makes portal 1.8.65's two
