  kind: NightlyReview
  # 0.1.1: ships values.schema.json (see the -crd pin above).
  # 0.1.2: THE CLIENT NEVER READ THE AGENT'S ANSWER. ask() harvested result.message.parts and
  # result.parts; kagent's A2A executor sends neither — the reply arrives in result.status.message.parts
