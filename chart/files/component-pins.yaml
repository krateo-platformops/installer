  # source of the variance. Baseline to beat is four-in-six; the number gets reported either way.
  # VERIFY BY THE FIELD, NOT THE ConfigMap: the prompt reaches the pod through the agent's config SECRET,
  # so a changed cm/krateo-prompts-eng is not evidence the running agent picked it up. Watch
