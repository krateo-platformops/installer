# `namespace` is a PIN-LEVEL fact. It may come from files/component-pins.yaml; it may NOT be
# supplied per cluster through .Values.components.
#
# WHY THIS SUITE EXISTS. On 2026-11-17 definitions.yaml stopped refusing `namespace` on a pinned,
# non-registerOnly component, because Diego decided the installer must ADOPT demo's hand-installed
# Kyverno in place -- the pin targets helm release `kyverno` in namespace `kyverno`, so the
# installer upgrades that release rather than standing a second one up in krateo-system. Two
# complete Kyverno installations sharing 22 cluster-scoped CRDs and 10 webhook configurations is
# the failure that change avoids.
#
# THAT CHANGE MUST NOT LEAK INTO THE OVERRIDE PATH, and this suite is what holds the line. A
# SEPARATE guard at _helpers.tpl:781 refuses `namespace` and `readerGroups` on a pinned component
# arriving via .Values.components, and it is deliberately untouched. The property it protects is
# that both clusters read the same namespace from the same pins file -- "same files, different
# flags". If `namespace` were overridable per cluster, 057 and demo could disagree about where a
# component lives while every other gate passed.
#
# WHAT THIS SUITE DOES NOT COVER, said plainly rather than left to be discovered: the pins-file
# path itself. No pinned component declares `namespace` yet, and a test cannot inject one -- the
# override whitelist is exactly what case 1 asserts is closed, and the pins file is read through
# .Files rather than values. The render-level test of a composition landing in a non-default
# namespace therefore lands with the FIRST PIN that uses the field, not here. Until then this
# suite proves the blast radius of the change was bounded, not that the new path works.
suite: namespace stays a pin-level fact, not a per-cluster override
templates:
  - templates/compositions.yaml
tests:
  # A DIFFERENT namespace than the pin's. This case used to pass `namespace: kyverno`, which was a
  # refusal while no pin declared the field; now that the kyverno pin DOES declare `kyverno`, that
  # same input is an echo of the pin and is allowed (next case). To test the refusal the override has
  # to actually disagree with the pin, which is what the property forbids.
  - it: refuses a `namespace` override that DISAGREES with the pin
    set:
      components:
        - name: kyverno
          namespace: somewhere-else
    asserts:
      - failedTemplate:
          errorMessage: "components[kyverno]: `namespace` cannot be overridden per cluster -- the pin says \"kyverno\" and .Values.components says \"somewhere-else\". It is a pin-level fact so that every cluster reads the same namespace from the same pins file."

  # THE ROUND-TRIP, and this is the case whose absence wedged krateo-057 at 2026-11-18T00:16Z.
  # The self-bootstrap writes the EFFECTIVE components list into the Installer CR, and the CR's
  # spec.components arrives as .Values.components on the next render -- so a namespace that came
  # from the PINS FILE returns through the override path one pass later. The blanket refusal made
  # chart-inspector answer HTTP 500, ChartRenderable went False/InspectorUnavailable, RBACComplete
  # Unknown/NotEvaluated, and no configuration change could apply. A helm rollback to the previous
  # chart did NOT clear it: by then the value lived in the CR, and every chart carrying the blanket
  # guard refused it. 96 releases stayed deployed and 158 deployments stayed ready, so the cluster
  # was frozen rather than damaged -- but only a hand edit of the CR could unfreeze it.
  - it: ACCEPTS a `namespace` that matches the pin, because the self-bootstrap echoes it back
    set:
      components:
        - name: kyverno
          namespace: kyverno
    asserts:
      - notFailedTemplate: {}

  - it: refuses `readerGroups` on a PINNED component the same way
    set:
      components:
        - name: kyverno
          readerGroups:
            - platform-admins
    asserts:
      - failedTemplate:
          errorMessage: "components[kyverno]: `readerGroups` applies only to appended registerOnly catalog blueprints, not to a pinned component"

  # CONTROL. Without this case the two above would pass just as well if EVERY .Values.components
  # entry were refused -- which would be a different, much larger bug reported as success.
  - it: CONTROL accepts a whitelisted override on the same pinned component
    set:
      components:
        - name: kyverno
          version: 3.9.2
    asserts:
      - notFailedTemplate: {}
