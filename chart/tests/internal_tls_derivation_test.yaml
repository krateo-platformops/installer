# features.internalTls -- ONE value derived into TWO component specs, and the guard that refuses the
# mismatching default.
#
# WHY THIS SUITE EXISTS, AND WHY IT IS NOT A helm template CHECK. The derivation and its `fail` live
# in compositions.yaml, which LISTs every CRD with `lookup` at its head. `helm template` DISABLES
# lookup, so that file renders ZERO composition objects and the guard NEVER RUNS. I measured exactly
# that before writing this: with features.internalTls on and certManagerNamespace unset, plain
# `helm template` exits 0 and the guard's sentence is absent from stderr. So a check built on
# `helm template` would have reported a protection that does not exist, and the `fail` would first
# have fired on a real cluster the moment someone enabled the feature.
#
# helm-unittest's kubernetesProvider CAN serve the CRD LIST, which is what makes the file testable.
#
# WHAT THE VALUE IS FOR. Three namespaces must agree or the CA ClusterIssuer never becomes Ready,
# silently:
#   cert-manager-issuers writes the root CA Certificate (and its Secret krateo-root-ca-key-pair)
#     into internalCA.namespace
#   cert-manager READS cluster CA Secrets only from its --cluster-resource-namespace
#   trust-manager reads Bundle SOURCES only from app.trust.namespace
# And the two charts' own defaults DISAGREE: issuers defaults to the release namespace, trust-manager
# defaults to "cert-manager". So "both unset" is a guaranteed mismatch, not a safe default -- which
# is why the render FAILS rather than defaulting, and why CASE 2 is the most important case here.
#
# THE HOSTILE-OVERRIDE CASE IS NOT HERE, AND THAT IS DELIBERATE. The two leaves are written with
# inst.forcePath and are NOT declared as componentValues nodes, so an attempt to set
# componentValues.cert-manager-issuers.internalCA.namespace is refused by values.schema.json at
# CHART LOAD -- before any template renders. helm-unittest reports that as an error rather than a
# failed template, so it is not assertable in this file. It is asserted in
# .github/scripts/check-tls-feature-wiring.py, at the layer where it actually happens. Measured:
# helm reports "at '/componentValues/cert-manager-issuers/internalCA': additional properties
# 'namespace' not allowed" and "at '/componentValues': additional properties 'trust-manager' not
# allowed". So the override cannot even be expressed, which is stronger than forcePath winning --
# forcePath is the belt to that braces.
#
# A SECOND DERIVED LEAF ON trust-manager, ADDED 2026-11-15 (authn's finding). app.targetNamespaces is
# derived from componentValues.internal-ca-bundle.target.namespaces, because the namespaces
# trust-manager must write ConfigMaps into are exactly the ones the Bundle targets. It is NOT a
# convenience: trust-manager v0.20.0's clusterrole.yaml:39 puts
#     configmaps  get,list,create,patch,watch,DELETE
#     events      create,patch
# into a CLUSTER-ROLE whenever app.targetNamespaces is empty (_helpers.tpl:72 defines the rules;
# rbac-per-namespace.yaml renders per-namespace Roles instead when it is set). So an unset value is a
# cluster-wide ConfigMap DELETE grant, and an EMPTY LIST is the same thing -- [] is falsy in helm and
# takes the very `if not` branch we are avoiding. That is why the guard REFUSES an empty list rather
# than writing it: writing the hazard while appearing to configure against it is worse than refusing.
#
# CONSEQUENCE FOR THE SUITE, and it is a real contract change: with features.internalTls on,
# componentValues.internal-ca-bundle.target.namespaces is now REQUIRED. Every case below that turns
# the feature on therefore sets it. That requirement already existed one layer down -- the bundle
# chart's own defaults fail its render -- but it was only discoverable when the composition rendered
# on a cluster. Now it is a chart-load refusal with a sentence that says what to set.
suite: features.internalTls - one value derived into two components
templates:
  - templates/compositions.yaml
tests:
  - it: "with the value set, BOTH components carry it and they AGREE"
    set:
      features.internalTls: true
      internalTls.certManagerNamespace: cert-manager
      componentValues.internal-ca-bundle.target.namespaces: [krateo-system]
      bootstrap.coreProvider.enabled: false
    kubernetesProvider: &fixture
      scheme:
        "apiextensions.k8s.io/v1/CustomResourceDefinition":
          gvr:
            version: v1
            group: apiextensions.k8s.io
            resource: customresourcedefinitions
      objects:
        # the three composition CRDs, each served at its pinned version
        - apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          metadata: {name: certmanagerissuerses.composition.krateo.io}
          spec:
            group: composition.krateo.io
            names: {kind: CertManagerIssuers}
            versions: [{name: v0-18-0, served: true}]   # ingress-blueprint 0.18.0: the ROOT CA
            # rotationPolicy. 0.16.0 ran on cert-manager defaults -- 90d and, since v1.18,
            # rotationPolicy: Always, so the ROOT got a NEW KEY at every re-issue. The bundle
            # would switch to the new ca.crt while an unrotated leaf kept the old key, so every
            # bundle-trusting client refuses that service until ITS own renewal -- ~2h per cycle
            # on 057. 0.18.0 sets duration 87600h, renewBefore 8760h, rotationPolicy: Never.
            # authn measured both directions on a disposable cluster: with the old spec a root
            # renewal changed the key and the unchanged leaf FAILED; with this one the key is
            # kept and the leaf VERIFIES. THE UPGRADE RE-ISSUES NOTHING on an existing cluster
            # (same serial, notAfter still 90d) -- it takes effect at the root's NEXT renewal,
            # which on 057 is 2027-01-14T20:09Z. So the pin must land BEFORE that date.
        - apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          metadata: {name: trustmanagers.composition.krateo.io}
          spec:
            group: composition.krateo.io
            names: {kind: TrustManager}
            versions: [{name: v0-17-0, served: true}]   # the WRAPPER's version.
            # The pin moved from quay.io/jetstack 0.20.0 to ingress-blueprint 0.17.0.
            # jetstack's Chart.yaml says `version: v0.20.0`, so core-provider generated the
            # CD apiVersion as vv0-20-0 while inst.emitTag -- which reads the PIN -- wanted
            # v0-20-0: mismatch, arm 3, the composition WITHHELD and the feature silently
            # inert. Our own version has no leading v, so both sides agree at v0-17-0.
        - apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          metadata: {name: internalcabundles.composition.krateo.io}
          spec:
            group: composition.krateo.io
            names: {kind: InternalCaBundle}
            versions: [{name: v0-16-0, served: true}]
        # requiresApiGroups: cert-manager.io for issuers and trust-manager,
        # trust.cert-manager.io for the bundle. Without these the components are withheld
        # and every assertion below would pass vacuously on an empty render.
        - apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          metadata: {name: clusterissuers.cert-manager.io}
          spec:
            group: cert-manager.io
            names: {kind: ClusterIssuer}
            versions: [{name: v1, served: true}]
        - apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          metadata: {name: bundles.trust.cert-manager.io}
          spec:
            group: trust.cert-manager.io
            names: {kind: Bundle}
            versions: [{name: v1alpha1, served: true}]
    asserts:
      - notFailedTemplate: {}
      - equal:
          path: spec.internalCA.namespace
          value: cert-manager
        documentSelector:
          path: kind
          value: CertManagerIssuers
      - equal:
          path: spec.trust-manager.app.trust.namespace
          value: cert-manager
        documentSelector:
          path: kind
          value: TrustManager
      # THE RBAC SCOPE, derived from the OTHER component's list. If this is ever absent or empty,
      # trust-manager's ClusterRole regains cluster-wide `configmaps: delete`.
      - equal:
          path: spec.trust-manager.app.targetNamespaces
          value: [krateo-system]
        documentSelector:
          path: kind
          value: TrustManager

  - it: "THE RBAC GUARD: feature on, certManagerNamespace set, but the bundle's namespaces EMPTY -> REFUSED"
    set:
      features.internalTls: true
      internalTls.certManagerNamespace: cert-manager
      bootstrap.coreProvider.enabled: false
    kubernetesProvider: *fixture
    asserts:
      # Not a convenience check. Without this refusal the installer writes app.targetNamespaces: []
      # and trust-manager's chart takes the `if not` branch -- a cluster-wide ConfigMap DELETE grant
      # produced by the installer, silently, as a side effect of enabling a TLS feature.
      - failedTemplate:
          errorPattern: "trust-manager's RBAC scope cannot be derived"

  - it: "THE GUARD: with features.internalTls on and the value UNSET, the render FAILS"
    set:
      features.internalTls: true
      bootstrap.coreProvider.enabled: false
    kubernetesProvider: *fixture
    asserts:
      - failedTemplate:
          errorPattern: "internalTls.certManagerNamespace is empty"

  - it: "with the feature OFF and the value unset, the render succeeds and neither component appears"
    set:
      bootstrap.coreProvider.enabled: false
    kubernetesProvider: *fixture
    asserts:
      - notFailedTemplate: {}
      - notExists:
          path: spec.internalCA

  - it: "the bundle takes NO DERIVED value - it is the SOURCE, not a consumer"
    set:
      features.internalTls: true
      internalTls.certManagerNamespace: cert-manager
      componentValues.internal-ca-bundle.target.namespaces: [krateo-system]
      bootstrap.coreProvider.enabled: false
    kubernetesProvider: *fixture
    asserts:
      - notFailedTemplate: {}
      # The bundle's spec carries EXACTLY what the user set and nothing the installer derived. It is
      # now the SOURCE of trust-manager's RBAC scope, so a derived namespace appearing here would mean
      # the value had acquired a second home -- which is what this asserts against. The previous
      # version of this case asserted `spec: {}`; that stopped being the right assertion when
      # target.namespaces became required, because the user's own list legitimately appears.
      - equal:
          path: spec
          value:
            target:
              namespaces:
                - krateo-system
        documentSelector:
          path: kind
          value: InternalCaBundle
      - notExists:
          path: spec.internalCA
        documentSelector:
          path: kind
          value: InternalCaBundle
      - notExists:
          path: spec.trust-manager.app
        documentSelector:
          path: kind
          value: InternalCaBundle
