{{- /*
  httproutes.yaml — one Gateway API HTTPRoute per browser-exposed component, for
  exposure.type=Gateway (installer#27). Composition-mode only, so the engine renders these into the
  umbrella release. Each `expose: true` component whose feature is on gets one HTTPRoute routing its
  hostname (exposure.hosts[name] or <svcMatch>.<baseDomain>) to its ClusterIP Service; external-dns
  publishes the record from the route and cert-manager-issuers issues the cert via the same gatewayRef.

  The installer creates NEITHER the Gateway nor the Gateway API CRDs (BYO / agentgateway). Emission
  is GATED on the HTTPRoute CRD being served, so setting type=Gateway before the CRDs exist is INERT
  (no "resource mapping not found" wedge) and fills in on a later reconcile once they are installed.
  The backend Service name is resolved live (inst.svcname); a route is skipped until its Service
  exists, then appears next reconcile — same posture as inst.peerurl omitting a not-yet-ready LB URL.

  REQUIRES gatewayRef.name AND a host source (baseDomain or a hosts.<name> override) — with neither,
  emission is inert (no routes) and the frontend keeps its localhost dev-defaults; see configuration.md.
  A route provides no session stickiness. sse-proxy is safe only because it is single-replica by
  chart design (a stateful in-memory hub); do not scale it under Gateway without sessionPersistence.
  gatewayRef.namespace defaults to namespaces.krateo (same-namespace attach, no allowedRoutes needed);
  a cross-namespace Gateway must permit these routes via its listener allowedRoutes.namespaces.
*/}}
{{- if not .Values.bootstrap.coreProvider.enabled }}
{{- if eq .Values.exposure.type "Gateway" }}
{{- $top := . }}
{{- $ns := .Values.namespaces.krateo }}
{{- if lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" "httproutes.gateway.networking.k8s.io" }}
{{- $gwName := (.Values.exposure.gatewayRef | default dict).name }}
{{- $gwNs := (.Values.exposure.gatewayRef | default dict).namespace | default $ns }}
{{- if $gwName }}
{{- $components := (include "inst.componentsYaml" $ | fromYaml).components }}
{{- range $c := $components }}
{{- if and $c.expose (not $c.registerOnly) (eq (include "inst.compEnabled" (list $top $c)) "true") }}
{{- $host := include "inst.hostname" (list $top $c) }}
{{- $svc := include "inst.svcname" (list $top $c.svcMatch) }}
{{/* $c.exposePort is the Service port for the backendRef; skip (don't guess :80) if a future
     expose:true pin ever omits it. */}}
{{- if and $host $svc $c.exposePort }}
{{/*
  SCHEME CORRECTNESS (installer#866). agentgateway terminates TLS at the listener and forwards
  cleartext to the backend Service. Without X-Forwarded-Proto the backend believes it was reached
  over plain HTTP. Keycloak (proxy.headers=xforwarded, hostname https://...) then rebuilds its
  request URI as http, so a browser POST carrying an https Origin fails its same-origin check with
  403 {"error":"Invalid origin"} and logs "Non-secure context detected". Measured on demo: an https
  Origin got 403, an http Origin got 400 invalid_grant (i.e. it passed the origin check), and the
  same request made in-cluster WITH X-Forwarded-Proto: https also passed. It affects anything doing
  a CORS-checked POST from its own origin -- Keycloak's account and admin consoles first.

  WHY THE FILTER CANNOT GO ON ONE UNSECTIONED ROUTE. HTTPRoute filters are per-RULE, but listener
  attachment is per-parentRef. A route with no sectionName attaches to EVERY listener whose hostname
  matches -- including the cleartext `http` listener, which has no hostname and therefore matches all
  of them (measured on demo: attachedRoutes=5 on `http`). A blanket "set X-Forwarded-Proto: https"
  would then assert https on genuinely plain-HTTP requests, which is worse than the bug.

  So each exposed component emits TWO routes when its HTTPS listener can be identified:
    <name>        sectionName -> that listener, carrying the forwarded headers
    <name>-http   sectionName -> the cleartext listener, carrying a 301 to https
  The listener NAMES are not assumed: they are read from the live Gateway and matched on hostname,
  because the Gateway's listeners come from values (agentgateway's gateway.yaml renders
  `.Values.gateway.listeners`), so a convention like `https-<component>` would be wrong -- the
  frontend's listener is `https-portal`, not `https-frontend`.

  DEGRADES TO TODAY'S BEHAVIOUR. If the Gateway cannot be read (helm template, dry-run, lookup
  disabled) or no HTTPS listener matches this host, the original single unsectioned route is emitted
  unchanged. This must stay true: it is what keeps a render-only CI run and a BYO Gateway working.
*/}}
{{- $gw := lookup "gateway.networking.k8s.io/v1" "Gateway" $gwNs $gwName }}
{{- $tlsListener := "" }}
{{- $plainListener := "" }}
{{- if $gw }}
{{- range $l := (($gw.spec | default dict).listeners | default list) }}
{{- if and (eq ($l.protocol | toString) "HTTPS") (eq ($l.hostname | default "" | toString) $host) }}
{{- $tlsListener = $l.name }}
{{- end }}
{{- if and (eq ($l.protocol | toString) "HTTP") (not $l.hostname) }}
{{- $plainListener = $l.name }}
{{- end }}
{{- end }}
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $c.name }}
  namespace: {{ $ns }}
  labels:
    # NB: app.kubernetes.io/managed-by is intentionally NOT set — helm forces it to "Helm"
    # on every release resource, so a chart-set value would churn a revision each reconcile.
    krateo.io/exposed-component: {{ $c.name }}
spec:
  parentRefs:
    - name: {{ $gwName }}
      namespace: {{ $gwNs }}
      {{- if $tlsListener }}
      sectionName: {{ $tlsListener }}
      {{- end }}
  hostnames:
    - {{ $host | quote }}
  rules:
    - {{- if $tlsListener }}
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            {{/* `set`, not `add`: a client-supplied X-Forwarded-Proto must not be able to append a
                 second value and make the backend read the wrong one. The gateway is the only
                 authority on the scheme it terminated. */}}
            set:
              - name: X-Forwarded-Proto
                value: https
              - name: X-Forwarded-Port
                value: "443"
              - name: X-Forwarded-Host
                value: {{ $host | quote }}
      {{- end }}
      backendRefs:
        - name: {{ $svc }}
          port: {{ $c.exposePort }}
{{- if and $tlsListener $plainListener }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $c.name }}-http
  namespace: {{ $ns }}
  labels:
    krateo.io/exposed-component: {{ $c.name }}
spec:
  parentRefs:
    - name: {{ $gwName }}
      namespace: {{ $gwNs }}
      sectionName: {{ $plainListener }}
  hostnames:
    - {{ $host | quote }}
  rules:
    {{/* 301, not a forward. Previously this host was served on :80 by forwarding to the backend with
         no scheme information at all; that is exactly the bug above. A permanent redirect is the
         only honest answer on a cleartext listener for a host whose TLS listener exists. */}}
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: 443
            statusCode: 301
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
