{{/*
  authn signs JWTs asymmetrically (RS256) with the RSA PRIVATE key in Secret
  `authn-jwt-signing-key`, key `private.pem` (matching authn chart defaults
  jwt.signKeySecretName/signKeySecretKey).

  ONLY the private key is created here. Consumers that verify authn's tokens
  (snowplow et al.) read the PUBLIC key from authn's JWKS endpoint,
  GET /.well-known/jwks.json, which authn derives from this private key at
  startup.

  `lookup` reuses an existing key on re-render so reconciles never rotate it; a
  fresh key is generated only on first create.

  THE REUSE/GENERATE DECISION IS NOT INLINE HERE. It lives in `inst.jwtSigningKeyPEM`
  (_helpers.tpl), which takes the looked-up Secret as an argument and never calls `lookup`
  itself, because `helm template` disables lookup and an inline decision could therefore only
  ever render its generate arm. If the reuse arm silently stops firing, a new key is generated,
  applied without error, and every outstanding JWT is invalidated with no signal anywhere.
  .github/scripts/check-signing-key.py exercises both arms and asserts they differ.

  The `lookup` stays HERE, and the gate asserts this file still performs it with this name and
  namespace and still passes the result to that helper -- a wiring assertion, because the one
  thing no cluster-free test can execute is the lookup itself.
*/}}
{{- if and ((include "inst.featureEnabled" (list $ "portal")) | trim) (not .Values.bootstrap.coreProvider.enabled) }}
{{- $ns := .Values.namespaces.krateo }}
{{- /* ONE name, computed ONCE, used for BOTH the lookup and metadata.name below.
     If those two ever diverge the lookup misses on every render, the generate arm
     fires every reconcile, and authn re-keys continuously -- every outstanding token
     invalidated, repeatedly, with a clean render and a clean apply each time.
     check-signing-key.py asserts they are the same expression. */ -}}
{{- $gen := (((.Values.authn).jwt).keyGeneration) | default 1 | int }}
{{- $keyName := include "inst.authnSigningKeySecretName" (list $gen) }}
{{- $existingPriv := lookup "v1" "Secret" $ns $keyName }}
{{- $privPEM := include "inst.jwtSigningKeyPEM" (list $existingPriv) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $keyName }}
  namespace: {{ $ns }}
  # NB: do NOT set app.kubernetes.io/managed-by here. Helm forces this label to
  # "Helm" on every release resource at apply time; a chart-set value (e.g.
  # "krateo-installer") can never converge and makes the cdc reconcile detect drift
  # every cycle (revision churn). Omitting it lets the three-way merge preserve
  # helm's live value instead of fighting it.
type: Opaque
stringData:
  private.pem: |
{{ $privPEM | indent 4 }}
{{- end }}
