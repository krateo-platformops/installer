{{/*
  Image-pull credential for the PRIVATE krateo-agentiko IMAGES (autopilot's repo-mcp-server and
  core-provider-agent's chart-gate-mcp-server). registryAuth already carries the credential the in-cluster
  CHART pull uses (spec.chart.credentials, via inst.chartExtras); here we DERIVE the matching dockerconfigjson
  so the SAME credential also pulls the private IMAGES — a full-fleet install needs no manual ServiceAccount
  patch (one input -> chart-pull AND image-pull). The two charts document this exact wiring ("imagePullSecrets
  ... the installer wires it from registryAuth"); compositions.yaml injects the secret name into their
  mcpServers.{repoSearch,chartGate}.imagePullSecrets.

  Works in BOTH registryAuth modes — inst.imagePullAuths resolves one credential per private-image component,
  selecting it exactly like inst.chartExtras selects the chart-pull cred (global registryAuth, or the
  registries[] entry matching the component's own repo) and deduping to one `auths` entry per image-registry
  host. So a multi-registry install pulls the private images with no manual patch too. Each credential's token
  is read with `lookup` (the same pattern secret.yaml uses) from the operator-created Secret — the SAME one
  core-provider dereferences for the chart pull — and the dockerconfig is assembled at render time.

  Rendered only in composition mode (core-provider's self-reconcile render, where lookup has cluster access
  and the agent components are emitted), with the DEFAULT derived name (set registryAuth.imagePullSecretName to
  a pre-existing dockerconfigjson Secret to opt out and supply your own), when a private-image feature is on
  and at least one credential resolves. Gated on the SAME inst.imagePullAuths the injection reads, so the two
  never diverge into a dangling reference.
*/}}
{{- $derive := eq (include "inst.imagePullSecretName" .) "krateo-registry-image-pull" }}
{{- $privateImageOn := or (eq (include "inst.featureEnabled" (list . "coreAgents")) "true") (eq (include "inst.featureEnabled" (list . "specialistAgents")) "true") }}
{{- $authsJson := include "inst.imagePullAuths" (list .) }}
{{- if and $derive (not .Values.bootstrap.coreProvider.enabled) $privateImageOn (ne $authsJson "") }}
{{- $dockerAuths := dict }}
{{- range $a := ($authsJson | fromJsonArray) }}
{{- $tokenSecret := lookup "v1" "Secret" $a.secretNamespace $a.secretName }}
{{- if and $tokenSecret $tokenSecret.data (hasKey $tokenSecret.data $a.secretKey) }}
{{- $token := index $tokenSecret.data $a.secretKey | b64dec }}
{{- $auth := printf "%s:%s" $a.username $token | b64enc }}
{{- $_ := set $dockerAuths $a.host (dict "username" $a.username "password" $token "auth" $auth) }}
{{- end }}
{{- end }}
{{- if $dockerAuths }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "inst.imagePullSecretName" . }}
  namespace: {{ .Values.namespaces.krateo }}
  # NB: do NOT set app.kubernetes.io/managed-by (see secret.yaml) — helm forces it to "Helm",
  # so a chart-set value never converges and the cdc reconcile detects drift every cycle.
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: {{ dict "auths" $dockerAuths | toJson | quote }}
{{- end }}
{{- end }}
