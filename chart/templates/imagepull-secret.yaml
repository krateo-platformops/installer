{{/*
  Image-pull credential for the PRIVATE krateo-agentiko IMAGES (autopilot's repo-mcp-server and
  core-provider-agent's chart-gate-mcp-server). registryAuth already carries the ONE credential the
  in-cluster CHART pull uses (spec.chart.credentials, via inst.chartExtras); here we DERIVE the matching
  dockerconfigjson so the SAME credential also pulls the private IMAGES — so a full-fleet install needs no
  manual ServiceAccount patch (one input -> chart-pull AND image-pull). The two charts document this exact
  wiring ("imagePullSecrets ... the installer wires it from registryAuth"); compositions.yaml injects the
  secret name into their mcpServers.{repoSearch,chartGate}.imagePullSecrets.

  Built with `lookup` (the same pattern secret.yaml uses): it reads the registryAuth token Secret the
  operator created — the SAME one core-provider dereferences for the chart pull — and assembles the
  dockerconfig at render time. Rendered only in composition mode (core-provider's self-reconcile render,
  where lookup has cluster access and the agent components are emitted), when registryAuth is enabled with
  the DEFAULT derived name, a private-image feature is on, and the credential is the global one.

  registries[]-mode (multi-registry) image-pull derivation is a follow-up; set registryAuth.imagePullSecretName
  to a pre-existing dockerconfigjson Secret to opt out of the derivation and supply your own.
*/}}
{{- $ra := .Values.registryAuth }}
{{- $derive := eq (include "inst.imagePullSecretName" .) "krateo-registry-image-pull" }}
{{- $privateImageOn := or (eq (include "inst.featureEnabled" (list . "coreAgents")) "true") (eq (include "inst.featureEnabled" (list . "specialistAgents")) "true") }}
{{/* inst.imagePullOn is the shared predicate (enabled + global mode + passwordRef, or a BYO name); combined
     with $derive (default name = auto-derive, not BYO) this renders ONLY when we should build the secret. */}}
{{- if and (eq (include "inst.imagePullOn" .) "true") $derive (not .Values.bootstrap.coreProvider.enabled) $privateImageOn }}
{{- $ns := .Values.namespaces.krateo }}
{{- $refNs := $ra.passwordRef.namespace | default $ns }}
{{- $tokenSecret := lookup "v1" "Secret" $refNs $ra.passwordRef.name }}
{{- if and $tokenSecret $tokenSecret.data (hasKey $tokenSecret.data $ra.passwordRef.key) }}
{{- $token := index $tokenSecret.data $ra.passwordRef.key | b64dec }}
{{- $host := regexReplaceAll "^oci://" .Values.ociRepo "" | splitList "/" | first }}
{{- $auth := printf "%s:%s" $ra.username $token | b64enc }}
{{- $dockercfg := dict "auths" (dict $host (dict "username" $ra.username "password" $token "auth" $auth)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "inst.imagePullSecretName" . }}
  namespace: {{ $ns }}
  # NB: do NOT set app.kubernetes.io/managed-by (see secret.yaml) — helm forces it to "Helm",
  # so a chart-set value never converges and the cdc reconcile detects drift every cycle.
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: {{ $dockercfg | toJson | quote }}
{{- end }}
{{- end }}
