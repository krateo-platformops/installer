{{/* Pass A: register a CompositionDefinition per component whose feature is enabled OR whose
     Composition still exists. The second clause keeps a CD (and thus its generated CRD) registered
     while a feature-disabled component is still DRAINING (Pass B / inst.dependentsGone removes the
     Composition CRs leaves-first; this keeps each CRD alive until its CR is gone) — so the CRD is
     never GC'd out from under a still-present Composition, which would leave the umbrella's helm
     release referencing a CRD-less kind ("resource mapping not found") and deadlock every later
     upgrade. The CD is dropped only once its component is fully gone. Composition mode only — the
     bootstrap helm install registers the Installer composition (self-bootstrap.yaml). */}}
{{- if and .Values.installDefinitions (not .Values.bootstrap.coreProvider.enabled) }}
{{- $components := (include "inst.componentsYaml" $ | fromYaml).components }}
{{/* LIST all CRDs ONCE and thread the slice into the gating helpers, instead of each inst.crdExists
     re-LISTing all CRDs — see inst.crdExists (D9). */}}
{{- $allCRDs := (lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" "").items }}
{{- range $c := $components }}
{{/* registerOnly (catalog) blueprints are always registered while installDefinitions is on, so the
     blueprint appears in the portal; their Composition emission is suppressed in compositions.yaml. */}}
{{- if or $c.registerOnly (eq (include "inst.featureEnabled" (list $ $c.feature)) "true") (eq (include "inst.compositionExists" (list $ $c.kind $c.name $c.version $allCRDs)) "true") }}
{{/* Blueprint namespace (portal#261: a blueprint's namespace is its visibility scope). An APPENDED
     registerOnly catalog blueprint may set `namespace` to place its CompositionDefinition there
     instead of namespaces.krateo, and `readerGroups` to let those groups see it on the Blueprints
     page: a namespaced Role (never a ClusterRole) reading compositiondefinitions, bound to each
     group. Only the DEFINITION moves — registerOnly emits no Composition, so nothing is left behind
     in namespaces.krateo; instances are created by their users wherever they choose.
     Moving an existing definition here is create-then-delete within one helm upgrade (the new
     object is applied before the old is removed); core-provider >= the one-controller-per-version
     release (core-provider#203) hands the composition controller over without touching the
     definition's instances. */}}
{{- $cdNamespace := $.Values.namespaces.krateo }}
{{- if $c.namespace }}
{{- if not $c.registerOnly }}{{- fail (printf "components[%s]: `namespace` is only supported on registerOnly catalog blueprints" (toString $c.name)) }}{{- end }}
{{- $cdNamespace = $c.namespace }}
{{- end }}
{{- if and $c.readerGroups (eq $cdNamespace $.Values.namespaces.krateo) }}
{{- fail (printf "components[%s]: `readerGroups` needs `namespace` set to a blueprint namespace — a reader Role in %s would expose every platform CompositionDefinition" (toString $c.name) $.Values.namespaces.krateo) }}
{{- end }}
{{/* github-provider-kog-config needs Repository AND PullRequest to exist as RestDefinitions, and
     NOTHING ELSE CATCHES THEIR ABSENCE. `deps` only orders this after github-provider-kog, and
     `requiresApiGroups: github.krateo.io` is GROUP-level — it passes while ANY served CRD in the
     group exists. So if componentValues.github-provider-kog.kinds names a subset that omits either
     one, both gates pass and this chart gets an endless chart-inspector 500. The contradiction is
     in the operator's own values, so the render is the earliest place it can be refused and the
     only place the message can name the fix. Identified by the chart's owner.
     EMPTY OR ABSENT `kinds` MUST PASS: empty means "render all 32", so the guard is gated on the
     list being non-empty, never on its contents alone. */}}
{{- if eq $c.name "github-provider-kog-config" }}
{{- $kinds := dig "github-provider-kog" "kinds" (list) (default dict $.Values.componentValues) }}
{{- if $kinds }}
{{- $missing := list }}
{{- range $need := (list "Repository" "PullRequest") }}
{{- if not (has $need $kinds) }}{{- $missing = append $missing $need }}{{- end }}
{{- end }}
{{- if $missing }}
{{- fail (printf "components[github-provider-kog-config]: componentValues.github-provider-kog.kinds omits %s, which this component requires. It renders a RepositoryConfiguration and a PullRequestConfiguration, so both RestDefinitions must exist. Neither `deps` nor `requiresApiGroups: github.krateo.io` can detect this — the component is Ready and the API group exists — so without this guard the chart would fail with an endless chart-inspector 500. Fix: add %s to componentValues.github-provider-kog.kinds, or leave `kinds` empty to render all 32, or set features.githubProviderKogConfig=false." (join ", " $missing) (join " and " $missing)) }}
{{- end }}{{- end }}{{- end }}
{{- if ne $cdNamespace $.Values.namespaces.krateo }}
{{/* Emit the namespace unless it already exists and is not this release's (helm cannot adopt it,
     and an existing namespace needs nothing). keep: uninstalling the installer must not delete a
     namespace other things may have been put into; core-provider removes the definition's own
     controller objects when the definition goes. */}}
{{- $existingNs := lookup "v1" "Namespace" "" $cdNamespace }}
{{- if or (not $existingNs) (eq (dig "metadata" "annotations" "meta.helm.sh/release-name" "" $existingNs) $.Release.Name) }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $cdNamespace }}
  labels:
    krateo.io/blueprint: {{ $c.name }}
  annotations:
    helm.sh/resource-policy: keep
{{- end }}
{{- with $c.readerGroups }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: blueprint-readers
  namespace: {{ $cdNamespace }}
rules:
  - apiGroups: ["core.krateo.io"]
    resources: ["compositiondefinitions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: blueprint-readers
  namespace: {{ $cdNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: blueprint-readers
subjects:
  {{- range $g := . }}
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: {{ $g | quote }}
  {{- end }}
{{- end }}
{{- end }}
---
apiVersion: core.krateo.io/v1alpha1
kind: CompositionDefinition
metadata:
  name: {{ $c.name }}
  namespace: {{ $cdNamespace }}
  labels:
    # NB: app.kubernetes.io/managed-by is intentionally NOT set — helm forces it to
    # "Helm" on every release resource, so a chart-set value never converges and makes
    # the cdc reconcile churn a revision every cycle. Let helm own it.
    krateo.io/tier: {{ $c.tier }}
spec:
  chart:
    {{/* OCI: url = registry base + chart path (oci://…/charts/<chart>). Classic helm repo
         (chartRepo set): url is the repo ROOT — index.yaml lives at <root>/index.yaml and the chart
         name goes in spec.chart.repo below, so do NOT append it, else the fetch hits
         <root>/<chart>/index.yaml and 404s (installer#36). */}}
    url: {{ if $c.chartRepo }}{{ default $.Values.ociRepo $c.repo }}{{ else }}{{ default $.Values.ociRepo $c.repo }}/{{ default $c.name $c.chart }}{{ end }}
    version: {{ $c.version | quote }}
    {{- if $c.chartRepo }}
    repo: {{ $c.chartRepo | quote }}
    {{- end }}
    {{- include "inst.chartExtras" (list $ (default $.Values.ociRepo $c.repo)) | nindent 4 }}
  {{- with $c.apiRef }}
  {{/* S12 status projection, pass-through (acmp gate 4). Only a registerOnly catalog blueprint can
       use this, because for those the INSTALLER owns the CompositionDefinition -- a blueprint that
       ships its own CD (portal 1.6.68 / #383 does) sets these in its own chart and needs nothing
       here. Absent -> the CD renders byte-identically to before, which is why this is safe for all
       74 components.
       FLOOR, and it is a hard one: snowplow >= 1.12.38. #504 means no CompositionDefinition
       carrying spec.apiRef could reconcile on ANY snowplow 1.12.3x below that -- the field is
       BROKEN, not merely inert, so a cluster on an older snowplow will fail in a layer that looks
       unrelated. 057 and krateo-demo both run 1.12.56. */}}
  apiRef:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $c.statusDataTemplate }}
  {{/* Paired with apiRef: projects status fields (status.url, status.expiresAt, status.plan) onto
       the blueprint. Same registerOnly scope and the same snowplow floor. */}}
  statusDataTemplate:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $c.resources }}
  {{/* Per-Kind CDC controller resources. The core-provider chart's shared cdc.resources default
       (small, ~256Mi) suits most components; a component that renders many children (e.g. portal)
       sets its own here so its controller does not OOMKill on the cold reconcile. Absent -> the
       shared default applies and the CD renders byte-identically to before. */}}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}