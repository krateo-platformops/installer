# ---------------------------------------------------------------------------
# Krateo PlatformOps installer — umbrella orchestrator values
# ---------------------------------------------------------------------------
ociRepo: oci://ghcr.io/krateo-platformops/charts
# Registry credentials for pulling component charts from a PRIVATE/authenticated OCI
# registry. core-provider pulls each component chart IN-CLUSTER (and the umbrella's
# self-reconcile pulls this installer chart), so private repos need a passwordRef to a
# Secret living in namespaces.krateo. (The bootstrap `helm install` itself authenticates
# with your local `helm registry login`; this is only for the in-cluster pulls.)
# When enabled, every component CompositionDefinition + the installer one get
# spec.chart.credentials. Needed for the PRIVATE krateo-agentiko/* agent charts (repo-override pins); krateo-platformops/* is public.
registryAuth:
  enabled: false
  username: ""
  passwordRef:
    name: ""
    namespace: ""   # empty defaults to namespaces.krateo
    key: ""
  # IMAGE-pull, not just chart-pull. registryAuth is one credential; besides stamping
  # spec.chart.credentials for the in-cluster CHART pull, the installer DERIVES a matching
  # dockerconfigjson Secret from the same token(s) (templates/imagepull-secret.yaml) and injects it into
  # the components that ship PRIVATE krateo-agentiko IMAGES — autopilot's repo-mcp-server,
  # core-provider-agent's chart-gate-mcp-server, and agentgateway-policies' native-RBAC decider
  # (nativeRbac.image.pullSecrets) — so a full-fleet install needs NO manual ServiceAccount
  # patch. Works in BOTH modes: global (the token above) and registries[] (the entry matching each
  # component's repo, so the image-pull token is exactly the one that authorizes that registry). Leave
  # empty to auto-derive (Secret name `krateo-registry-image-pull`), or set to the name of a pre-existing
  # dockerconfigjson Secret in namespaces.krateo to supply your own.
  imagePullSecretName: ""
  # Skip TLS verification on the in-cluster chart pull (e.g. a self-signed registry).
  # Maps to CompositionDefinition spec.chart.insecureSkipVerifyTLS; independent of auth.
  insecureSkipVerifyTLS: false
  # Registry-keyed credentials for MULTI-registry installs (components can point at
  # different registries via `repo`). When `registries` is non-empty, each component's
  # chart-pull credentials are selected by matching its effective registry base (its
  # `repo`, else `ociRepo`) against an entry here; a component whose registry has NO entry
  # gets no credentials, so a token is never presented to a registry it does not belong to.
  # In this mode the global `username`/`passwordRef` above are ignored. When empty
  # (default), the legacy global credentials apply to every component unchanged.
  registries: []
  #   - repo: oci://ghcr.io/krateo-platformops/charts
  #     username: <user>
  #     passwordRef:
  #       name: platform-registry-pull
  #       namespace: ""          # empty defaults to namespaces.krateo
  #       key: token
  #   - repo: oci://ghcr.io/krateo-agentiko/charts
  #     username: <user>
  #     passwordRef:
  #       name: agentiko-registry-pull
  #       key: token

# Whether pass A (register component CompositionDefinitions) runs.
installDefinitions: true

# Bootstrap: bring up the Krateo composition engine (core-provider + its CRDs) as the
# umbrella's hook-weighted Helm subchart dependency, so a bare-cluster `helm install`
# self-bootstraps: the engine comes up first (CRDs at hook-weight -10, controller at -5,
# all with --wait), then core-provider reconciles the umbrella's own Composition and drives
# the lookup-gated rollout of everything in `components`.
# Set enabled=false when REGISTERING this umbrella on an already-running Krateo (the engine
# already exists; the subchart would be redundant).
bootstrap:
  coreProvider:
    # The engine subchart version is pinned in Chart.yaml (core-provider, app core-provider
    # 2.0.x — de-webhooked, needs k8s >= 1.36); this flag only toggles installing it.
    #
    # COMPOSITION-SAFE DEFAULT (false). This flag is the SOLE bootstrap-vs-composition mode switch
    # (self-bootstrap.yaml / bootstrap-teardown.yaml / post-delete-cleanup.yaml render when true;
    # definitions.yaml / compositions.yaml / secret.yaml / ordered-teardown.yaml render when false).
    # core-provider re-renders this chart in COMPOSITION mode using the Installer CR spec as values;
    # if that spec ever loses its `bootstrap` key (e.g. an agent edit that doesn't preserve the full
    # spec), a `true` default would silently fall back to BOOTSTRAP mode and wedge the install on
    # chart-inspector RBAC ownership conflicts. Defaulting to FALSE makes a missing key safe.
    # The REAL one-shot bootstrap `helm install` MUST opt in explicitly:
    #   helm install installer oci://ghcr.io/krateo-platformops/charts/installer --set bootstrap.coreProvider.enabled=true ...
    enabled: false
  # Honest `deployed`: when true, the bootstrap adds a final wave that blocks until the Installer CR
  # is Synced, so helm marks the release `deployed` only once the platform actually converged. OFF by
  # default because it re-adds a long block (widening the client-interruption window) that the fast
  # default deliberately avoids — the fully-decoupled promote-on-Synced belongs in a finalizer outside
  # the helm hook, not a hook wave. See self-bootstrap.yaml wave header.
  waitForSynced: false
# Subchart value passthroughs (only used when the matching bootstrap flag is enabled).
# core-provider takes no overrides by default (omit = chart defaults).
# NOTE: the ClickHouse + MongoDB observability operators are no longer bootstrap subcharts —
# they are installed as `observability`-gated compositions (clickhouse-operator,
# mongodb-operator in `components`, wrapped from krateo-platformops/clickstack-operators-chart),
# so enabling observability at runtime brings them up first. Their admission webhooks are
# disabled in the wrapper charts' own defaults (so no cert-issuer dependency).
# kagent is likewise installed as two compositions — `kagent-crds` then `kagent` (see the
# components list); the sample-agent disabling lives in the kagent wrapper chart's defaults.

# Bootstrap engine (core-provider subchart) values. Engine OTLP export is OFF by default
# (otel.enabled=false in the subchart) and EVERY OTEL_* env is gated on that flag, so this endpoint
# is inert and byte-identical until export is turned on. It is committed here as the ONE correct
# target so no per-operator deploy value can drift (#229): the OTel collector DAEMONSET that the
# installer itself deploys is the only one with an OTLP :4318 listener — the gateway
# (`...-deployment-...`) is a k8s_cluster/k8sobjects scraper and refuses :4318. To turn on engine
# telemetry, set `core-provider.otel.enabled=true` at deploy time and DO NOT also pass
# `otel.endpoint` — inherit this default so it stays correct across redeploys. (Endpoint namespace
# is namespaces.krateo's default `krateo-system`; the subchart reads endpoint literally — a
# non-default krateo namespace needs an explicit endpoint override.)
core-provider:
  otel:
    endpoint: http://otel-collector-daemonset-opentelemetry-collector.krateo-system.svc:4318

# Namespaces the umbrella manages. The observability stack (ClickStack, collectors,
# MCP, agents) now runs entirely in `krateo` — there is no separate clickhouse
# namespace anymore (the install.sh-era clickhouse-system split is gone).
namespaces:
  krateo: krateo-system

# Exposure model for browser-facing components (authn, snowplow, frontend, hyperdx,
# sse-proxy). Replaces the installer's `var` Service-IP/port extraction.
#   NodePort | LoadBalancer -> resolved via Helm `lookup` at reconcile time
#   Gateway -> Services stay ClusterIP; the installer emits one Gateway API HTTPRoute per
#              exposed component, attached to a BYO Gateway (gatewayRef); hostnames from baseDomain.
exposure:
  type: LoadBalancer      # NodePort | LoadBalancer | Gateway
  # port: 80
  # Optional. Overrides the single port that browser-facing components are exposed on.
  # When set it drives BOTH:
  #   - the Service port of every `expose: true` component that uses a top-level `service`
  #     (authn, snowplow, frontend, sse-proxy) — the LoadBalancer/NodePort listens here;
  #   - the frontend config.json peer URLs (http://<lb-ip>:<port>), so the SPA reaches the
  #     exposed peers on the same port.
  # Unset (default) => each component keeps its per-component `exposePort` (authn 8082,
  # snowplow 8081, frontend/sse-proxy 8080). Components with a nested Service (kagent) or
  # their own LoadBalancer (hyperdx) are not covered here — set those via componentValues.
  # Ignored when type=Gateway (routing is by hostname).
  #
  # --- type: Gateway only (Gateway API HTTPRoute per exposed component) ---
  # PRECONDITION: the Gateway API CRDs + a Gateway (agentgateway / BYO) must already exist;
  # the installer creates neither. Emitted HTTPRoutes are gated on the HTTPRoute CRD being
  # served, so setting Gateway without the CRDs is inert (no wedge), not a hard failure.
  # REQUIRED when type=Gateway: gatewayRef.name AND a host source (baseDomain or a per-component
  # hosts override). With neither, no routes are emitted and the frontend keeps its localhost
  # dev-defaults — a silent misconfiguration, so set both.
  # gatewayRef:
  #   name: krateo-gateway
  #   namespace: krateo-system    # empty defaults to namespaces.krateo
  # baseDomain: example.com       # -> authn.example.com, snowplow.example.com, sse-proxy.example.com
  # hosts:                        # per-component hostname overrides (keys are component names)
  #   frontend: portal.example.com

# Feature flags (carried over from the installer chart).
features:
  coreProvider: true              # engine-present MARKER: core-provider is always-on via bootstrap (gates no component here)
  coreAgents: false                # base agent layer: kagent + model-configs (the fleet's ModelConfigs) + installer-agent + krateo-autopilot (which ships repo-mcp-server, the fleet's grounding server) + incident-agent (alert root-cause analysis)
  specialistAgents: false          # the 5 component specialist agents + clickhouse-mcp (needs coreAgents)
  codegenAgents: false             # OPT-IN codegen/conversion specialists (code-analysis, ansible-to-operator, tf-provider-to-operator, tf-to-helm); needs coreAgents
  oasgenProvider: true            # oasgen-provider
  portal: true                    # the non-agent platform: authn -> snowplow -> frontend -> portal + portal-starter
                                  #   + the observability stack (clickhouse/mongo operators, krateo-observability,
                                  #   otel collectors, sse-proxy) — the portal's events bell consumes sse-proxy.
  ingress: false                   # OPT-IN edge layer: external-dns + cert-manager-issuers (from krateo-blueprints).
                                  #   default off — the base install pulls nothing from krateo-blueprints unless enabled.
                                  #   Preconditions when on: external-dns needs its provider Secret out-of-band; the
                                  #   cert-manager-issuers ACME HTTP-01 solver assumes the Gateway API edge is present.
  agentGateway: false              # OPT-IN: agentgateway in front of the kagent fleet — JWT auth + per-user RBAC over
                                  #   agents, MCP tools and A2A delegation, PLUS guardrails on their LLM traffic (PII
                                  #   and secret masking, prompt-injection blocking, and optional OpenAI moderation /
                                  #   Google Model Armor / AWS Bedrock Guardrails / your own webhook). A valid token
                                  #   becomes MANDATORY on every agent endpoint, and the gateway lands on the critical
                                  #   path of every agent turn, so it never turns on through an upgrade. Needs
                                  #   coreAgents, and an issuer whose JWKS the gateway trusts (authn, via
                                  #   features.portal, by default).
                                  #   Every setting is the agentgateway-policies chart's own:
                                  #   componentValues.agentgateway-policies — including componentValues.
                                  #   agentgateway-policies.guardrails.enabled, the single switch that turns the
                                  #   guardrail layer off and on. Turning off the LLM ROUTE itself
                                  #   (componentValues.agentgateway-policies.llm.enabled=false) leaves the Gateway with no
                                  #   route to send model calls to, and the installer pairs that for you: the fleet's
                                  #   ModelConfigs are pointed straight back at the provider (componentValues.
                                  #   model-configs.agentgateway.modelRoute.enabled=false, fill-if-absent, so an explicit
                                  #   override still wins).

# HITL approval gate for the autopilot's mutating Kubernetes tools. true (default)=
# pause for human approval before any cluster change; false=autonomous remediation.
hitlApproval: true

# Gemini Vertex AI for the agent fleet (functional LLM, no API key).
# When enabled, the model-configs ModelConfigs use provider GeminiVertexAI with
# Application Default Credentials: the kagent agent pods authenticate to Vertex via the
# GKE node SA token from the metadata server. Requirements on the node pool:
#   - OAuth scope https://www.googleapis.com/auth/cloud-platform
#   - the node SA has an IAM role covering aiplatform.* (roles/aiplatform.user or roles/editor)
# No API key and no downloaded SA-key file are needed. Injected into every agent Composition spec
# by templates/compositions.yaml (components pinned `agent: true`, plus the model owner) —
# model-configs selects the provider with it, the agent charts set up their pods' ADC with it.
vertexAI:
  enabled: true
  # REQUIRED when enabled: set to your own GCP project hosting Vertex AI
  # (e.g. --set vertexAI.projectID=<your-gcp-project>). No default — must be provided per-install.
  projectID: ""
  # `global` is Google's recommended endpoint for Gemini 2.5 — it routes across regions instead of
  # pinning one regional Dynamic Shared Quota pool, giving the best availability / lowest 429 rate
  # for the agent fan-out. Override per-install with --set vertexAI.location=<region> if you need
  # regional data residency.
  location: global
  # secretName + secretKey: portable explicit-key ADC. Set secretName to a k8s Secret (in the agent
  # namespace) holding the GCP service-account key JSON so agents authenticate to Vertex on ANY
  # cluster (kind/EKS/on-prem), not just GKE metadata/node-SA. Unset => metadata-server ADC.
  secretName: ""
  secretKey: key.json

# Local LLM (Ollama) — OPT-IN, off by default (vertexAI above stays the default). When enabled,
# the whole agent fleet runs on ONE local, no-cloud model instead of Gemini/Vertex: the model OWNER
# (model-configs, modelOwner:true) renders EVERY slot in its `models` map as provider Ollama
# pointing at `host`, with the model id from `model`. Nothing else needs wiring — each agent already
# references a slot by name (its component pin's `model:`), and on this path every one of those slots
# is a local-LLM ModelConfig.
# Point `host` at an in-cluster Ollama Service. Use a TOOL-CALLING-capable model (the agents are
# tool-heavy — k8s_patch_resource, helm_*): qwen3.6 is recommended; gemma4 works but is fragile;
# gemma <=3 cannot tool-call. See QUICKSTART "Run the agent layer on a local model (Ollama)".
localModel:
  enabled: false
  host: ""                 # e.g. http://ollama.ollama.svc.cluster.local:11434
  model: qwen3.6

# ---------------------------------------------------------------------------
# Per-component spec overrides, keyed by component name. Each entry is deep-merged
# into that component's rendered Composition spec (Pass B). The installer-computed
# wiring (service.type / config / vertexAI / hitlApproval) stays authoritative — it
# wins on any leaf conflict — so you can safely add anything else here (e.g.
# resources, replicaCount, service.annotations) and edit it in place on the live
# Installer composition; a direct kubectl edit of the component CR reverts.
# `<component>.imagePullSecrets` is FILL-IF-ABSENT instead, so an entry here wins.
# The fleet's model policy lives here too — see the `modelConfig.name` entries at the end.
# The autopilot orchestrator auto-attaches the deployed agent fleet (see krateo-autopilot below);
# no manual registration is needed. Add per-component overrides here too, e.g.:
#     snowplow:
#       replicaCount: 2
componentValues:
  # Portal Builder publishes its pages to ONE repo — the portal chart repo — so pin its destination.
  # The frontend default AUTOPILOT_PAGE_BUILDER_REPO ships as krateo-platformops/krateo-portal-chart,
  # which only 301-redirects; the canonical repo is krateo-platformops/portal. (The KOG/controller and
  # blueprint builders are PER-ARTIFACT — each new controller/blueprint gets its own repo, chosen per
  # publish via the claim's target.owner/repo, so they are NOT a single fixed value here; the frontend
  # per-artifact emission + its wrong hardcoded fallbacks are tracked in krateo-platformops/frontend.)
  frontend:
    config:
      AUTOPILOT_PAGE_BUILDER_REPO: krateo-platformops/portal
  # Pin the kagent composition's resource names to a fixed "kagent" prefix (instead of the
  # core-provider-generated release name like kagent-<hash>). The kagent tool server is named
  # "{{ kagent.fullname }}-tool-server"; the autopilot/installer-agent/k8s-agent/helm-agent all
  # reference the RemoteMCPServer "kagent-tool-server" by the kagent default-install convention,
  # so without a fixed name kagent fails to compile them ("RemoteMCPServer kagent-tool-server not found").
  kagent:
    kagentapp:
      fullnameOverride: kagent
      # OTel export for the agents is OFF by default (omitted => byte-identical install). The
      # kagent controller forwards its OTEL_* env to every agent pod it deploys, so to stream agent
      # traces + GenAI token metrics to the observability stack, uncomment and point at the collector:
      #   otel:
      #     tracing:
      #       enabled: true
      #       exporter:
      #         otlp: { endpoint: "http://<otel-collector>.<ns>.svc:4318", protocol: http/protobuf, insecure: true }
      #   controller:
      #     env:
      #       OTEL_METRICS_ENABLED: "true"
      #       OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: "http://<otel-collector>.<ns>.svc:4318"
  # OTel export for the engine + every cdc is OFF by default (byte-identical when omitted). To
  # stream reconcile metrics + traces (e.g. the reconciliation-throughput series) to the
  # observability stack, set the top-level `core-provider:` bootstrap subchart values (NOT a
  # componentValues entry — the engine is a subchart, not a component):
  #   core-provider:
  #     otel:
  #       enabled: true
  #       tracing: true
  #       endpoint: "http://<otel-collector>.<ns>.svc:4318"
  #       protocol: http/protobuf
  krateo-autopilot:
    # ORCHESTRATOR BY DEFAULT: the autopilot auto-attaches EVERY deployed agent as an A2A
    # sub-agent — the installer derives extraAgents from the feature-enabled `agent`
    # components (excluding the autopilot itself). So the enterprise profile wires the whole fleet
    # (installer/authn/snowplow/frontend/clickstack/core-provider agents) and agent-only wires just
    # the installer-agent — no manual list needed, and it adapts to whatever profile is enabled.
    # To pin an EXPLICIT set instead, list them here (still gated to deployed agents); an explicit
    # `extraAgents: []` means standalone (no orchestration).
    #   extraAgents:
    #     - name: installer-agent
    #     - name: krateo-core-provider-agent
    # Generic Kubernetes + Helm sub-agents (built into the autopilot chart, gemini-flash) — ON for
    # every profile so the orchestrator can delegate raw cluster/Helm work alongside the krateo
    # specialists. Their mutations are HITL-gated by hitlApproval. Deep-merges with the chart's
    # `agents` defaults (keeps agents.autopilot on, flips k8s/helm on).
    agents:
      k8s:
        enabled: true
      helm:
        enabled: true

  # ---- Fleet model policy -------------------------------------------------
  # WHICH ModelConfig each agent runs on. The names are slots the model-configs component
  # renders (its `models.<alias>.name`); to change a slot's underlying model id instead, set
  # componentValues.model-configs.models.<alias>.model. RENAMING a slot means changing both — the
  # name here is a literal, not an alias resolved for you.
  # These are plain values, so `--set componentValues.<agent>.modelConfig.name=gemini-flash`
  # retargets one agent against a FIXED installer release. Deep-merged into the Composition
  # spec, where componentValues wins on any leaf conflict.
  # Not set for krateo-autopilot: that chart carries THREE agents on two different slots, so its
  # choice is per-sub-agent — componentValues.krateo-autopilot.agents.<name>.modelConfig
  # (agents.autopilot -> gemini-pro for intent classification, agents.k8s/helm -> gemini-flash).
  # The agent charts themselves default to kagent's inert default-model-config, a reference that
  # always resolves — so a slot rename can never leave an agent pointing at nothing.

  # pro: the heavy/reasoning agent of the fleet — it reads the installer's own values surface and
  # schema and reasons about a multi-component DAG.
  installer-agent:
    modelConfig:
      name: gemini-pro
  # pro: root-cause analysis is judgment work (rank competing causes, notice a missing piece of
  # evidence, refuse to guess) where the flash tier fabricates.
  incident-agent:
    modelConfig:
      name: gemini-pro
  # pro: an AUTHORING specialist — it composes RESTActions (+ widget apiRef wiring), the same
  # authoring role that runs frontend-agent on pro. Authoring valid CRs and reading apiserver
  # validation errors needs the stronger model.
  snowplow-agent:
    modelConfig:
      name: gemini-pro
  # pro: this agent AUTHORS + self-validates widget CRs. Authoring valid CRs and reading dry-run
  # errors needs the stronger model; the author->dry-run->fix loop in its prompt is the
  # correctness backstop.
  frontend-agent:
    modelConfig:
      name: gemini-pro
  # pro: an AUTHORING specialist. It composes multi-resource charts and then reads structured
  # validator output — JSON pointers, CEL messages — and edits the right template in response.
  # That read-diagnose-fix loop is what the stronger tier buys; on flash the loop burns
  # iterations re-fixing the same file.
  core-provider-agent:
    modelConfig:
      name: gemini-pro
  authn-agent:
    modelConfig:
      name: gemini-flash
  clickstack-agent:
    modelConfig:
      name: gemini-flash

# ---------------------------------------------------------------------------
# Component DAG. `deps` = component names whose Compositions must be Ready=True
# before this one's Composition is emitted. Versions pinned to installer 2.7.0.
# `repo` overrides ociRepo when a component lives elsewhere; `feature` gates it.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# component pins (`components:`) MOVED to files/component-pins.yaml — they are chart-managed
# and sourced via .Files.Get (the inst.componentsYaml helper), NOT values, so they are chart
# CONTENT immune to `helm upgrade --reuse-values`: a chart bump always propagates its component
# version/repo/dep pins on upgrade (previously --reuse-values froze them and stalled upgrades).
# User-tunable per-component overrides remain here under `componentValues:` above.
# ---------------------------------------------------------------------------
