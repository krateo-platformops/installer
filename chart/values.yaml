# ---------------------------------------------------------------------------
# Krateo PlatformOps installer — umbrella orchestrator values
# ---------------------------------------------------------------------------
ociRepo: oci://ghcr.io/krateo-platformops/charts
# Registry credentials for pulling component charts from a PRIVATE/authenticated OCI
# registry. core-provider pulls each component chart IN-CLUSTER (and the umbrella's
# self-reconcile pulls this installer chart), so private repos need a passwordRef to a
# Secret living in namespaces.krateo. (The bootstrap `helm install` itself authenticates
# with your local `helm registry login`; this is only for the in-cluster pulls.)
# When enabled, every component CompositionDefinition + the installer one get
# spec.chart.credentials. Needed for the PRIVATE krateo-agentiko/* agent charts (repo-override pins); krateo-platformops/* is public.
registryAuth:
  enabled: false
  username: ""
  passwordRef:
    name: ""
    namespace: ""   # empty defaults to namespaces.krateo
    key: ""
  # IMAGE-pull, not just chart-pull. registryAuth is one credential; besides stamping
  # spec.chart.credentials for the in-cluster CHART pull, the installer DERIVES a matching
  # dockerconfigjson Secret from the same token(s) (templates/imagepull-secret.yaml) and injects it into
  # the components that ship PRIVATE krateo-agentiko IMAGES — autopilot's repo-mcp-server,
  # core-provider-agent's chart-gate-mcp-server, and agentgateway-policies' cert-replay hop
  # (certReplayHop.image.pullSecrets) — so a full-fleet install needs NO manual ServiceAccount
  # patch. Works in BOTH modes: global (the token above) and registries[] (the entry matching each
  # component's repo, so the image-pull token is exactly the one that authorizes that registry). Leave
  # empty to auto-derive (Secret name `krateo-registry-image-pull`), or set to the name of a pre-existing
  # dockerconfigjson Secret in namespaces.krateo to supply your own.
  imagePullSecretName: ""
  # Skip TLS verification on the in-cluster chart pull (e.g. a self-signed registry).
  # Maps to CompositionDefinition spec.chart.insecureSkipVerifyTLS; independent of auth.
  insecureSkipVerifyTLS: false
  # Registry-keyed credentials for MULTI-registry installs (components can point at
  # different registries via `repo`). When `registries` is non-empty, each component's
  # chart-pull credentials are selected by matching its effective registry base (its
  # `repo`, else `ociRepo`) against an entry here; a component whose registry has NO entry
  # gets no credentials, so a token is never presented to a registry it does not belong to.
  # In this mode the global `username`/`passwordRef` above are ignored. When empty
  # (default), the legacy global credentials apply to every component unchanged.
  registries: []
  #   - repo: oci://ghcr.io/krateo-platformops/charts
  #     username: <user>
  #     passwordRef:
  #       name: platform-registry-pull
  #       namespace: ""          # empty defaults to namespaces.krateo
  #       key: token
  #   - repo: oci://ghcr.io/krateo-agentiko/charts
  #     username: <user>
  #     passwordRef:
  #       name: agentiko-registry-pull
  #       key: token

# Whether pass A (register component CompositionDefinitions) runs.
installDefinitions: true

# Bootstrap: bring up the Krateo composition engine (core-provider + its CRDs) as the
# umbrella's hook-weighted Helm subchart dependency, so a bare-cluster `helm install`
# self-bootstraps: the engine comes up first (CRDs at hook-weight -10, controller at -5,
# all with --wait), then core-provider reconciles the umbrella's own Composition and drives
# the lookup-gated rollout of everything in `components`.
# Set enabled=false when REGISTERING this umbrella on an already-running Krateo (the engine
# already exists; the subchart would be redundant).
bootstrap:
  coreProvider:
    # The engine subchart version is pinned in Chart.yaml (core-provider, app core-provider
    # 2.0.x — de-webhooked, needs k8s >= 1.36); this flag only toggles installing it.
    #
    # COMPOSITION-SAFE DEFAULT (false). This flag is the SOLE bootstrap-vs-composition mode switch
    # (self-bootstrap.yaml / bootstrap-teardown.yaml / post-delete-cleanup.yaml render when true;
    # definitions.yaml / compositions.yaml / secret.yaml / ordered-teardown.yaml render when false).
    # core-provider re-renders this chart in COMPOSITION mode using the Installer CR spec as values;
    # if that spec ever loses its `bootstrap` key (e.g. an agent edit that doesn't preserve the full
    # spec), a `true` default would silently fall back to BOOTSTRAP mode and wedge the install on
    # chart-inspector RBAC ownership conflicts. Defaulting to FALSE makes a missing key safe.
    # The REAL one-shot bootstrap `helm install` MUST opt in explicitly:
    #   helm install installer oci://ghcr.io/krateo-platformops/charts/installer --set bootstrap.coreProvider.enabled=true ...
    enabled: false
  # Honest `deployed`: when true, the bootstrap adds a final wave that blocks until the Installer CR
  # is Synced, so helm marks the release `deployed` only once the platform actually converged. OFF by
  # default because it re-adds a long block (widening the client-interruption window) that the fast
  # default deliberately avoids — the fully-decoupled promote-on-Synced belongs in a finalizer outside
  # the helm hook, not a hook wave. See self-bootstrap.yaml wave header.
  waitForSynced: false
# Subchart value passthroughs (only used when the matching bootstrap flag is enabled).
# core-provider takes no overrides by default (omit = chart defaults).
# NOTE: the ClickHouse + MongoDB observability operators are no longer bootstrap subcharts —
# they are installed as `observability`-gated compositions (clickhouse-operator,
# mongodb-operator in `components`, wrapped from krateo-platformops/clickstack-operators-chart),
# so enabling observability at runtime brings them up first. Their admission webhooks are
# disabled in the wrapper charts' own defaults (so no cert-issuer dependency).
# kagent is likewise installed as two compositions — `kagent-crds` then `kagent` (see the
# components list); the sample-agent disabling lives in the kagent wrapper chart's defaults.

# Bootstrap engine (core-provider subchart) values. Engine OTLP export is OFF by default
# (otel.enabled=false in the subchart) and EVERY OTEL_* env is gated on that flag, so this endpoint
# is inert and byte-identical until export is turned on.
# THIS DEFAULT NAMED THE HEADLESS COLLECTOR UNTIL 0.3.563, AND THAT WAS WRONG. It used to say the
# headless Service was "the ONE correct target" and told operators NOT to pass their own endpoint.
# Inheriting it is what produces spans with no pod metadata: the headless Service's DNS spreads
# each controller's OTLP across every node agent, and each agent's k8sattributes is node-filtered
# by K8S_NODE_NAME, so a span landing on another node's agent is never matched to its pod and
# loses k8s.deployment.name and the rest. 057 carried an explicit -local override that silently
# protected it from this default; when I dropped that override (believing core-provider 2.13.80's
# #420 would then route node-local) the value fell back to HERE, and 72 of 74 per-version
# ConfigMaps got the headless endpoint with 0 of 71 cdc Deployments carrying HOST_IP. Measured,
# reverted, and fixed at the source rather than per cluster.
# PRECONDITION, and it is NOT free (core-provider corrected me on this): internalTrafficPolicy:
# Local routes ONLY to an agent on the sending pod's node and DROPS the traffic when there is
# none -- it does not fall back. The daemonset's tolerations are EMPTY, so a TAINTED node gets no
# agent and its controllers' spans are lost silently. Verified on 057 at 0.3.562: 4 nodes, none
# tainted, 4/4 with an agent pod, all 4 cdc-bearing nodes covered, ds desired=4 ready=4
# misscheduled=0. Re-check that on any cluster with taints or a partial daemonset.
# OPT-IN ALTERNATIVE on core-provider >= 2.13.79: set `core-provider.otel.endpoint: ""` to get
# otlpNodeLocal, which exports to http://$(HOST_IP):4318 from the pod's own fieldRef and depends
# on no Service name at all. It needs hostPort 4318 on the daemonset (present on 057: 4318 and
# 4317) and shares the SAME node-coverage precondition above. After changing either way, read the
# endpoint the controllers actually RECEIVED -- preconditions for a route being usable are not
# evidence of the route taken, which is the whole lesson of this comment.
core-provider:
  otel:
    endpoint: http://otel-collector-daemonset-local.krateo-system.svc:4318

# Namespaces the umbrella manages. The observability stack (ClickStack, collectors,
# MCP, agents) now runs entirely in `krateo` — there is no separate clickhouse
# namespace anymore (the install.sh-era clickhouse-system split is gone).
namespaces:
  krateo: krateo-system

# Exposure model for browser-facing components (authn, snowplow, frontend, hyperdx,
# sse-proxy). Replaces the installer's `var` Service-IP/port extraction.
#   NodePort | LoadBalancer -> resolved via Helm `lookup` at reconcile time
#   Gateway -> Services stay ClusterIP; the installer emits one Gateway API HTTPRoute per
#              exposed component, attached to a BYO Gateway (gatewayRef); hostnames from baseDomain.
exposure:
  type: LoadBalancer      # NodePort | LoadBalancer | Gateway
  # port: 80
  # Optional. Overrides the single port that browser-facing components are exposed on.
  # When set it drives BOTH:
  #   - the Service port of every `expose: true` component that uses a top-level `service`
  #     (authn, snowplow, frontend, sse-proxy) — the LoadBalancer/NodePort listens here;
  #   - the frontend config.json peer URLs (http://<lb-ip>:<port>), so the SPA reaches the
  #     exposed peers on the same port.
  # Unset (default) => each component keeps its per-component `exposePort` (authn 8082,
  # snowplow 8081, frontend/sse-proxy 8080). Components with a nested Service (kagent) or
  # their own LoadBalancer (hyperdx) are not covered here — set those via componentValues.
  # Ignored when type=Gateway (routing is by hostname).
  #
  # --- type: Gateway only (Gateway API HTTPRoute per exposed component) ---
  # PRECONDITION: the Gateway API CRDs + a Gateway (agentgateway / BYO) must already exist;
  # the installer creates neither. Emitted HTTPRoutes are gated on the HTTPRoute CRD being
  # served, so setting Gateway without the CRDs is inert (no wedge), not a hard failure.
  # REQUIRED when type=Gateway: gatewayRef.name AND a host source (baseDomain or a per-component
  # hosts override). With neither, no routes are emitted and the frontend keeps its localhost
  # dev-defaults — a silent misconfiguration, so set both.
  # gatewayRef:
  #   name: krateo-gateway
  #   namespace: krateo-system    # empty defaults to namespaces.krateo
  # baseDomain: example.com       # -> authn.example.com, snowplow.example.com, sse-proxy.example.com
  # hosts:                        # per-component hostname overrides (keys are component names)
  #   frontend: portal.example.com
  #
  # gatewayMode: host             # host (default) | path
  # HOST (default): each exposed component gets its OWN hostname (above) and its own HTTPRoute,
  #   attached to the BYO gatewayRef — the classic host-based routing. The frontend config peer URLs
  #   become https://<host>. Requires baseDomain and/or hosts.
  # PATH: route the WHOLE portal stack (frontend/authn/snowplow/sse-proxy) through the AGENTGATEWAY on
  #   ONE listener at per-component paths — the portal is served at the gateway ORIGIN `/`, with
  #   /auth -> authn, /content -> snowplow, /events -> sse-proxy (the paths + rewrite + auth posture
  #   are chart content in component-pins.yaml: gatewayPath/gatewayRewrite/gatewayAuth). No per-
  #   component hostname is needed. The installer emits the route table onto the agentgateway-policies
  #   composition as spec.platformRoutes (the agentgateway-policies chart programs the listener from
  #   it), flips those four Services to ClusterIP, and computes the frontend peer URLs as
  #   http://<gateway-ip>:<platformPort><path> (e.g. http://<gw>/auth). The Autopilot A2A URL still
  #   targets the gateway's OWN listener (:8080), unchanged. gatewayMode=path applies only when
  #   type=Gateway (LoadBalancer/NodePort ignore it) and is INERT unless set to path.
  #
  # platformPort: 80              # the single listener port the path-mode routes are served on
  #   (default 80). Only used when type=Gateway AND gatewayMode=path; it is the port baked into the
  #   frontend peer URLs (http://<gateway-ip>:<platformPort><path>) and the platform-http listener the
  #   agentgateway-policies chart programs. Distinct from the gateway's OWN A2A listener port (8080),
  #   which the Autopilot URL keeps.
  #
  # tls:                          # PATH-MODE HTTPS (type=Gateway AND gatewayMode=path). Serve the whole
  #   enabled: true               #   single-origin portal over HTTPS on ONE hostname. When on:
  #   host: portal.example.com    #   - the gateway gains a platform-https:443 TLS-terminate listener bound
  #   certificateRef: portal-tls  #     to the certificateRef Secret (a kubernetes.io/tls Secret, e.g. from
  #                               #     cert-manager); the portal routes move onto it;
  #                               #   - the four browser URLs become https://<host>/… (same origin, no
  #                               #     mixed content) and AUTOPILOT_API_BASE_URL = https://<host> with an
  #                               #     /api/a2a route served on :443 (the JWT/RBAC edge is preserved);
  #                               #   Off (default) => everything stays http:// on platformPort, byte-identical.
  #                               #   Requires the certificateRef Secret + a DNS record for host → the gateway IP.
  #
  # voice: true                   # AUTOPILOT DICTATION, one knob (needs exposure.tls, path mode). Derives the
  #                               #   frontend's AUTOPILOT_VOICE_TRANSCRIBE_URL = https://<tls.host>/stt/v1/chat/
  #                               #   completions (no hardcoded host) AND turns on the /stt/v1 route
  #                               #   (agentgateway-policies stt.enabled). Fails if set without exposure.tls
  #                               #   (getUserMedia needs a secure context). Off => no voice UI, no /stt/v1 route.
  #
  # internalDataPlane: true       # CLOSE THE AGENT DATA PLANE (type=Gateway AND gatewayMode=path). By
  #                               #   default the single primary agentgateway (krateo-agent-gateway) exposes
  #                               #   EVERY listener on one LoadBalancer, so the agent listener (:8080 —
  #                               #   /llm/v1, /mcp, A2A) is internet-reachable next to the portal. When on,
  #                               #   the platform moves to a TWO-GATEWAY design: the primary agent gateway
  #                               #   (krateo-agent-gateway) is flipped to ClusterIP (all agent listeners
  #                               #   in-cluster only; the Service name/DNS the fleet + kagent proxy.url use is
  #                               #   unchanged) and a SEPARATE platform Gateway (krateo-agent-gateway-platform)
  #                               #   is provisioned as a LoadBalancer carrying ONLY the platform listeners
  #                               #   (portal :443/:80 + HyperDX :3000). The portal/HyperDX browser origins
  #                               #   resolve to that -platform LoadBalancer Service. /llm/v1 becomes
  #                               #   in-cluster-only — closes the open Vertex proxy at the source. No static
  #                               #   IP is ever required (the platform LoadBalancer takes a cloud-assigned
  #                               #   address). Off (default) => byte-identical.

# Feature flags (carried over from the installer chart).
#
# INSTALL-TIME ONLY: spec.features is applied when the platform is first installed. Editing a feature
# here and running `helm upgrade` has NO effect — the self-bootstrap upgrade merge-patch deliberately
# EXCLUDES features, preserving spec.features as live runtime state so an operator toggle isn't clobbered
# on every chart bump. To change a feature on a running platform, patch the CR (survives future upgrades):
#   kubectl patch installers.v<ver>.composition.krateo.io installer -n krateo-system \
#     --type merge -p '{"spec":{"features":{"<key>":true}}}'
features:
  coreProvider: true              # engine-present MARKER: core-provider is always-on via bootstrap (gates no component here)
  coreAgents: false                # base agent layer: kagent + model-configs (the fleet's ModelConfigs) + repo-mcp-server (the fleet's grounding server) + installer-agent + krateo-autopilot + incident-agent (alert root-cause analysis) + core-provider-agent (the sole blueprint author)
  specialistAgents: false          # the 4 component specialist agents + clickhouse-mcp + the alert/incident pipeline (alert-provider, incident-controller) + nightly-review (needs coreAgents)
  codegenAgents: false             # LEGACY, KEEP FALSE: the codegen specialists were retired in #144 and krateo-blueprint-agent is DRAINING behind this flag; enabling it redeploys a retired agent nothing routes to
  structureGraph: false            # OPT-IN structure-graph-mcp-server (code-structure grounding); needs coreAgents.
                                  #   Its consumers reference it off by default — set their
                                  #   mcpServers.structureGraph.enabled too, or nothing names the server.
  repoGraph: false                 # OPT-IN the repo-mcp-server DOMAIN-graph / OKF tools (graph_find, graph_map,
                                  #   graph_neighbors, graph_path, knowledge_lookup) — multi-hop structural,
                                  #   reverse-impact and curated-provenance answers grep cannot give. Deploys NO new
                                  #   component: flips a config layer on 3 EXISTING coreAgents components in LOCKSTEP
                                  #   (repo-mcp-server graph.enabled + krateo-autopilot & incident-agent toolNames, via
                                  #   each pin's graphToggle) so it can never half-enable into the silent server/agent
                                  #   mismatch. Needs coreAgents. Distinct from structureGraph (the code-STRUCTURE AST
                                  #   server). Default off: more grounding tools is not always better — measure first.
  oasgenProvider: true            # oasgen-provider
  openstack: false                # OPT-IN. Installs openstack-capabilities: the openstack-view /
                                  # -provision / -decommission / -compute-tier-guard ClusterRoles and
                                  # the compute-tier ValidatingAdmissionPolicy (failurePolicy Fail,
                                  # one validation). Per-cluster, only where OpenStack is offered, so
                                  # OFF by default. All six objects are CLUSTER-SCOPED, so the release
                                  # namespace is cosmetic for them -- but see the pin comment: the
                                  # blueprint's own handoff compares meta.helm.sh/release-namespace.
  portal: true                    # the non-agent platform: authn -> snowplow -> frontend -> portal + portal-starter
                                  #   + the observability stack (clickhouse/mongo operators, krateo-observability,
                                  #   otel collectors, sse-proxy) — the portal's events bell consumes sse-proxy.
  ingress: false                   # OPT-IN edge layer: gateway-api-crds + agentgateway + cert-manager + cert-manager-issuers
                                  #   (from krateo-blueprints). default off — the base install pulls nothing from krateo-blueprints
                                  #   unless enabled. Precondition: the cert-manager-issuers ACME HTTP-01 solver assumes the
                                  #   Gateway API edge is present. NOTE: external-dns moved to its own `externalDns` feature (#115),
                                  #   so a host-mode ingress install that also wants DNS enables BOTH ingress and externalDns.
  externalDns: false               # OPT-IN external-dns (#115): manage DNS records for the platform LoadBalancer + any annotated
                                  #   Service/Gateway via a DNS provider — STANDALONE (does NOT need features.ingress, so it works
                                  #   with the agentgateway-controller path). Configure the `externalDns` block below (provider +
                                  #   credentials env + domainFilters); pairs with exposure.tls.host (the platform gateway is annotated
                                  #   with that host so external-dns publishes a record following the LB IP — DNS-follows-LB, no static IP).
  agentGateway: false              # OPT-IN: agentgateway in front of the kagent fleet — JWT auth + per-user RBAC over
  # CloudNativePG for consumers other than Keycloak (kagent's Postgres). cloudnative-pg
  # names keycloak as its feature and cloudnativePg in alsoFeatures, so either turns it on.
  cloudnativePg: false
  configConnector: false          # OPT-IN Google Config Connector (operator + CRDs), for provisioning GCP
                                  #   resources from Compositions. Cluster mode by default: ONE Google service
                                  #   account for the whole cluster, authenticating with the key Secret named by
                                  #   componentValues.gcp-configconnector.configConnector.credentialSecretName.
                                  #   Namespaced mode needs Workload Identity and is NOT selectable with a key.
                                  #   agents, MCP tools and A2A delegation, PLUS guardrails on their LLM traffic (PII
                                  #   and secret masking, prompt-injection blocking, and optional OpenAI moderation /
                                  #   Google Model Armor / AWS Bedrock Guardrails / your own webhook). A valid token
                                  #   becomes MANDATORY on every agent endpoint, and the gateway lands on the critical
                                  #   path of every agent turn, so it never turns on through an upgrade. Needs
                                  #   coreAgents, and an issuer whose JWKS the gateway trusts (authn, via
                                  #   features.portal, by default).
                                  #   Every setting is the agentgateway-policies chart's own:
                                  #   componentValues.agentgateway-policies — including componentValues.
                                  #   agentgateway-policies.guardrails.enabled, the single switch that turns the
                                  #   guardrail layer off and on. Turning off the LLM ROUTE itself
                                  #   (componentValues.agentgateway-policies.llm.enabled=false) leaves the Gateway with no
                                  #   route to send model calls to, and the installer pairs that for you: the fleet's
                                  #   ModelConfigs are pointed straight back at the provider (componentValues.
                                  #   model-configs.agentgateway.modelRoute.enabled=false, fill-if-absent, so an explicit
                                  #   override still wins).
  auditWorm: false
  capabilityRoles: false     # OPT-IN. Adoption target: already hand-installed on demo at
                             # 0.6.2. Needs Kyverno only if tenantReader.enabled stays true.
  showback: false                 # OPT-IN tamper-EVIDENT mirror of the krateo_audit table (component
  identityLifecycle: false
  keycloak: false
  accessReview: false
                                  #   krateo-audit-worm). The audit table is ordinary ClickHouse — whoever can
                                  #   write it can rewrite it — so this keeps a separate WORM copy plus a
                                  #   hash-chained seal, and a verifier that reports RED when the chain breaks,
                                  #   the materialized view is dropped, or the seal table is truncated. A reset
                                  #   chain stays `tampered` permanently rather than re-sealing clean.
                                  #   Needs the krateo_audit table, which the daemonset collector's
                                  #   clickhouse/audit exporter creates — so it deps on otel-collector-daemonset,
                                  #   NOT on clickhouse-operator: the operator being Ready does not mean a
                                  #   ClickHouse instance exists. Enabling it early is safe; the seal Job fails
                                  #   loudly and its next schedule retries until the table appears.

# external-dns configuration (#115), applied when features.externalDns is on. A straight passthrough
# to the external-dns blueprint's curated surface. The platform gateway is annotated with
# exposure.tls.host automatically (compositions.yaml forcePaths gateway.platformHostname), so external-dns
# publishes/updates the DNS record for the portal following the LoadBalancer IP — no static IP, no manual
# record. Provider credentials go in `env` as a secretKeyRef (the operator creates the Secret out-of-band).
externalDns:
  provider:
    name: cloudflare              # cloudflare | aws | google | azure | ... (whatever the upstream chart supports)
  domainFilters: []               # zones external-dns may manage, e.g. [krateo.dev]. Empty => none (scope it).
  policy: upsert-only             # upsert-only (SAFE: never deletes records) | sync
  sources:                        # what external-dns watches for hostnames
    - service
    - gateway-httproute
  txtOwnerId: ""                  # ownership id for the TXT registry (records external-dns manages)
  env: []                         # provider credentials + tuning, e.g.:
                                  #   - name: CF_API_TOKEN
                                  #     valueFrom:
                                  #       secretKeyRef:
                                  #         name: cloudflare-api-token
                                  #         key: api-token

# HITL approval gate for the autopilot's mutating Kubernetes tools. true (default)=
# pause for human approval before any cluster change; false=autonomous remediation.
hitlApproval: true

# Gemini Vertex AI for the agent fleet (functional LLM, no API key).
# When enabled, the model-configs ModelConfigs use provider GeminiVertexAI with
# Application Default Credentials: the kagent agent pods authenticate to Vertex via the
# GKE node SA token from the metadata server. Requirements on the node pool:
#   - OAuth scope https://www.googleapis.com/auth/cloud-platform
#   - the node SA has an IAM role covering aiplatform.* (roles/aiplatform.user or roles/editor)
# No API key and no downloaded SA-key file are needed. Injected into every agent Composition spec
# by templates/compositions.yaml (components pinned `agent: true`, plus the model owner) —
# model-configs selects the provider with it, the agent charts set up their pods' ADC with it.
vertexAI:
  enabled: true
  # REQUIRED when enabled: set to your own GCP project hosting Vertex AI
  # (e.g. --set vertexAI.projectID=<your-gcp-project>). No default — must be provided per-install.
  projectID: ""
  # `global` is Google's recommended endpoint for Gemini 2.5 — it routes across regions instead of
  # pinning one regional Dynamic Shared Quota pool, giving the best availability / lowest 429 rate
  # for the agent fan-out. Override per-install with --set vertexAI.location=<region> if you need
  # regional data residency.
  location: global
  # secretName + secretKey: portable explicit-key ADC. Set secretName to a k8s Secret (in the agent
  # namespace) holding the GCP service-account key JSON so agents authenticate to Vertex on ANY
  # cluster (kind/EKS/on-prem), not just GKE metadata/node-SA. Unset => metadata-server ADC.
  secretName: ""
  secretKey: key.json

# Local LLM (Ollama) — OPT-IN, off by default (vertexAI above stays the default). When enabled,
# the whole agent fleet runs on ONE local, no-cloud model instead of Gemini/Vertex: the model OWNER
# (model-configs, modelOwner:true) renders EVERY slot in its `models` map as provider Ollama
# pointing at `host`, with the model id from `model`. Nothing else needs wiring — each agent already
# references a slot by name (its component pin's `model:`), and on this path every one of those slots
# is a local-LLM ModelConfig.
# Point `host` at an in-cluster Ollama Service. Use a TOOL-CALLING-capable model (the agents are
# tool-heavy — k8s_patch_resource, helm_*): qwen3.6 is recommended; gemma4 works but is fragile;
# gemma <=3 cannot tool-call. See QUICKSTART "Run the agent layer on a local model (Ollama)".
localModel:
  enabled: false
  host: ""                 # e.g. http://ollama.ollama.svc.cluster.local:11434
  model: qwen3.6

# ---------------------------------------------------------------------------
# Per-component spec overrides, keyed by component name. Each entry is deep-merged
# into that component's rendered Composition spec (Pass B). The installer-computed
# wiring (service.type / config / vertexAI / hitlApproval) stays authoritative — it
# wins on any leaf conflict — so you can safely add anything else here (e.g.
# resources, replicaCount, service.annotations) and edit it in place on the live
# Installer composition; a direct kubectl edit of the component CR reverts.
# `<component>.imagePullSecrets` is FILL-IF-ABSENT instead, so an entry here wins.
# The fleet's model policy lives here too — see the `modelConfig.name` entries at the end.
# The autopilot orchestrator auto-attaches the deployed agent fleet (see krateo-autopilot below);
# no manual registration is needed. Add per-component overrides here too, e.g.:
#     snowplow:
#       replicaCount: 2
componentValues:
  # The fourteen page components carry NO entries here, deliberately -- the charts own both keys.
  #
  # `dataNamespace` is GONE at portal 1.8.80: a page chart's release lives in the shell namespace, so
  # .Release.Namespace already means the shell and the key had nothing left to say. It is removed from
  # the schema too; with additionalProperties:false it would be an unknown key and the roll would FAIL,
  # not degrade.
  #
  # `namespace` and `readerGroups` both come from each page chart's own values.yaml. Restating them
  # here is the drift half of a trap worth naming: crdgen propagates a chart schema `default:` into the
  # generated composition CRD, where the apiserver MATERIALISES it into the leaf CR spec -- measured at
  # 1.8.78, the marketplacepages CRD defaulted readerGroups to ["admins"] and the live CR carried
  # readerGroups: [admins] with nothing having written it. A value set here would therefore have been
  # fighting a CRD default rather than a chart default. At 1.8.80 `readerGroups` is defaultless in all
  # fourteen schemas (so an omitted grant renders no Role subjects -- it fails CLOSED and visibly),
  # while `namespace` keeps its default because a namespace is structure, not authorization.
  #
  # The devs grant therefore ships WITH THE CHARTS, not from here: dashboard/compositions/blueprints/
  # resources/search-page carry readerGroups [admins, devs]; the other nine carry [admins]. Per #261
  # that is narrower than the pre-split state -- devs loses settings, builders, clusters, reviews,
  # observability and agents, which it could see while all 72 flexes lived in krateo-system.
  #
  # Each block IS declared in values.schema.json, with every chart key and no default, so an install
  # can still move a page or grant another group (acmp's tenant work needs portal.readerGroups above
  # all: the chrome is the floor beneath every page grant). An UNDECLARED key is not passed through --
  # it is REJECTED.
  # The portal's Agents sidebar entry and its /agents routes, which live in the SEPARATE
  # portal-agents chart this installer pins beside it. The portal CHART defaults this false so a
  # standalone install cannot show a nav entry whose pages are absent; this installer always
  # ships both, so here it is true.
  #
  # IT HAS TO BE SEEDED HERE, not left to the schema default. A `default` on
  # componentValues.portal.agents does not reach the component when componentValues.portal itself
  # is absent from these values — the expansion never descends into a parent that is not there.
  # Verified the hard way on krateo-057: with only the schema default, the portal release rendered
  # config.agents={enabled:false} (the PORTAL chart's own default) and /agents 404'd while
  # portal-agents was installed and its five page CRs were live.
  portal:
    agents:
      enabled: true
  frontend:
    config:
      # THE SPEAK-BACK VOICE. A Cloud TTS voice serves exactly ONE language, and the code takes the
      # languageCode from the voice name's own leading <lang>-<REGION> — so the name decides what
      # language the synthesiser thinks it is reading.
      #
      # This was en-US-Chirp3-HD-Achernar (the chart default) on an install whose agent answers in
      # Italian, which is why speak-back sounded like an English speaker reading Italian: English
      # phonetics applied to Italian words. Naming the Italian voice of the same character fixes
      # the PROSE.
      #
      # It does NOT fix the jargon: an it-IT voice Italianises `Deployment` and `namespace`. No
      # locale-pinned Chirp voice can get both halves — that needs Gemini-TTS, whose input.prompt
      # can ask for Italian delivery with English pronunciation of the technical terms
      # (krateo-platformops/frontend#246 adds the fields; it is not deployed yet).
      AUTOPILOT_VOICE_NAME: it-IT-Chirp3-HD-Achernar
  agentgateway-policies:
    # The kagent dashboard's auth hop. On because kagent-ui is otherwise unusable behind the
    # gateway: the controller reads identity only from a bearer and kagent-ui sends none.
    # Here rather than as a values.schema.json default: structural defaulting never creates an
    # absent parent object, so a default under uiTokenHop would never materialise.
    uiTokenHop:
      enabled: true
    networkPolicy:
      # Containment for kagent-ui is OPT-IN even with the hop on: it cuts the portal's /autopilot/
      # proxy, which the rail still uses whenever AUTOPILOT_API_BASE_URL could not be computed.
      ui:
        enabled: false
  # Pin the kagent composition's resource names to a fixed "kagent" prefix (instead of the
  # core-provider-generated release name like kagent-<hash>). The kagent tool server is named
  # "{{ kagent.fullname }}-tool-server"; the autopilot/installer-agent/k8s-agent/helm-agent all
  # reference the RemoteMCPServer "kagent-tool-server" by the kagent default-install convention,
  # so without a fixed name kagent fails to compile them ("RemoteMCPServer kagent-tool-server not found").
  kagent:
    kagentapp:
      fullnameOverride: kagent
      # OTel export for the agents is OFF by default (omitted => byte-identical install). The
      # kagent controller forwards its OTEL_* env to every agent pod it deploys, so to stream agent
      # traces + GenAI token metrics to the observability stack, uncomment and point at the collector:
      #   otel:
      #     tracing:
      #       enabled: true
      #       exporter:
      #         otlp: { endpoint: "http://<otel-collector>.<ns>.svc:4318", protocol: http/protobuf, insecure: true }
      #   controller:
      #     env:
      #       OTEL_METRICS_ENABLED: "true"
      #       OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: "http://<otel-collector>.<ns>.svc:4318"
  # OTel export for the engine + every cdc is OFF by default (byte-identical when omitted). To
  # stream reconcile metrics + traces (e.g. the reconciliation-throughput series) to the
  # observability stack, set the top-level `core-provider:` bootstrap subchart values (NOT a
  # componentValues entry — the engine is a subchart, not a component):
  #   core-provider:
  #     otel:
  #       enabled: true
  #       tracing: true
  #       endpoint: "http://<otel-collector>.<ns>.svc:4318"
  #       protocol: http/protobuf
  keycloak-config-kog:
    # BOOTSTRAP MODE. The keycloak blueprint creates Secret keycloak-bootstrap-service alongside the
    # instance, and that service account is how the KOG authenticates as admin. The alternative --
    # externalSecret mode with a pre-provisioned client credential -- needs Secret
    # keycloak-kog-client, which nothing in this platform creates. Measured on krateo-demo
    # 2026-11-11: with the chart defaults the KOG sat in externalSecret mode pointing at an
    # absent keycloak-kog-client AND an endpoint in a namespace that does not exist, so both admin
    # ExternalSecrets stayed SecretSyncedError and the KOG reconciled nothing.
    #
    # DO NOT add auth.externalSecret.enabled: false here. Bootstrap is a SUB-MODE of externalSecret:
    # the ExternalSecrets and the Webhook generator render only when externalSecret.enabled is true,
    # so disabling it means nothing mints a token at all. It stays at the chart's default (true).
    #
    # auth.bootstrap.namespace and auth.externalSecret.tokenEndpoint are NOT set here: they depend on
    # namespaces.krateo and are derived by inst.componentValuesResolved. Only the mode is constant.
    auth:
      bootstrap:
        enabled: true
  keycloak:
    # REQUIRED ON THE COMPOSITION CR, NOT MERELY USEFUL. keycloak 0.2.3's values.schema.json
    # carries a root-level `required: [keycloak, db]`, and crdgen turns that into mandatory
    # fields on the Keycloak Composition CR. The umbrella emits that CR carrying only what
    # componentValues supplies -- the chart's OWN values.yaml defaults do not populate it --
    # so omitting these makes the apiserver reject the object:
    #
    #   Keycloak.composition.krateo.io "keycloak" is invalid:
    #     [spec.db: Required value, spec.keycloak: Required value]
    #
    # and because that rejection happens inside the Installer composition's own helm reconcile,
    # it stalls EVERY component rather than just Keycloak. Measured on krateo-demo 2026-11-11 at
    # 0.3.582: Installer Synced=False/ReconcileError with all 108 managed children frozen, while
    # keycloak-operator, cloudnative-pg and external-secrets were individually healthy.
    #
    # These are the STRUCTURAL values only, and they live here rather than in
    # values.schema.json on purpose: a `default:` in the schema is written into the Installer CR
    # itself, which makes it a silent live override that cannot be removed from values.
    #
    # `keycloak.hostname` is deliberately NOT defaulted -- it is per-cluster. The chart's own
    # default is the placeholder https://keycloak.example.com, and an issuer URL that does not
    # match what users actually reach makes every OIDC validation fail. Set it per cluster when
    # enabling features.keycloak.
    db:
      vendor: postgres
      database: keycloak
      provider: cloudnativepg
    keycloak:
      name: keycloak
      instances: 1
  # ---- Fleet model policy -------------------------------------------------
  # WHICH ModelConfig each agent runs on. The names are slots the model-configs component
  # renders (its `models.<alias>.name`); to change a slot's underlying model id instead, set
  # componentValues.model-configs.models.<alias>.model. RENAMING a slot means changing both — the
  # name here is a literal, not an alias resolved for you.
  # These are plain values, so `--set componentValues.<agent>.modelConfig.name=gemini-flash`
  # retargets one agent against a FIXED installer release. Deep-merged into the Composition
  # spec, where componentValues wins on any leaf conflict.
  # Not set for krateo-autopilot: that chart carries THREE agents on two different slots, so its
  # choice is per-sub-agent — componentValues.krateo-autopilot.agents.<name>.modelConfig
  # (agents.autopilot -> gemini-pro for intent classification, agents.k8s/helm -> gemini-flash).
  # The agent charts themselves default to kagent's inert default-model-config, a reference that
  # always resolves — so a slot rename can never leave an agent pointing at nothing.

  # NOTE (2026-11-13): every fleet agent below NAMES the gemini-flash slot. All THREE slots resolve
  # to the SAME model (gemini-flash, gemini-pro and gemini-flash-low -> gemini-4-hydrogen; no
  # current-generation pro is served), so naming `gemini-pro` was a silent lever — a change to
  # models.pro.model would have relocated the whole fleet with no signal. The `gemini-pro` slot stays
  # DEFINED but UNREFERENCED (do NOT retire it) — reserved so a real reasoning tier has somewhere to
  # land. The `pro-tier candidate:` lines below record which agents would benefit from that stronger
  # model (reasoning/authoring work) — i.e. the ones to move back when such a tier exists.

  # The model each SLOT resolves to. The agents below name slots (`gemini-flash`); this is the only
  # place the underlying model id is chosen. Set on 2026-11-13, moving all three slots together from
  # the chart's default `gemini-3.8-flash` to `gemini-4-hydrogen`.
  #
  # ALL THREE, not just `flash`, and deliberately: model-configs 0.1.2 defaults every slot to the
  # same model, so moving only the referenced one would silently make `pro` and `flash-low` diverge
  # from it. `pro` is DEFINED but UNREFERENCED (reserved for a real reasoning tier).
  #
  # `flashLow` additionally carries `reasoningEffort: low`, which is NOT declarable here (per-slot
  # properties are name/model/provider only) and does not need to be: setting `model` alone
  # deep-merges, so the chart's own value is untouched. VERIFIED by rendering model-configs 0.1.2
  # with these three overrides and with none, both on the ROUTE PATH -- the only path that emits it:
  #   overrides:  gemini-flash/pro gemini-4-hydrogen  gemini-flash-low gemini-4-hydrogen + effort low
  #   control:    gemini-flash/pro gemini-3.8-flash   gemini-flash-low gemini-3.8-flash  + effort low
  # so the model id is the ONLY difference. The control also reproduces krateo-057's live objects
  # exactly, which is what makes the render trustworthy rather than merely green.
  #
  # `reasoningEffort` is emitted only when agentgateway's modelRoute is on, and that same branch is
  # what forces `provider: "OpenAI"` -- which is why the LIVE objects say OpenAI rather than Gemini.
  #
  # `provider` IS NOT TOUCHED. The ModelConfig CRD carries 30 CEL rules, and the ones that bite are
  # all provider-consistency rules of the form `has(self.<x>) && provider != '<X>'`. There is NO
  # immutability rule on `spec.model`, so this change is an ordinary update. A provider switch would
  # be the dangerous edit, not this one.
  #
  # UNVERIFIED, AND THE ONE REAL RISK: that `gemini-4-hydrogen` is actually served. The model id is
  # passed through agentgateway to its upstream, and nothing in this repo or the CRD validates it --
  # a wrong id is accepted at apply time and fails at CALL time, so every agent breaks on first use
  # with a green install. Confirm the id against the upstream before rolling anything but 057.
  model-configs:
    models:
      flash:
        model: gemini-4-hydrogen
      pro:
        model: gemini-4-hydrogen
      flashLow:
        model: gemini-4-hydrogen

  # pro-tier candidate: the heavy/reasoning agent of the fleet — it reads the installer's own values
  # surface and schema and reasons about a multi-component DAG.
  installer-agent:
    modelConfig:
      name: gemini-flash
  # pro-tier candidate: root-cause analysis is judgment work (rank competing causes, notice a missing piece of
  # evidence, refuse to guess) where the flash tier fabricates.
  incident-agent:
    modelConfig:
      name: gemini-flash
    # Same generic Kubernetes knowledge (chart 0.1.9+), here appended to the incident-agent's OWN
    # system prompt with no agents.* gate in front of it — so at the chart's true/true defaults it
    # is unconditionally live. OFF for the same reason and with the same schema-default mirror: the
    # 0.1.8 -> 0.1.9 bump is knowledge-only, so off makes it behaviour-neutral, and the chart
    # renders no knowledge ConfigMap at all when both are false.
    knowledge:
      kubernetes:
        playbook: false
        architecture: false
  # pro-tier candidate: an AUTHORING specialist — it composes RESTActions (+ widget apiRef wiring), the same
  # authoring role that runs frontend-agent on pro. Authoring valid CRs and reading apiserver
  # validation errors needs the stronger model.
  snowplow-agent:
    modelConfig:
      name: gemini-flash
  # pro-tier candidate: this agent AUTHORS + self-validates widget CRs. Authoring valid CRs and reading dry-run
  # errors needs the stronger model; the author->dry-run->fix loop in its prompt is the
  # correctness backstop.
  frontend-agent:
    modelConfig:
      name: gemini-flash
  # pro-tier candidate: an AUTHORING specialist. It composes multi-resource charts and then reads structured
  # validator output — JSON pointers, CEL messages — and edits the right template in response.
  # That read-diagnose-fix loop is what the stronger tier buys; on flash the loop burns
  # iterations re-fixing the same file.
  core-provider-agent:
    modelConfig:
      name: gemini-flash
  authn-agent:
    modelConfig:
      name: gemini-flash
  clickstack-agent:
    modelConfig:
      name: gemini-flash

  # The Config Connector operator image. SEEDED HERE DELIBERATELY, even though the
  # krateo-gcp-configconnector chart already defaults it correctly.
  #
  # The live CR already carries this key, and the self-bootstrap hook applies componentValues as an
  # RFC-7386 MERGE patch, so object fields DEEP-MERGE: a key once written to the CR is never removed
  # by a later patch that simply omits it. krateo-057 carried operator:cb81985 (the 1.99.0 commit-SHA
  # tag) long after the chart default moved to 1.158.0, and it silently SHADOWED it -- the StatefulSet
  # picked up GOMEMLIMIT and the 8 new CRDs from the new chart while still running the old binary, so
  # the upgrade looked clean and changed nothing that mattered.
  #
  # Diagnosing that is harder than it sounds: there is no schema `default` to find, and this file did
  # not mention the component at all. What gave it away was GOMEMLIMIT being PRESENT while the image
  # was not -- which rules out "the chart did not apply" and points at a value-level override.
  #
  # CONSEQUENCE: bump this IN LOCKSTEP with the gcp-configconnector / gcp-configconnector-crd pins in
  # chart/files/component-pins.yaml. If the two disagree, this value wins and the pin does nothing.
  #
  # Clearing the key instead (image: null, so the component chart's default wins and there is nothing
  # to keep in step) was tried and REJECTED: values.schema.json types this leaf as a string, so helm
  # refuses it with "at '/componentValues/gcp-configconnector/operator/image': got null, want string".
  # Allowing null would mean widening a typed leaf on a surface check-no-unknowns exists to keep
  # closed, to save a lockstep bump. Not worth it.
  gcp-configconnector:
    operator:
      image: gcr.io/gke-release/cnrm/operator:1.158.0
  # zendesk-kog: the end-user request path. Only rendered where features.serviceDesk is true
  # (default false), so these defaults are inert on an install that does not enable the service desk.
  #
  # WHY zendesk.baseUrl IS SET HERE AND NOT LEFT TO THE CR. The chart's OWN values.schema.json
  # declares `required: [zendesk]` at its root and `required: [baseUrl]` under it. The installer
  # renders every component through ONE umbrella chart, so a pinned chart with an unsatisfied
  # `required` fails the WHOLE render -- every other component stops reconciling, and the failure
  # does not name zendesk-kog. That class of mistake froze the demo cluster twice. A value here
  # guarantees the key is present at render time for every install that enables the feature.
  # It is a VALUES default, not a schema `default:`, so it does NOT materialize into any Installer
  # CR and an operator's CR value still wins. acmp is removing the chart-side `required` in 0.2.2;
  # this block can stay regardless, but do not remove it before that lands.
  zendesk-kog:
    zendesk:
      baseUrl: https://krateo.zendesk.com
    restDefinitions:
      # The END-USER request kind. The chart defaults this to FALSE, so it must be set explicitly.
      request:
        enabled: true
        referenceFieldId: 31750115749148
        ticketFormId: 31750463383196
        subjectPrefix: ""
        listMaxPages: 50
        requestKind:
          fieldId: 31750395634972
          values:
            bug: request_kind_bug
            feature: request_kind_feature
      # The AGENT-API kinds. BOTH default to enabled:true in the chart and expect credential Secrets
      # that the end-user design never provides (zendesk-api-credentials, a webhook signing Secret).
      # Left on they would render RestDefinitions whose configuration cannot resolve.
      ticket:
        enabled: false
      webhook:
        enabled: false
    plugin:
      # Receives Zendesk webhook events; defaults ON and needs the signing Secret. Off with the
      # webhook kind. NOTE the plugin DEPLOYMENT itself has no guard and always renders -- only the
      # receiver is switched off here.
      webhookReceiver:
        enabled: false
    snowplow:
      # The three RESTActions (tickets-view, ticket-comments, ticket-route) back the OLD ticket
      # widgets through the agent API. frontend's service-desk page reads ZendeskRequests directly
      # and the "Open in Zendesk" link was dropped, so these would reference a kind that is now off.
      restActions:
        enabled: false

# ---------------------------------------------------------------------------
# Component DAG. `deps` = component names whose Compositions must be Ready=True
# before this one's Composition is emitted. Versions pinned to installer 2.7.0.
# `repo` overrides ociRepo when a component lives elsewhere; `feature` gates it.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# component pins (`components:`) MOVED to files/component-pins.yaml — they are chart-managed
# and sourced via .Files.Get (the inst.componentsYaml helper), NOT values, so they are chart
# CONTENT immune to `helm upgrade --reuse-values`: a chart bump always propagates its component
# version/repo/dep pins on upgrade (previously --reuse-values froze them and stalled upgrades).
# User-tunable per-component overrides remain here under `componentValues:` above.
# ---------------------------------------------------------------------------

# authn's JWT signing-key generation. 1 (the default) renders exactly authn's own chart
# defaults, so existing clusters see no diff and no upgrade ever rotates the key. Bump it to
# rotate: generation N creates Secret `authn-jwt-signing-key-N` with a fresh RSA key and makes
# authn mount it and advertise kid `krateo-authn-key-N`. The old Secret is left in place --
# nothing here deletes key material. A bump signs out every session, because the key that
# signed every outstanding token stops being served; that is the point of the lever, and the
# reason it is not driven by anything automatic.
authn:
  jwt:
    keyGeneration: 1
